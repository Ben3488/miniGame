<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ 智慧小工具包 - Unified Premium Toolbox</title>
    <meta name="description" content="集合計分板、AI 圖片去背、及多功能影片下載的高質感小工具包。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Floating colorful glow bubbles in background -->
        <div class="bg-bubble bg-bubble-1"></div>
        <div class="bg-bubble bg-bubble-2"></div>
        <div class="bg-bubble bg-bubble-3"></div>

        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar glass-panel" id="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">🛠️</div>
                <div class="logo-text">
                    <h2>智慧工具包</h2>
                    <span class="logo-subtitle">Smart Toolbox v1.0</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-target="scoreboard" data-url="./scoreboard/index.html" id="nav-btn-scoreboard">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-label">寶貝表現計分板</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="multiscoreboard" data-url="./multi-scoreboard/index.html" id="nav-btn-multiscoreboard">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">兒童表現計分板</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="bgremover" data-url="./bg-remover/index.html" id="nav-btn-bgremover">
                    <span class="nav-icon">✨</span>
                    <span class="nav-label">智慧圖片去背</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="downloader" data-url="./video-downloader/index.html" id="nav-btn-downloader">
                    <span class="nav-icon">📥</span>
                    <span class="nav-label">極速影片下載</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="pomodoro" data-url="./pomodoro/index.html" id="nav-btn-pomodoro">
                    <span class="nav-icon">⏱️</span>
                    <span class="nav-label">番茄鐘與秒錶</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="ledmarquee" data-url="./led-marquee/index.html" id="nav-btn-ledmarquee">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">LED 手機彈幕</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="formatconverter" data-url="./format-converter/index.html" id="nav-btn-formatconverter">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-label">線上格式轉換器</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="urlshortener" data-url="./url-shortener/index.html" id="nav-btn-urlshortener">
                    <span class="nav-icon">🔗</span>
                    <span class="nav-label">短網址與 QR 碼</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="whitenoise" data-url="./white-noise/index.html" id="nav-btn-whitenoise">
                    <span class="nav-icon">🎵</span>
                    <span class="nav-label">白噪音專注空間</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="deepl" data-url="./deepl/index.html" id="nav-btn-deepl">
                    <span class="nav-icon">🌐</span>
                    <span class="nav-label">DeepL 翻譯官</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="chatgpt" data-url="./chatgpt/index.html" id="nav-btn-chatgpt">
                    <span class="nav-icon">🤖</span>
                    <span class="nav-label">ChatGPT / Claude</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="notionai" data-url="./notion-ai/index.html" id="nav-btn-notionai">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">Notion AI 筆記</span>
                    <span class="nav-indicator"></span>
                </button>
                <button class="nav-item" data-target="mediaai" data-url="./media-ai/index.html" id="nav-btn-mediaai">
                    <span class="nav-icon">🎥</span>
                    <span class="nav-label">自媒體 AI 助手</span>
                    <span class="nav-indicator"></span>
                </button>
                <div class="divider" style="margin: 4px 0; opacity: 0.5;"></div>
                <a href="../index.html" class="nav-item btn-back-home" style="text-decoration: none;">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">返回主選單</span>
                    <span class="nav-indicator"></span>
                </a>
            </nav>

            <!-- 橫向模式收合按鈕 -->
            <button class="sidebar-collapse-btn" id="btn-sidebar-collapse" title="收合導覽列" aria-label="收合導覽列">
                <svg id="collapse-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>

            <div class="sidebar-footer">
                <p>💡 提示：所有工具的資料皆會自動儲存於您的瀏覽器中。</p>
                <div class="divider"></div>
                <div class="footer-meta">
                    <span>© 2026 Smart Toolbox</span>
                    <button class="btn-pop-tab" id="btn-open-new-tab" title="在新分頁打開目前工具">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content Viewport -->
        <main class="dashboard-main glass-panel">
            <div class="iframe-wrapper" id="iframe-container">
                <iframe src="./scoreboard/index.html" id="tool-viewport" name="tool-viewport" title="工具內容"></iframe>
                <!-- Subtle loading animation layer for tool switching -->
                <div class="tool-loader hidden" id="tool-loader">
                    <div class="loader-spinner"></div>
                    <span>工具載入中...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- 橫向模式展開 FAB 按鈕（收合後顯示） -->
    <button class="sidebar-expand-fab" id="btn-sidebar-expand" title="展開工具列" aria-label="展開工具列">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <!-- Script File -->
    <script src="app.js"></script>
</body>
</html>
