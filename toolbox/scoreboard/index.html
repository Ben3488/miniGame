<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 兒童表現計分板 - 記錄寶貝的成長時刻</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Style -->
    <link rel="stylesheet" href="style.css">
    <!-- Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-background">
        <!-- Floating bubbles for visual depth -->
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <!-- Hidden SVG Definitions for Gradients -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
            <linearGradient id="gradient-green" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <linearGradient id="gradient-pink" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ec4899" />
                <stop offset="100%" stop-color="#d946ef" />
            </linearGradient>
            <linearGradient id="gradient-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#6366f1" />
            </linearGradient>
        </defs>
    </svg>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="header-title-container">
                <span class="header-logo">🏆</span>
                <div>
                    <div class="scoreboard-title-row">
                        <h1 id="scoreboard-title-text">寶貝表現計分板</h1>
                        <button id="btn-edit-scoreboard-title" class="btn-edit-icon" title="修改計分板名稱">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        </button>
                    </div>
                    <p class="header-subtitle" id="scoreboard-subtitle-text">記錄寶貝的日常好表現，累積 100 分拿大獎！</p>
                </div>
            </div>
            <button id="btn-reset-all" class="btn btn-danger" title="重設所有兒童的分數與紀錄">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>重設全部</span>
            </button>
        </header>

        <!-- Scoreboard Grid -->
        <main class="scoreboard-grid" id="scoreboard-container">
            <!-- Cards will be dynamically generated by JS -->
            <div class="card-loading">載入中，請稍候...</div>
        </main>

        <!-- History Log Section -->
        <section class="history-section">
            <div class="history-header">
                <div class="history-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clipboard-list"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22h6"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h6"/></svg>
                    <h2>📋 最近動態紀錄</h2>
                </div>
                <button id="btn-clear-history" class="btn btn-secondary btn-sm" title="僅清空歷史動態紀錄">
                    清空動態
                </button>
            </div>
            <div class="history-list-wrapper">
                <ul class="history-list" id="history-log-list">
                    <li class="history-empty">目前尚無任何紀錄，開始為寶貝加分吧！</li>
                </ul>
            </div>
        </section>
    </div>

    <!-- Edit Scoreboard Title Modal -->
    <div id="modal-edit-title" class="modal-overlay">
        <div class="modal-card glass-panel">
            <div class="modal-header">
                <h3>✏️ 修改計分板標題與說明</h3>
                <button class="modal-close" id="btn-title-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-scoreboard-title">計分板標題</label>
                    <input type="text" id="edit-scoreboard-title" placeholder="請輸入計分板標題" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="edit-scoreboard-subtitle">副標題 / 說明說明</label>
                    <input type="text" id="edit-scoreboard-subtitle" placeholder="請輸入計分板說明" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-title-modal-cancel" class="btn btn-secondary">取消</button>
                <button id="btn-title-modal-save" class="btn btn-primary">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="modal-edit-profile" class="modal-overlay">
        <div class="modal-card glass-panel">
            <div class="modal-header">
                <h3>✏️ 修改寶貝資料</h3>
                <button class="modal-close" id="btn-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-name">寶貝姓名</label>
                    <input type="text" id="edit-name" placeholder="請輸入姓名" maxlength="10">
                </div>
                <div class="form-group">
                    <label>選擇大頭貼 Emoji</label>
                    <div class="emoji-selector" id="emoji-grid">
                        <!-- Emojis will be dynamically populated -->
                    </div>
                </div>
                <div class="form-group">
                    <label>或 上傳自訂頭像照片</label>
                    <div class="upload-avatar-wrapper">
                        <input type="file" id="edit-avatar-file" accept="image/*" style="display: none;">
                        <button type="button" id="btn-upload-trigger" class="btn btn-secondary" style="width: 100%; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image" style="margin-right: 6px;"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                            選擇圖片上傳
                        </button>
                        <div class="upload-preview-row">
                            <div id="upload-preview" class="avatar-preview-circle">📷</div>
                            <div class="upload-preview-info">
                                <span id="upload-preview-status">尚未上傳自訂圖片</span>
                                <button type="button" id="btn-remove-uploaded" class="btn btn-danger btn-sm" style="display: none;">清除照片</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-modal-cancel" class="btn btn-secondary">取消</button>
                <button id="btn-modal-save" class="btn btn-primary">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- Reset Confirm Modal -->
    <div id="modal-reset-confirm" class="modal-overlay">
        <div class="modal-card glass-panel alert-modal">
            <div class="modal-header">
                <h3>⚠️ 確認重設全部？</h3>
                <button class="modal-close" id="btn-reset-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>此動作將會把**所有寶貝的分數歸零**，並**清空所有歷史紀錄**！</p>
                <p class="text-muted">（注意：寶貝的姓名與頭像仍會保留）</p>
            </div>
            <div class="modal-footer">
                <button id="btn-reset-cancel" class="btn btn-secondary">取消</button>
                <button id="btn-reset-confirm" class="btn btn-danger">確認重設</button>
            </div>
        </div>
    </div>

    <!-- App JavaScript -->
    <script src="app.js"></script>
</body>
</html>
