<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡坦島 Catan - 完整優化版</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --line: #374151;
      --gold: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f8fafc;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #0f172a, #2f2414);
    }

    .top {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: rgba(15, 23, 42, .92);
      border-bottom: 1px solid #3f321a;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    a.back-btn {
      color: #f8fafc;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
      font-weight: 600;
      font-size: 14px;
    }

    a.back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-2px);
    }

    h1 {
      margin: 0;
      color: #fbbf24;
      font-size: 22px;
    }

    .badge {
      border: 1px solid #b45309;
      color: #fcd34d;
      border-radius: 16px;
      padding: 5px 10px;
      font-size: 13px;
    }

    .app {
      display: grid;
      grid-template-columns: 300px 1fr 310px;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: rgba(31, 41, 55, .93);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .28);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #fbbf24;
    }

    .board {
      min-height: 620px;
      position: relative;
      overflow: auto;
      background: linear-gradient(#164e63, #0e7490);
      border: 1px solid #256d7e;
      border-radius: 8px;
    }

    .island {
      position: relative;
      width: 760px;
      height: 610px;
      margin: 18px auto;
    }

    .hex {
      position: absolute;
      width: 110px;
      height: 96px;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      display: grid;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, .25);
      color: #111827;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .3);
      transition: filter 0.2s;
    }

    .hex.robber {
      filter: brightness(0.6);
    }

    .hex.robber::after {
      content: "盜賊";
      position: absolute;
      inset: auto 20px 8px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-size: 12px;
      padding: 2px;
    }

    .wood {
      background: #2f8f46;
    }

    .brick {
      background: #b45309;
    }

    .sheep {
      background: #86efac;
    }

    .wheat {
      background: #fde047;
    }

    .ore {
      background: #94a3b8;
    }

    .desert {
      background: #d6b17b;
    }

    .pip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #fff7ed;
      display: grid;
      place-items: center;
      margin: auto;
      color: #7c2d12;
    }

    .site {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid white;
      background: rgba(15, 23, 42, .75);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 15px;
      z-index: 3;
      transition: transform 0.1s;
    }

    .site:hover {
      transform: scale(1.3);
      background: rgba(255, 255, 255, .3);
    }

    .site.p0 {
      background: #2563eb;
    }

    .site.p1 {
      background: #dc2626;
    }

    .site.city {
      border-radius: 5px;
      transform: rotate(45deg);
      font-weight: bold;
    }

    .road {
      position: absolute;
      height: 10px;
      background: rgba(255, 255, 255, .18);
      border-radius: 8px;
      transform-origin: left center;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, .25);
      cursor: pointer;
    }

    .road:hover {
      background: rgba(255, 255, 255, .6);
    }

    .road.p0 {
      background: #60a5fa;
      border-color: #2563eb;
    }

    .road.p1 {
      background: #f87171;
      border-color: #dc2626;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: linear-gradient(145deg, #d97706, #b45309);
      color: white;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    button:hover:not(:disabled) {
      background: linear-gradient(145deg, #f59e0b, #d97706);
      transform: translateY(-1px);
      box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #4b5563;
      color: #9ca3af;
      text-shadow: none;
      box-shadow: none;
      border-color: #374151;
    }

    button.active-mode {
      outline: 2px solid #fde047;
      outline-offset: 2px;
      background: linear-gradient(145deg, #fcd34d, #fbbf24);
      color: #78350f;
      text-shadow: none;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }

    select {
      border: 1px solid #785d1c;
      background: #451a03;
      color: white;
      border-radius: 6px;
      padding: 9px 11px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }
    
    select:focus {
      border-color: #fbbf24;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0;
    }

    .res {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .res div {
      background: #111827;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      position: relative;
    }

    .score {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .player {
      background: #111827;
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 10px;
      transition: 0.3s;
    }

    .active-player {
      outline: 2px solid #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
    }

    .num {
      color: #fbbf24;
      font-size: 28px;
      font-weight: 900;
    }

    .log {
      height: 300px;
      overflow: auto;
      background: #111827;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      color: #dbeafe;
    }

    .log div {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 4px;
    }

    .help {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width:1000px) {
      .app {
        grid-template-columns: 1fr
      }

      .board {
        min-height: 560px
      }

      .island {
        transform: scale(.78);
        transform-origin: top left;
        height: 760px
      }
    }
  </style>
</head>

<body>
  <div class="top"><a href="../index.html" class="back-btn">← 返回大廳</a>
    <h1>卡坦島 Catan</h1>
    <div class="badge">優化完整版</div>
  </div>
  <div class="app">
    <aside class="panel">
      <h2>你的回合</h2>
      <div id="turnText" class="help"></div>
      <div class="row"><button id="rollBtn">擲骰</button><button id="endBtn">結束回合</button></div>
      <div class="row">
        <button id="roadBtn">建道路</button>
        <button id="settleBtn">建村莊</button>
        <button id="cityBtn">升城市</button>
        <button id="devBtn">買發展卡</button>
      </div>
      <div class="row">
        <select id="give"></select>換<select id="take"></select><button id="tradeBtn">4:1 交易</button>
      </div>
      <p class="help"><strong>建設費用：</strong><br>道路 = 木+磚<br>村莊 = 木+磚+羊+麥<br>城市 = 2麥+3礦<br>發展卡 = 羊+麥+礦<br><br>※
        點擊建設按鈕後，選擇地圖上的空位即可建造。率先獲得 10 分者勝利。</p>
    </aside>
    <main class="board">
      <div id="island" class="island"></div>
    </main>
    <aside class="panel">
      <h2>分數</h2>
      <div class="score">
        <div id="p0" class="player"><b>你</b>
          <div class="num" id="vp0">0</div>
          <div style="font-size:12px;">路 <span id="roads0"></span> 村 <span id="settles0"></span> 城 <span
              id="cities0"></span><span id="army0" style="color:#fbbf24;font-weight:bold;"></span></div>
        </div>
        <div id="p1" class="player"><b>AI</b>
          <div class="num" id="vp1">0</div>
          <div style="font-size:12px;">路 <span id="roads1"></span> 村 <span id="settles1"></span> 城 <span
              id="cities1"></span><span id="army1" style="color:#fbbf24;font-weight:bold;"></span></div>
        </div>
      </div>
      <h2>你的資源</h2>
      <div id="resPanel" class="res"></div>
      <h2>遊戲紀錄</h2>
      <div id="log" class="log"></div>
    </aside>
  </div>
  <script>
    const RES = ['wood', 'brick', 'sheep', 'wheat', 'ore'];
    const RNAME = { wood: '木', brick: '磚', sheep: '羊', wheat: '麥', ore: '礦' };
    const ICON = { wood: '🌲', brick: '🧱', sheep: '🐑', wheat: '🌾', ore: '⛰️', desert: '🏜️' };
    const hexLayout = [[2, 0], [3, 0], [4, 0], [1, 1], [2, 1], [3, 1], [4, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [1, 3], [2, 3], [3, 3], [4, 3], [2, 4], [3, 4], [4, 4]];
    const resources = ['wood', 'wood', 'wood', 'wood', 'brick', 'brick', 'brick', 'sheep', 'sheep', 'sheep', 'sheep', 'wheat', 'wheat', 'wheat', 'wheat', 'ore', 'ore', 'ore', 'desert'];
    const nums = [5, 2, 6, 3, 8, 10, 9, 12, 11, 4, 8, 10, 9, 4, 5, 6, 3, 11];
    const sites = [
      { x: 270, y: 62, h: [0, 1] }, { x: 380, y: 62, h: [1, 2] }, { x: 220, y: 150, h: [0, 3, 4] }, { x: 325, y: 150, h: [0, 1, 4, 5] }, { x: 435, y: 150, h: [1, 2, 5, 6] }, { x: 540, y: 150, h: [2, 6] },
      { x: 165, y: 240, h: [3, 7, 8] }, { x: 270, y: 240, h: [3, 4, 8, 9] }, { x: 380, y: 240, h: [4, 5, 9, 10] }, { x: 490, y: 240, h: [5, 6, 10, 11] }, { x: 595, y: 240, h: [6, 11] },
      { x: 165, y: 335, h: [7, 12] }, { x: 270, y: 335, h: [8, 9, 12, 13] }, { x: 380, y: 335, h: [9, 10, 13, 14] }, { x: 490, y: 335, h: [10, 11, 14, 15] }, { x: 595, y: 335, h: [11, 15] },
      { x: 220, y: 425, h: [12, 16] }, { x: 325, y: 425, h: [12, 13, 16, 17] }, { x: 435, y: 425, h: [13, 14, 17, 18] }, { x: 540, y: 425, h: [14, 15, 18] },
      { x: 270, y: 515, h: [16, 17] }, { x: 380, y: 515, h: [17, 18] }
    ];
    const roads = [[0, 2], [0, 3], [1, 3], [1, 4], [2, 6], [2, 7], [3, 7], [3, 8], [4, 8], [4, 9], [5, 9], [5, 10], [6, 11], [6, 12], [7, 12], [8, 12], [8, 13], [9, 13], [9, 14], [10, 14], [10, 15], [11, 16], [12, 16], [12, 17], [13, 17], [13, 18], [14, 18], [14, 19], [15, 19], [16, 20], [17, 20], [17, 21], [18, 21], [19, 21]];
    let hexes, state, mode, rolled;
    const $ = id => document.getElementById(id);
    function shuffle(a) { return a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]); }

    function newGame() {
      const res = shuffle(resources), numbers = [...nums];
      hexes = res.map((r, i) => ({ res: r, num: r === 'desert' ? 0 : numbers.shift(), robber: r === 'desert' }));
      state = { turn: 0, players: [newPlayer('你', 0), newPlayer('AI', 1)], sites: sites.map(() => null), roads: roads.map(() => null), devDeck: shuffle(Array(14).fill('騎士').concat(Array(5).fill('得分'), ['道路建設', '道路建設', '豐收', '豐收'])), gameOver: false, largestArmy: null };
      setMode(''); rolled = false; $('log').innerHTML = '';
      setupInitial();
      log('<strong style="color:var(--gold)">遊戲開始！</strong>初始村莊與道路已建立。你先手。');
      render();
    }

    function newPlayer(name, id) { return { id, name, res: { wood: 2, brick: 2, sheep: 1, wheat: 1, ore: 0 }, roads: 13, settlements: 3, cities: 4, knights: 0, vpBonus: 0 }; }
    function setupInitial() {
      state.sites[2] = { owner: 0, city: false }; state.roads[0] = 0; state.sites[19] = { owner: 0, city: false }; state.roads[27] = 0;
      state.sites[5] = { owner: 1, city: false }; state.roads[10] = 1; state.sites[16] = { owner: 1, city: false }; state.roads[29] = 1;
    }

    function vp(p) {
      let v = p.vpBonus;
      state.sites.forEach(s => { if (s?.owner === p.id) v += s.city ? 2 : 1; });
      if (state.largestArmy === p.id) v += 2;
      return v;
    }

    function updateLargestArmy(pid) {
      const p = state.players[pid];
      if (p.knights >= 3) {
        if (state.largestArmy === null) {
          state.largestArmy = pid;
          log(`🎖️ <strong>${p.name}</strong> 獲得了「最大騎士」殊榮，獲得 2 分！`);
        } else if (state.largestArmy !== pid && p.knights > state.players[state.largestArmy].knights) {
          state.largestArmy = pid;
          log(`🎖️ <strong>${p.name}</strong> 搶走了「最大騎士」殊榮，獲得 2 分！`);
        }
      }
    }

    function hasCost(p, cost) { return Object.entries(cost).every(([r, n]) => p.res[r] >= n); }
    function pay(p, cost) { Object.entries(cost).forEach(([r, n]) => p.res[r] -= n); }
    function addRes(p, r, n = 1) { if (r !== 'desert') p.res[r] += n; }

    function roadTouchesPlayer(idx, pid) {
      const [a, b] = roads[idx];
      const checkNode = (node) => {
        if (state.sites[node]?.owner === pid) return true;
        if (state.sites[node]?.owner !== undefined) return false;
        return state.roads.some((owner, rIdx) => owner === pid && rIdx !== idx && (roads[rIdx][0] === node || roads[rIdx][1] === node));
      };
      return checkNode(a) || checkNode(b);
    }

    function siteLegal(idx, pid) {
      if (state.sites[idx]) return false;
      if (roads.some(([a, b]) => (a === idx || b === idx) && (state.sites[a]?.owner !== undefined || state.sites[b]?.owner !== undefined))) return false;
      return state.roads.some((o, i) => o === pid && (roads[i][0] === idx || roads[i][1] === idx));
    }

    function buildRoad(idx, pid, free = false, showLog = false) {
      const p = state.players[pid]; 
      if (state.roads[idx] !== null) { if (showLog) log('該位置已有道路。'); return false; }
      if (p.roads <= 0) { if (showLog) log('道路數量已達上限(15條)。'); return false; }
      if (!free && !hasCost(p, { wood: 1, brick: 1 })) { if (showLog) log('資源不足，建道路需要 1 木 1 磚。'); return false; }
      if (!roadTouchesPlayer(idx, pid)) { if (showLog) log('無效位置，道路必須與自己的道路或村莊相連，且不能穿越對手村莊。'); return false; }
      if (!free) pay(p, { wood: 1, brick: 1 });
      state.roads[idx] = pid; p.roads--; return true;
    }

    function buildSite(idx, pid, free = false, showLog = false) {
      const p = state.players[pid];
      if (state.sites[idx]) { if (showLog) log('該位置已有建築。'); return false; }
      if (p.settlements <= 0) { if (showLog) log('村莊數量已達上限(5座)。'); return false; }
      if (!free && !hasCost(p, { wood: 1, brick: 1, sheep: 1, wheat: 1 })) { if (showLog) log('資源不足，建村莊需要 木 磚 羊 麥。'); return false; }
      if (!siteLegal(idx, pid)) { if (showLog) log('無效位置！必須連接己方道路，且距離其他村莊至少兩步。'); return false; }
      if (!free) pay(p, { wood: 1, brick: 1, sheep: 1, wheat: 1 });
      state.sites[idx] = { owner: pid, city: false }; p.settlements--; return true;
    }

    function buildCity(idx, pid, showLog = false) {
      const p = state.players[pid], s = state.sites[idx];
      if (!s || s.owner !== pid || s.city) { if (showLog) log('只能升級自己現有的村莊。'); return false; }
      if (p.cities <= 0) { if (showLog) log('城市數量已達上限(4座)。'); return false; }
      if (!hasCost(p, { wheat: 2, ore: 3 })) { if (showLog) log('資源不足，升級城市需要 2 麥 3 礦。'); return false; }
      pay(p, { wheat: 2, ore: 3 }); s.city = true; p.cities--; p.settlements++; return true;
    }

    function roll() {
      if (state.turn !== 0 || rolled) return;
      const d1 = Math.ceil(Math.random() * 6), d2 = Math.ceil(Math.random() * 6), n = d1 + d2;
      rolled = true;
      if (n === 7) { log(`🎲 你擲出 <strong>7</strong> (盜賊出沒)`); robber(0); }
      else { log(`🎲 你擲出 <strong>${n}</strong>`); produce(n); }
      setMode(''); render(); checkWin();
    }

    function produce(n) {
      let logs = { 0: [], 1: [] };
      hexes.forEach((h, hi) => {
        if (h.num !== n || h.robber || h.res === 'desert') return;
        sites.forEach((s, si) => {
          if (s.h.includes(hi) && state.sites[si]) {
            const amt = state.sites[si].city ? 2 : 1;
            const p = state.players[state.sites[si].owner];
            addRes(p, h.res, amt);
            logs[p.id].push(`${amt}個${RNAME[h.res]}`);
          }
        });
      });
      
      if (logs[0].length || logs[1].length) {
        let msg = [];
        if (logs[0].length) msg.push(`你: ${logs[0].join(',')}`);
        if (logs[1].length) msg.push(`AI: ${logs[1].join(',')}`);
        log(`🌾 收穫 - ${msg.join(' | ')}`);
      } else {
        log(`🌾 本回合無人獲得資源。`);
      }
    }

    function robber(triggerPid) {
      const currentRobberIdx = hexes.findIndex(h => h.robber);
      hexes.forEach(h => h.robber = false);
      
      state.players.forEach(p => {
        const total = RES.reduce((a, r) => a + p.res[r], 0);
        if (total > 7) {
          let dropCount = Math.floor(total / 2);
          let dropped = [];
          for (let i = 0; i < dropCount; i++) {
            const rs = RES.filter(r => p.res[r] > 0);
            const rDrop = rs[Math.floor(Math.random() * rs.length)];
            p.res[rDrop]--;
            dropped.push(RNAME[rDrop]);
          }
          log(`⚠️ ${p.name} 資源超過 7 張，被盜賊丟棄：${dropped.join(', ')}`);
        }
      });
      
      const available = hexes.map((h, i) => i).filter(i => i !== currentRobberIdx);
      const newRobberIdx = available[Math.floor(Math.random() * available.length)];
      hexes[newRobberIdx].robber = true;

      const victims = new Set();
      sites.forEach((s, si) => {
        if (s.h.includes(newRobberIdx) && state.sites[si] && state.sites[si].owner !== triggerPid) {
          victims.add(state.sites[si].owner);
        }
      });

      const mine = state.players[triggerPid];
      if (victims.size > 0) {
        const victimId = Array.from(victims)[Math.floor(Math.random() * victims.size)];
        const other = state.players[victimId];
        const rs = RES.filter(r => other.res[r] > 0);
        if (rs.length) {
          const r = rs[Math.floor(Math.random() * rs.length)];
          other.res[r]--; mine.res[r]++;
          log(`🗡️ ${mine.name} 將盜賊移動到新的板塊，並從 ${other.name} 處隨機偷走 1 個資源。`);
        } else {
          log(`🗡️ ${mine.name} 將盜賊移動到新的板塊，但 ${other.name} 沒有資源可偷。`);
        }
      } else {
        log(`🗡️ ${mine.name} 將盜賊移動到新的板塊，但周圍沒有對手可偷。`);
      }
    }

    function buyDev(pid) {
      const p = state.players[pid];
      if (!state.devDeck.length) return (pid === 0 && log('發展卡已抽完。')), false;
      if (!hasCost(p, { sheep: 1, wheat: 1, ore: 1 })) return (pid === 0 && log('資源不足，購買發展卡需要 羊 麥 礦。')), false;

      pay(p, { sheep: 1, wheat: 1, ore: 1 });
      const card = state.devDeck.pop();
      let effect = '';
      if (card === '得分') { p.vpBonus++; effect = '，隱藏分數 +1！'; }
      else if (card === '騎士') { 
        p.knights++; 
        effect = '，移動了盜賊！'; 
      }
      else if (card === '豐收') { 
        const r1 = RES[Math.floor(Math.random() * RES.length)];
        const r2 = RES[Math.floor(Math.random() * RES.length)];
        addRes(p, r1, 1); addRes(p, r2, 1);
        effect = `，獲得了 ${RNAME[r1]} 和 ${RNAME[r2]}。`;
      }
      else if (card === '道路建設') {
        addRes(p, 'wood', 2);
        addRes(p, 'brick', 2);
        effect = `，獲得了 2木 2磚 以建設道路。`;
      }
      log(`🃏 ${p.name} 購買並使用了發展卡：<strong>${card}</strong>${effect}`);
      
      if (card === '騎士') {
        robber(pid); 
        updateLargestArmy(pid);
      }
      
      setMode('');
      return true;
    }

    function setMode(m) {
      mode = mode === m ? '' : m;
      ['road', 'settle', 'city'].forEach(k => {
        $(k + 'Btn').className = (mode === k) ? 'active-mode' : '';
      });
    }

    function clickSite(i) {
      if (state.turn !== 0 || !rolled || state.gameOver) return;
      if (mode === 'settle' && buildSite(i, 0, false, true)) log('🔨 你建立了一座新村莊。');
      if (mode === 'city' && buildCity(i, 0, true)) log('🏰 你將村莊升級為城市！');
      setMode(''); render(); checkWin();
    }
    
    function clickRoad(i) {
      if (state.turn !== 0 || !rolled || state.gameOver) return;
      if (mode === 'road' && buildRoad(i, 0, false, true)) log('🛤️ 你鋪設了一條新道路。');
      setMode(''); render(); checkWin();
    }

    function aiTurn() {
      state.turn = 1; rolled = true; render();
      const d1 = Math.ceil(Math.random() * 6), d2 = Math.ceil(Math.random() * 6), n = d1 + d2;

      if (n === 7) { log(`🎲 AI 擲出 <strong>7</strong>`); robber(1); }
      else { log(`🎲 AI 擲出 <strong>${n}</strong>`); produce(n); }

      const p = state.players[1];
      for (let k = 0; k < 4; k++) {
        let done = false;
        
        let cityTargets = shuffle(state.sites.map((s,i) => i));
        cityTargets.forEach(i => { if (!done && buildCity(i, 1)) { log('AI 升級了一座城市。'); done = true; } });
        
        if (!done) {
            let siteTargets = shuffle(sites.map((s,i) => i));
            siteTargets.forEach(i => { if (!done && buildSite(i, 1)) { log('AI 建立了一座新村莊。'); done = true; } });
        }
        
        if (!done) {
            let roadTargets = shuffle(roads.map((r,i) => i));
            roadTargets.forEach(i => { if (!done && buildRoad(i, 1)) { log('AI 鋪設了一條道路。'); done = true; } });
        }
        
        if (!done && buyDev(1)) done = true;
        if (!done) break;
      }
      checkWin();
      if (!state.gameOver) { state.turn = 0; rolled = false; log('🟢 輪到你了。'); render(); }
    }

    function endTurn() { if (state.turn === 0 && rolled && !state.gameOver) { setMode(''); setTimeout(aiTurn, 500); } }

    function trade() {
      const p = state.players[0], g = $('give').value, t = $('take').value;
      if (g === t) { log('❌ 交易失敗，不能選擇相同的資源。'); return; }
      if (p.res[g] < 4) { log(`❌ 交易失敗，你的 ${RNAME[g]} 數量不足 4 個。`); return; }
      p.res[g] -= 4; p.res[t]++;
      log(`🔄 你使用了 4 個 ${RNAME[g]} 換取 1 個 ${RNAME[t]}。`);
      setMode(''); render();
    }

    function checkWin() {
      [0, 1].forEach(i => { if (vp(state.players[i]) >= 10 && !state.gameOver) { state.gameOver = true; log(`🏆 <strong>${state.players[i].name} 達到了 10 分，贏得了遊戲！</strong>`); render(); } });
    }

    function render() {
      $('turnText').innerHTML = state.gameOver ? '遊戲已結束' : (state.turn === 0 ? '🟢 你的回合 - ' + (rolled ? '請選擇建設或結束' : '請先擲骰') : '🔴 AI 回合中...');
      $('rollBtn').disabled = state.turn !== 0 || rolled || state.gameOver;
      $('endBtn').disabled = state.turn !== 0 || !rolled || state.gameOver;

      ['road', 'settle', 'city', 'dev'].forEach(m => $(m + 'Btn').disabled = state.turn !== 0 || !rolled || state.gameOver);

      $('vp0').textContent = vp(state.players[0]); $('vp1').textContent = vp(state.players[1]);
      $('p0').className = 'player ' + (state.turn === 0 && !state.gameOver ? 'active-player' : '');
      $('p1').className = 'player ' + (state.turn === 1 && !state.gameOver ? 'active-player' : '');

      [0, 1].forEach(i => { 
        const p = state.players[i]; 
        $('roads' + i).textContent = p.roads; 
        $('settles' + i).textContent = p.settlements; 
        $('cities' + i).textContent = p.cities; 
        $('army' + i).textContent = state.largestArmy === i ? ' 🎖️最大騎士' : '';
      });
      $('resPanel').innerHTML = RES.map(r => `<div><span style="font-size:18px;">${ICON[r]}</span><br>${RNAME[r]} <b>${state.players[0].res[r]}</b></div>`).join('');
      drawIsland();
    }

    function drawIsland() {
      const el = $('island'); el.innerHTML = '';
      hexLayout.forEach(([x, y], i) => { const h = hexes[i], d = document.createElement('div'); d.className = `hex ${h.res} ${h.robber ? 'robber' : ''}`; d.style.left = (125 + x * 95 - y * 48) + 'px'; d.style.top = (30 + y * 90) + 'px'; d.innerHTML = `<div style="font-size:24px">${ICON[h.res]}<br><span class="pip">${h.num || ''}</span></div>`; el.appendChild(d); });
      roads.forEach(([a, b], i) => { const A = sites[a], B = sites[b], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy), r = document.createElement('div'); r.className = `road ${state.roads[i] !== null ? 'p' + state.roads[i] : ''}`; r.style.left = A.x + 'px'; r.style.top = A.y + 'px'; r.style.width = len + 'px'; r.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`; r.onclick = () => clickRoad(i); el.appendChild(r); });
      sites.forEach((s, i) => { const o = state.sites[i], d = document.createElement('div'); d.className = `site ${o ? 'p' + o.owner : ''} ${o?.city ? 'city' : ''}`; d.style.left = (s.x - 14) + 'px'; d.style.top = (s.y - 14) + 'px'; d.textContent = o ? (o.city ? '城' : '村') : ''; d.onclick = () => clickSite(i); el.appendChild(d); });
    }

    function log(msg) {
      const logBox = $('log');
      logBox.innerHTML = `<div>${msg}</div>` + logBox.innerHTML;
    }

    $('rollBtn').onclick = roll; $('endBtn').onclick = endTurn;
    $('roadBtn').onclick = () => setMode('road');
    $('settleBtn').onclick = () => setMode('settle');
    $('cityBtn').onclick = () => setMode('city');
    $('devBtn').onclick = () => { if (buyDev(0)) { render(); checkWin(); } };
    $('tradeBtn').onclick = trade;
    RES.forEach(r => { $('give').innerHTML += `<option value="${r}">${RNAME[r]}</option>`; $('take').innerHTML += `<option value="${r}">${RNAME[r]}</option>`; });

    newGame();
  </script>
</body>

</html>
