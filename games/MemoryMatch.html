<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="記憶翻牌對對碰 (Neon Memory Match) — 流光玻璃擬態 3D 翻牌記憶遊戲，支援單人計時挑戰、雙人對決與三段智慧 AI 對戰。">
    <title>記憶翻牌對對碰 | Neon Memory Match</title>

    <!-- Google Fonts: Outfit for display, Inter for UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(13, 20, 35, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.4);
            --pink-neon: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.4);
            --amber-neon: #fbbf24;
            --emerald-neon: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Ambient Glows */
        .ambient-glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.42;
            pointer-events: none;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        .cyan-glow {
            background-color: var(--cyan-neon);
            top: 10%;
            left: 10%;
        }

        .pink-glow {
            background-color: var(--pink-neon);
            bottom: 10%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.32; }
            100% { transform: scale(1.28) translate(25px, 20px); opacity: 0.52; }
        }

        /* Particle Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card-glass {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .screen {
            width: 100%;
            display: none;
            flex-direction: column;
            animation: fade-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Menu Screen --- */
        .game-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2.7rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, var(--cyan-neon), var(--pink-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 3px;
            margin-top: 10px;
        }

        .menu-box {
            padding: 28px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .mode-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 600;
            border-radius: 14px;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 15px 20px;
            justify-content: flex-start;
        }

        .btn-mode i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-mode.active {
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--cyan-neon);
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .grid-options,
        .diff-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 11px 8px;
            font-size: 0.88rem;
            border-radius: 12px;
            flex-direction: column;
            gap: 3px;
        }

        .btn-option small {
            font-size: 0.72rem;
            opacity: 0.75;
            font-weight: 400;
        }

        .btn-option:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
        }

        .btn-grid.active {
            background: rgba(0, 242, 254, 0.12);
            border-color: var(--cyan-neon);
            color: var(--cyan-neon);
            box-shadow: 0 0 14px rgba(0, 242, 254, 0.2);
        }

        .btn-diff.active {
            background: rgba(255, 0, 127, 0.12);
            border-color: var(--pink-neon);
            color: var(--pink-neon);
            box-shadow: 0 0 14px rgba(255, 0, 127, 0.25);
        }

        .collapsible-section {
            max-height: 150px;
            opacity: 1;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        .collapsible-section.hidden {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            margin-top: -10px;
        }

        .best-record-banner {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .best-record-banner strong {
            color: var(--amber-neon);
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan-neon), #00d2ff);
            color: #030712;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 14px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        /* --- Game Screen --- */
        .game-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            width: 100%;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .nav-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-title span {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .badge-sub {
            font-size: 0.72rem !important;
            background: rgba(0, 242, 254, 0.14);
            border: 1px solid var(--cyan-neon);
            color: var(--cyan-neon);
            padding: 2px 9px;
            border-radius: 20px;
        }

        /* HUD Panels (Solo vs Versus) */
        .hud-solo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 14px;
        }

        .hud-solo.hidden,
        .hud-versus.hidden {
            display: none;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stars-row {
            color: var(--amber-neon);
            font-size: 1rem;
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }

        .stars-row .star-dim {
            color: rgba(255, 255, 255, 0.18);
        }

        /* Versus Scoreboard */
        .hud-versus {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 14px;
            align-items: center;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .player-card.p1.active-turn {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 15px var(--cyan-glow);
            background: rgba(0, 242, 254, 0.06);
        }

        .player-card.p2.active-turn {
            border-color: var(--pink-neon);
            box-shadow: 0 0 15px var(--pink-glow);
            background: rgba(255, 0, 127, 0.06);
        }

        .player-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .player-turn-tag {
            font-size: 0.68rem;
            color: var(--cyan-neon);
            font-weight: 600;
        }

        .player-card.p2 .player-turn-tag {
            color: var(--pink-neon);
        }

        .player-score {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .vs-divider {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            min-height: 24px;
        }

        .cyan-text { color: var(--cyan-neon); font-weight: 700; }
        .pink-text { color: var(--pink-neon); font-weight: 700; }
        .amber-text { color: var(--amber-neon); font-weight: 700; }

        /* Card Grid Container */
        .board-wrapper {
            width: 100%;
            position: relative;
            margin-bottom: 18px;
        }

        .memory-grid {
            width: 100%;
            padding: 14px;
            display: grid;
            gap: 10px;
            perspective: 1000px;
        }

        .memory-grid.grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .memory-grid.grid-4x5 {
            grid-template-columns: repeat(5, 1fr);
        }

        .memory-grid.grid-6x6 {
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            padding: 10px;
        }

        /* 3D Flip Card */
        .memory-card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .memory-card:hover:not(.flipped):not(.matched) {
            transform: translateY(-2px);
        }

        .memory-card.flipped,
        .memory-card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }

        /* Card Back (Face-down) */
        .card-back {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.08);
        }

        .card-back::after {
            content: '?';
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: rgba(0, 242, 254, 0.35);
        }

        .grid-6x6 .card-back::after {
            font-size: 1.05rem;
        }

        .memory-card:hover:not(.flipped):not(.matched) .card-back {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.15);
        }

        /* Card Front (Face-up) */
        .card-front {
            transform: rotateY(180deg);
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(0, 242, 254, 0.55);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.25);
            font-size: 1.75rem;
        }

        .grid-6x6 .card-front {
            font-size: 1.25rem;
            border-radius: 10px;
        }

        .grid-6x6 .card-back {
            border-radius: 10px;
        }

        /* Matched state */
        .memory-card.matched .card-front {
            border-color: var(--emerald-neon);
            background: rgba(16, 185, 129, 0.15);
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.4);
            animation: match-pulse 0.4s ease;
        }

        .memory-card.matched-p2 .card-front {
            border-color: var(--pink-neon);
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.4);
        }

        @keyframes match-pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.12); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Result Overlay inside Board */
        .board-overlay {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .board-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .overlay-stars {
            font-size: 1.7rem;
            color: var(--amber-neon);
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
        }

        .overlay-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .overlay-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }

        .overlay-actions .btn {
            flex: 1;
            padding: 12px;
        }

        .game-controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .game-controls .btn {
            flex: 1;
        }

        @media (max-width: 420px) {
            .app-container { padding: 14px; }
            .logo-text { font-size: 2.2rem; }
            .menu-box { padding: 20px; }
            .memory-grid { padding: 10px; gap: 8px; }
            .card-front { font-size: 1.45rem; }
            .grid-6x6 .card-front { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="ambient-glow cyan-glow"></div>
    <div class="ambient-glow pink-glow"></div>

    <div class="app-container">
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <header class="game-header">
                <h1 class="logo-text">NEON<br><span class="highlight">MEMORY MATCH</span></h1>
                <p class="tagline">記憶翻牌對對碰 ‧ 極光腦力激盪</p>
            </header>

            <div class="menu-box card-glass">
                <div>
                    <h2 class="section-title">選擇遊戲模式</h2>
                    <div class="mode-options">
                        <button class="btn btn-mode active" data-mode="solo">
                            <i class="fa-solid fa-stopwatch"></i>
                            <span>單人計時挑戰 (Solo)</span>
                        </button>
                        <button class="btn btn-mode" data-mode="pvp">
                            <i class="fa-solid fa-user-group"></i>
                            <span>雙人對決 (PvP)</span>
                        </button>
                        <button class="btn btn-mode" data-mode="pve">
                            <i class="fa-solid fa-robot"></i>
                            <span>挑戰 AI (PvE)</span>
                        </button>
                    </div>
                </div>

                <!-- Grid Size Selection -->
                <div>
                    <h2 class="section-title">牌面規模</h2>
                    <div class="grid-options">
                        <button class="btn btn-option btn-grid active" data-grid="4x4">
                            <span>4 × 4</span>
                            <small>16 張 (8對)</small>
                        </button>
                        <button class="btn btn-option btn-grid" data-grid="4x5">
                            <span>4 × 5</span>
                            <small>20 張 (10對)</small>
                        </button>
                        <button class="btn btn-option btn-grid" data-grid="6x6">
                            <span>6 × 6</span>
                            <small>36 張 (18對)</small>
                        </button>
                    </div>
                </div>

                <!-- AI Difficulty Selection (PvE Only) -->
                <div id="diff-section" class="collapsible-section hidden">
                    <h2 class="section-title">AI 記憶強度</h2>
                    <div class="diff-options">
                        <button class="btn btn-option btn-diff" data-diff="easy">
                            <span>輕鬆</span>
                            <small>短暫記憶</small>
                        </button>
                        <button class="btn btn-option btn-diff active" data-diff="medium">
                            <span>聰明</span>
                            <small>記住近期 6 張</small>
                        </button>
                        <button class="btn btn-option btn-diff" data-diff="hard">
                            <span>地獄</span>
                            <small>過目不忘</small>
                        </button>
                    </div>
                </div>

                <!-- Solo Best Record Preview -->
                <div id="best-record-banner" class="best-record-banner">
                    <span><i class="fa-solid fa-trophy" style="color: var(--amber-neon); margin-right: 6px;"></i>目前規模最佳紀錄</span>
                    <strong id="menu-best-text">尚無紀錄</strong>
                </div>

                <button id="btn-start" class="btn btn-primary">
                    <span>開始翻牌</span>
                    <i class="fa-solid fa-play"></i>
                </button>

                <a href="../index.html?zone=games" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>返回遊戲大廳</span>
                </a>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-nav">
                <button id="btn-back-menu" class="btn btn-icon" title="返回選單">
                    <i class="fa-solid fa-house"></i>
                </button>
                <div class="nav-title">
                    <span id="nav-mode-title">單人計時挑戰</span>
                    <span id="nav-sub-badge" class="badge-sub">4 × 4 (16張)</span>
                </div>
                <button id="btn-sound-toggle" class="btn btn-icon" title="切換音效">
                    <i id="sound-icon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>

            <!-- Solo HUD -->
            <div id="hud-solo" class="hud-solo">
                <div class="stat-card">
                    <span class="stat-label">翻牌步數</span>
                    <span class="stat-value cyan-text" id="solo-moves">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">計時</span>
                    <span class="stat-value" id="solo-timer">00:00</span>
                </div>
                <div class="stat-card">

            <!-- Versus HUD (PvP / PvE) -->

            <!-- Status Announcement -->

                </button>
                <a href="../index.html?zone=games" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>返回遊戲大廳</span>

    </div>

    <script>
        // Symbol Pool (18 distinct high-contrast neon icons/emojis for up to 6x6 = 18 pairs)
        const CARD_SYMBOLS = [
            { icon: 'fa-bolt', color: '#00f2fe' },
            { icon: 'fa-rocket', color: '#ff007f' },
            { icon: 'fa-gem', color: '#a855f7' },
            { icon: 'fa-fire-flame-curved', color: '#f97316' },
            { icon: 'fa-moon', color: '#facc15' },
            { icon: 'fa-heart', color: '#f43f5e' },
            { icon: 'fa-crown', color: '#fbbf24' },
            { icon: 'fa-ghost', color: '#38bdf8' },
            { icon: 'fa-dragon', color: '#10b981' },
            { icon: 'fa-meteor', color: '#ec4899' },
            { icon: 'fa-snowflake', color: '#67e8f9' },
            { icon: 'fa-Atom', iconClass: 'fa-atom', color: '#c084fc' },
            { icon: 'fa-compass', color: '#4ade80' },
            { icon: 'fa-feather-pointed', color: '#fb7185' },
            { icon: 'fa-sun', color: '#fde047' },
            { icon: 'fa-shield-halved', color: '#60a5fa' },
            { icon: 'fa-wand-magic-sparkles', color: '#e879f9' },
            { icon: 'fa-clover', color: '#34d399' }
        ];

        // Web Audio API Sound Manager
        const SoundManager = {
            ctx: null,
            enabled: true,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            toggle() {
                this.enabled = !this.enabled;
                localStorage.setItem('neon_memory_sound', this.enabled);
                return this.enabled;
            },

            playFlip() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                gain.gain.setValueAtTime(0.11, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            },

            playMatch() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.14, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.18);
                });
            },

            playMismatch() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.16);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            },

            playVictory() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [440, 554.37, 659.25, 880];
                const now = this.ctx.currentTime;
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.09);
                    gain.gain.setValueAtTime(0.15, now + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.25);
                });
            }
        };

        // Particle Celebration System
        const ParticleSystem = {
            canvas: null,
            ctx: null,
            particles: [],
            animId: null,

            init() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },

            burst(x, y, color = '#00f2fe', count = 24) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1.5,
                        size: Math.random() * 4 + 2,
                        color,
                        alpha: 1,
                        decay: Math.random() * 0.02 + 0.015,
                        gravity: 0.12
                    });
                }
                if (!this.animId) this.loop();
            },

            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = p.color;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
                if (this.particles.length > 0) {
                    this.animId = requestAnimationFrame(() => this.loop());
                } else {
                    this.animId = null;
                }
            }
        };

        // Memory Match Controller
        const MemoryGame = {
            mode: 'solo',       // 'solo', 'pvp', 'pve'
            gridKey: '4x4',     // '4x4' (16), '4x5' (20), '6x6' (36)
            difficulty: 'medium', // 'easy', 'medium', 'hard'
            cards: [],
            flippedIndices: [],
            matchedCount: 0,
            totalPairs: 8,
            moves: 0,
            elapsedSeconds: 0,
            timerStarted: false,
            timerIntervalId: null,
            pendingTimeoutIds: [],
            boardLocked: false,
            currentTurn: 1,     // 1 = Player 1, 2 = Player 2 or AI
            scores: { 1: 0, 2: 0 },
            aiMemory: [],       // Array of { index, pairId }
            bestRecords: {},

            init() {
                this.cacheDOM();
                this.loadStorage();
                this.bindEvents();
                ParticleSystem.init();
                this.updateMenuBestBanner();
            },

            cacheDOM() {
                this.menuScreen = document.getElementById('menu-screen');
                this.gameScreen = document.getElementById('game-screen');
                this.diffSection = document.getElementById('diff-section');
                this.bestRecordBanner = document.getElementById('best-record-banner');
                this.menuBestText = document.getElementById('menu-best-text');
                this.btnStart = document.getElementById('btn-start');
                this.btnBackMenu = document.getElementById('btn-back-menu');
                this.btnSoundToggle = document.getElementById('btn-sound-toggle');
                this.soundIcon = document.getElementById('sound-icon');
                this.navModeTitle = document.getElementById('nav-mode-title');
                this.navSubBadge = document.getElementById('nav-sub-badge');
                this.hudSolo = document.getElementById('hud-solo');
                this.hudVersus = document.getElementById('hud-versus');
                this.soloMovesEl = document.getElementById('solo-moves');
                this.soloTimerEl = document.getElementById('solo-timer');
                this.soloStarsEl = document.getElementById('solo-stars');
                this.cardP1 = document.getElementById('card-p1');
                this.cardP2 = document.getElementById('card-p2');
                this.labelP1 = document.getElementById('label-p1');
                this.labelP2 = document.getElementById('label-p2');
                this.tagP1 = document.getElementById('tag-p1');
                this.tagP2 = document.getElementById('tag-p2');
                this.scoreP1 = document.getElementById('score-p1');
                this.scoreP2 = document.getElementById('score-p2');
                this.statusBar = document.getElementById('status-bar');
                this.gridEl = document.getElementById('memory-grid');
                this.overlayEl = document.getElementById('board-overlay');
                this.overlayStarsEl = document.getElementById('overlay-stars');
                this.overlayTitleEl = document.getElementById('overlay-title');
                this.overlayDescEl = document.getElementById('overlay-desc');
                this.btnOverlayMenu = document.getElementById('btn-overlay-menu');
                this.btnOverlayAgain = document.getElementById('btn-overlay-again');
                this.btnRestart = document.getElementById('btn-restart');
            },

            loadStorage() {
                const savedSound = localStorage.getItem('neon_memory_sound');
                if (savedSound !== null) {
                    SoundManager.enabled = savedSound === 'true';
                }
                this.updateSoundIcon();

                try {
                    const savedBest = JSON.parse(localStorage.getItem('neon_memory_best_v1') || '{}');
                    if (savedBest && typeof savedBest === 'object') {
                        this.bestRecords = savedBest;
                    }
                } catch (e) {
                    this.bestRecords = {};
                }
            },

            saveBestRecord(gridKey, moves, seconds) {
                const prev = this.bestRecords[gridKey];
                const isBetter = !prev || moves < prev.moves || (moves === prev.moves && seconds < prev.seconds);
                if (isBetter) {
                    this.bestRecords[gridKey] = { moves, seconds };
                    localStorage.setItem('neon_memory_best_v1', JSON.stringify(this.bestRecords));
                }
                return isBetter;
            },

            updateSoundIcon() {
                this.soundIcon.className = SoundManager.enabled
                    ? 'fa-solid fa-volume-high'
                    : 'fa-solid fa-volume-xmark';
            },

            bindEvents() {
                document.querySelectorAll('.btn-mode').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        SoundManager.playFlip();
                        document.querySelectorAll('.btn-mode').forEach((b) => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.mode = btn.dataset.mode;

                        if (this.mode === 'pve') {
                            this.diffSection.classList.remove('hidden');
                        } else {
                            this.diffSection.classList.add('hidden');
                        }

                        this.bestRecordBanner.style.display = this.mode === 'solo' ? 'flex' : 'none';
                    });
                });

                document.querySelectorAll('.btn-grid').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        SoundManager.playFlip();
                        document.querySelectorAll('.btn-grid').forEach((b) => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.gridKey = btn.dataset.grid;
                        this.updateMenuBestBanner();
                    });
                });

                document.querySelectorAll('.btn-diff').forEach((btn) => {
                    btn.addEventListener('click', () => {
                        SoundManager.playFlip();
                        document.querySelectorAll('.btn-diff').forEach((b) => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.difficulty = btn.dataset.diff;
                    });
                });

                this.btnStart.addEventListener('click', () => {
                    SoundManager.playFlip();
                    this.startGame();
                });

                this.btnBackMenu.addEventListener('click', () => {
                    SoundManager.playFlip();
                    this.showMenu();
                });

                this.btnOverlayMenu.addEventListener('click', () => {
                    SoundManager.playFlip();
                    this.showMenu();
                });

                this.btnOverlayAgain.addEventListener('click', () => {
                    SoundManager.playFlip();
                    this.resetRound();
                });

                this.btnRestart.addEventListener('click', () => {
                    SoundManager.playFlip();
                    this.resetRound();
                });

                this.btnSoundToggle.addEventListener('click', () => {
                    SoundManager.toggle();
                    this.updateSoundIcon();
                    if (SoundManager.enabled) SoundManager.playFlip();
                });
            },

            updateMenuBestBanner() {
                const rec = this.bestRecords[this.gridKey];
                if (!rec) {
                    this.menuBestText.textContent = '尚無紀錄';
                } else {
                    this.menuBestText.textContent = `${rec.moves} 步 / ${this.formatTime(rec.seconds)}`;
                }
            },

            scheduleTimeout(fn, delay) {
                const id = setTimeout(() => {
                    this.pendingTimeoutIds = this.pendingTimeoutIds.filter((item) => item !== id);
                    fn();
                }, delay);
                this.pendingTimeoutIds.push(id);
                return id;
            },

            clearAllTimers() {
                if (this.timerIntervalId !== null) {
                    clearInterval(this.timerIntervalId);
                    this.timerIntervalId = null;
                }
                this.pendingTimeoutIds.forEach((id) => clearTimeout(id));
                this.pendingTimeoutIds = [];
            },

            startGame() {
                this.menuScreen.classList.remove('active');
                this.gameScreen.classList.add('active');

                const modeNames = {
                    solo: '單人計時挑戰',
                    pvp: '雙人對決 (PvP)',
                    pve: '挑戰 AI (PvE)'
                };
                this.navModeTitle.textContent = modeNames[this.mode];

                const diffNames = { easy: '輕鬆 AI', medium: '聰明 AI', hard: '地獄 AI' };
                const gridLabels = { '4x4': '4 × 4 (16張)', '4x5': '4 × 5 (20張)', '6x6': '6 × 6 (36張)' };
                this.navSubBadge.textContent = this.mode === 'pve'
                    ? `${gridLabels[this.gridKey]} ‧ ${diffNames[this.difficulty]}`
                    : gridLabels[this.gridKey];

                if (this.mode === 'solo') {
                    this.hudSolo.classList.remove('hidden');
                    this.hudVersus.classList.add('hidden');
                } else {
                    this.hudSolo.classList.add('hidden');
                    this.hudVersus.classList.remove('hidden');
                    this.labelP1.textContent = this.mode === 'pvp' ? '玩家 1' : '玩家';
                    this.labelP2.textContent = this.mode === 'pvp' ? '玩家 2' : `AI (${diffNames[this.difficulty]})`;
                }

                this.resetRound();
            },

            showMenu() {
                this.clearAllTimers();
                this.gameScreen.classList.remove('active');
                this.menuScreen.classList.add('active');
                this.updateMenuBestBanner();
            },

            resetRound() {
                this.clearAllTimers();
                this.overlayEl.classList.remove('active');

                const totalCardsMap = { '4x4': 16, '4x5': 20, '6x6': 36 };
                const totalCards = totalCardsMap[this.gridKey] || 16;
                this.totalPairs = totalCards / 2;

                // Build & shuffle deck
                const selectedSymbols = CARD_SYMBOLS.slice(0, this.totalPairs);
                const deck = [];
                selectedSymbols.forEach((sym, pairId) => {
                    deck.push({ pairId, icon: sym.iconClass || sym.icon, color: sym.color, matched: false });
                    deck.push({ pairId, icon: sym.iconClass || sym.icon, color: sym.color, matched: false });
                });

                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }

                this.cards = deck;
                this.flippedIndices = [];
                this.matchedCount = 0;
                this.moves = 0;
                this.elapsedSeconds = 0;
                this.timerStarted = false;
                this.boardLocked = false;
                this.currentTurn = 1;
                this.scores = { 1: 0, 2: 0 };
                this.aiMemory = [];

                this.renderBoard();
                this.updateHUD();
                this.updateStatusText();
            },

            renderBoard() {
                this.gridEl.className = `memory-grid card-glass grid-${this.gridKey}`;
                this.gridEl.innerHTML = '';
                this.cardElements = [];

                this.cards.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'memory-card';
                    cardEl.dataset.index = index;

                    const back = document.createElement('div');
                    back.className = 'card-face card-back';

                    const front = document.createElement('div');
                    front.className = 'card-face card-front';
                    front.innerHTML = `<i class="fa-solid ${card.icon}" style="color: ${card.color}; filter: drop-shadow(0 0 8px ${card.color});"></i>`;

                    cardEl.appendChild(back);
                    cardEl.appendChild(front);

                    cardEl.addEventListener('click', () => this.handlePlayerCardClick(index));
                    this.gridEl.appendChild(cardEl);
                    this.cardElements.push(cardEl);
                });
            },

            startTimerIfNeeded() {
                if (this.mode !== 'solo' || this.timerStarted) return;
                this.timerStarted = true;
                this.timerIntervalId = setInterval(() => {
                    this.elapsedSeconds++;
                    this.soloTimerEl.textContent = this.formatTime(this.elapsedSeconds);
                }, 1000);
            },

            formatTime(sec) {
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                return `${m}:${s}`;
            },

            getStarRating() {
                // 3 stars: moves <= 1.5 * totalPairs; 2 stars: moves <= 2.2 * totalPairs; else 1 star
                if (this.moves <= Math.ceil(this.totalPairs * 1.5)) return 3;
                if (this.moves <= Math.ceil(this.totalPairs * 2.2)) return 2;
                return 1;
            },

            updateHUD() {
                if (this.mode === 'solo') {
                    this.soloMovesEl.textContent = this.moves;
                    this.soloTimerEl.textContent = this.formatTime(this.elapsedSeconds);
                    const stars = this.getStarRating();
                    this.soloStarsEl.innerHTML = [1, 2, 3]
                        .map((i) => `<i class="fa-solid fa-star ${i <= stars ? '' : 'star-dim'}"></i>`)
                        .join('');
                } else {
                    this.scoreP1.textContent = this.scores[1];
                    this.scoreP2.textContent = this.scores[2];
                    if (this.currentTurn === 1) {
                        this.cardP1.classList.add('active-turn');
                        this.cardP2.classList.remove('active-turn');
                        this.tagP1.textContent = '行動中';
                        this.tagP2.textContent = '等待中';
                    } else {
                        this.cardP2.classList.add('active-turn');
                        this.cardP1.classList.remove('active-turn');
                        this.tagP2.textContent = '行動中';
                        this.tagP1.textContent = '等待中';
                    }
                }
            },

            updateStatusText(customHTML) {
                if (customHTML) {
                    this.statusBar.innerHTML = customHTML;
                    return;
                }
                if (this.mode === 'solo') {
                    this.statusBar.innerHTML = `已配對 <span class="cyan-text">${this.matchedCount} / ${this.totalPairs}</span> 組`;
                } else if (this.mode === 'pvp') {
                    const pColor = this.currentTurn === 1 ? 'cyan-text' : 'pink-text';
                    this.statusBar.innerHTML = `輪到 <span class="${pColor}">玩家 ${this.currentTurn}</span> 翻牌（配對成功可再翻一次）`;
                } else {
                    if (this.currentTurn === 1) {
                        this.statusBar.innerHTML = `輪到 <span class="cyan-text">你的回合</span>（配對成功可連續行動）`;
                    } else {
                        this.statusBar.innerHTML = `<span class="pink-text">AI 正在回想牌面...</span>`;
                    }
                }
            },

            handlePlayerCardClick(index) {
                if (this.boardLocked) return;
                if (this.mode === 'pve' && this.currentTurn === 2) return;
                if (this.cards[index].matched) return;
                if (this.flippedIndices.includes(index)) return;

                this.startTimerIfNeeded();
                this.flipCard(index);
            },

            flipCard(index) {
                SoundManager.playFlip();
                this.flippedIndices.push(index);
                this.cardElements[index].classList.add('flipped');

                // Record seen card in AI Memory
                this.recordAIMemory(index, this.cards[index].pairId);

                if (this.flippedIndices.length === 2) {
                    this.boardLocked = true;
                    this.moves++;
                    this.updateHUD();
                    this.evaluatePair();
                }
            },

            recordAIMemory(index, pairId) {
                this.aiMemory = this.aiMemory.filter((entry) => entry.index !== index);
                this.aiMemory.push({ index, pairId });

                const maxCapacity = this.difficulty === 'easy' ? 3 : this.difficulty === 'medium' ? 6 : 999;
                while (this.aiMemory.length > maxCapacity) {
                    this.aiMemory.shift();
                }
            },

            evaluatePair() {
                const [idx1, idx2] = this.flippedIndices;
                const card1 = this.cards[idx1];
                const card2 = this.cards[idx2];

                if (card1.pairId === card2.pairId) {
                    // Match!
                    this.scheduleTimeout(() => {
                        card1.matched = true;
                        card2.matched = true;
                        this.matchedCount++;

                        const matchClass = this.currentTurn === 2 ? 'matched matched-p2' : 'matched';
                        this.cardElements[idx1].classList.add(...matchClass.split(' '));
                        this.cardElements[idx2].classList.add(...matchClass.split(' '));

                        // Remove matched cards from AI memory
                        this.aiMemory = this.aiMemory.filter((m) => m.index !== idx1 && m.index !== idx2);

                        // Particle burst on matched cards
                        [idx1, idx2].forEach((idx) => {
                            const rect = this.cardElements[idx].getBoundingClientRect();
                            ParticleSystem.burst(
                                rect.left + rect.width / 2,
                                rect.top + rect.height / 2,
                                this.currentTurn === 2 ? '#ff007f' : '#00f2fe',
                                18
                            );
                        });

                        SoundManager.playMatch();

                        if (this.mode !== 'solo') {
                            this.scores[this.currentTurn]++;
                        }

                        this.flippedIndices = [];
                        this.updateHUD();

                        if (this.matchedCount === this.totalPairs) {
                            this.handleGameComplete();
                            return;
                        }

                        // Matching a pair grants an extra turn!
                        if (this.mode === 'pve' && this.currentTurn === 2) {
                            this.updateStatusText(`<span class="pink-text">AI 配對成功！</span> 獲得額外回合...`);
                            this.scheduleTimeout(() => this.executeAITurn(), 650);
                        } else {
                            this.boardLocked = false;
                            if (this.mode !== 'solo') {
                                const pColor = this.currentTurn === 1 ? 'cyan-text' : 'pink-text';
                                const pName = this.mode === 'pvp' ? `玩家 ${this.currentTurn}` : '你';
                                this.updateStatusText(`<span class="${pColor}">${pName} 配對成功！</span> 繼續翻牌！`);
                            } else {
                                this.updateStatusText();
                            }
                        }
                    }, 420);
                } else {
                    // Mismatch
                    this.scheduleTimeout(() => {
                        SoundManager.playMismatch();
                        this.cardElements[idx1].classList.remove('flipped');
                        this.cardElements[idx2].classList.remove('flipped');
                        this.flippedIndices = [];

                        if (this.mode !== 'solo') {
                            this.currentTurn = this.currentTurn === 1 ? 2 : 1;
                        }

                        this.updateHUD();
                        this.updateStatusText();

                        if (this.mode === 'pve' && this.currentTurn === 2) {
                            this.scheduleTimeout(() => this.executeAITurn(), 550);
                        } else {
                            this.boardLocked = false;
                        }
                    }, 820);
                }
            },

            // --- AI Decision Engine ---
            executeAITurn() {
                if (this.matchedCount >= this.totalPairs || this.currentTurn !== 2) return;
                this.boardLocked = true;

                const firstPick = this.chooseAIFirstCard();
                if (firstPick === -1) return;

                this.flipCard(firstPick);

                // Wait so the user can observe AI's first card flip before AI flips the second card
                this.scheduleTimeout(() => {
                    const secondPick = this.chooseAISecondCard(firstPick);
                    if (secondPick !== -1) {
                        this.flipCard(secondPick);
                    }
                }, 650);
            },

            getUnmatchedIndices(excludeIndex = -1) {
                const list = [];
                for (let i = 0; i < this.cards.length; i++) {
                    if (!this.cards[i].matched && i !== excludeIndex) {
                        list.push(i);
                    }
                }
                return list;
            },

            chooseAIFirstCard() {
                const unmatched = this.getUnmatchedIndices();
                if (unmatched.length === 0) return -1;

                const useMemory = this.difficulty !== 'easy' || Math.random() < 0.45;

                if (useMemory) {
                    // Check if AI already knows two indices of the same pairId in aiMemory
                    const seenByPair = new Map();
                    for (const item of this.aiMemory) {
                        if (this.cards[item.index].matched) continue;
                        if (seenByPair.has(item.pairId)) {
                            return seenByPair.get(item.pairId);
                        }
                        seenByPair.set(item.pairId, item.index);
                    }
                }

                // Prefer flipping an unknown card to maximize information discovery
                const knownIndices = new Set(this.aiMemory.map((m) => m.index));
                const unknownUnmatched = unmatched.filter((idx) => !knownIndices.has(idx));
                if (unknownUnmatched.length > 0 && this.difficulty !== 'easy') {
                    return unknownUnmatched[Math.floor(Math.random() * unknownUnmatched.length)];
                }

                return unmatched[Math.floor(Math.random() * unmatched.length)];
            },

            chooseAISecondCard(firstIndex) {
                const unmatched = this.getUnmatchedIndices(firstIndex);
                if (unmatched.length === 0) return -1;

                const targetPairId = this.cards[firstIndex].pairId;
                const useMemory = this.difficulty !== 'easy' || Math.random() < 0.5;

                if (useMemory) {
                    const matchEntry = this.aiMemory.find(
                        (item) => item.index !== firstIndex && item.pairId === targetPairId && !this.cards[item.index].matched
                    );
                    if (matchEntry) {
                        return matchEntry.index;
                    }
                }

                // Avoid picking a card AI already knows does NOT match firstIndex
                if (this.difficulty !== 'easy') {
                    const knownNonMatching = new Set(
                        this.aiMemory
                            .filter((item) => item.pairId !== targetPairId)
                            .map((item) => item.index)
                    );
                    const candidates = unmatched.filter((idx) => !knownNonMatching.has(idx));
                    if (candidates.length > 0) {
                        return candidates[Math.floor(Math.random() * candidates.length)];
                    }
                }

                return unmatched[Math.floor(Math.random() * unmatched.length)];
            },

            handleGameComplete() {
                this.clearAllTimers();
                this.boardLocked = false;
                SoundManager.playVictory();

                const rect = this.gridEl.getBoundingClientRect();
                ParticleSystem.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#00f2fe', 45);

                if (this.mode === 'solo') {
                    const stars = this.getStarRating();
                    const isNewBest = this.saveBestRecord(this.gridKey, this.moves, this.elapsedSeconds);
                    this.overlayStarsEl.style.display = 'flex';
                    this.overlayStarsEl.innerHTML = [1, 2, 3]
                        .map((i) => `<i class="fa-solid fa-star" style="opacity: ${i <= stars ? 1 : 0.22}"></i>`)
                        .join('');
                    this.overlayTitleEl.textContent = isNewBest ? '🎉 刷新最佳紀錄！' : '挑戰成功！';
                    this.overlayDescEl.innerHTML = `總步數：<strong class="cyan-text">${this.moves} 步</strong> ｜ 耗時：<strong class="amber-text">${this.formatTime(this.elapsedSeconds)}</strong>`;
                } else {
                    this.overlayStarsEl.style.display = 'none';
                    const s1 = this.scores[1];
                    const s2 = this.scores[2];
                    const p1Name = this.mode === 'pvp' ? '玩家 1' : '你';
                    const p2Name = this.mode === 'pvp' ? '玩家 2' : 'AI';

                    if (s1 > s2) {
                        this.overlayTitleEl.textContent = `🏆 ${p1Name} 獲勝！`;
                    } else if (s2 > s1) {
                        this.overlayTitleEl.textContent = `⚡ ${p2Name} 獲勝！`;
                    } else {
                        this.overlayTitleEl.textContent = '🤝 雙方平手！';
                    }
                    this.overlayDescEl.innerHTML = `最終比數：<span class="cyan-text">${p1Name} (${s1}組)</span> vs <span class="pink-text">${p2Name} (${s2}組)</span>`;
                }

                this.overlayEl.classList.add('active');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            MemoryGame.init();
        });
    </script>
</body>
