            onPlayerClick(targetIdx) {
                if(this.state === 'TARGETING') {
                    let p = this.players[0];
                    if(targetIdx === 0) return;
                    if(this.players[targetIdx].isDead) return;

                    // 1. Card target checks
                    if(this.pendingAction.card) {
                        let cardName = this.pendingAction.card.name;
                        let dist = this.getDistance(0, targetIdx);
                        if(cardName === '順手牽羊' && dist > 1 && !p.hero.skills.includes('奇才')) { this.log("距離過遠！"); return; }
                        let isSha = cardName === '殺' ||
                            (p.hero.skills.includes('龍膽') && cardName === '閃') ||
                            (p.hero.skills.includes('武聖') && this.pendingAction.card.color === COLOR.RED) ||
                            (p.hero.skills.includes('武神') && this.pendingAction.card.suit === SUIT.HEART);
                        if(isSha) {
                            let attackRange = this.getAttackRange(p);
                            if(p.hero.skills.includes('武神') && this.pendingAction.card.suit === SUIT.HEART) attackRange = 999;
                            if(dist > attackRange) { this.log("距離過遠！"); return; }
                        }
                        if(cardName === '樂不思蜀' && this.players[targetIdx].judges.some(j => j.name === '樂不思蜀')) { this.log("已存在此判定牌！"); return; }
                        if(this.players[targetIdx].hero.skills.includes('謙遜') && (cardName === '順手牽羊' || cardName === '樂不思蜀')) { this.log("該角色擁有謙遜，不能被指定！"); return; }
                        if(this.players[targetIdx].hero.skills.includes('帷幕') && this.pendingAction.card.color === COLOR.BLACK && this.pendingAction.card.type === 'trick') { this.log("該角色擁有帷幕，不受黑色錦囊牌影響！"); return; }
                        if(this.players[targetIdx].hero.skills.includes('空城') && this.players[targetIdx].hand.length === 0 && (cardName === '殺' || cardName === '決鬥')) { this.log("該角色處於空城狀態，不能被指定！"); return; }
                    }
                    
                    // 2. Skill target checks
                    if(this.pendingAction.type) {
                        let type = this.pendingAction.type;
                        if(type === 'JIE_YIN') {
                            let target = this.players[targetIdx];
                            let targetIsFemale = ['zhen_ji', 'huang_yue_ying', 'da_qiao', 'sun_shang_xiang', 'diao_chan', 'jie_da_qiao'].includes(target.hero.id);
                            if(targetIsFemale || target.hp >= target.maxHp) {
                                this.log("必須選擇一名已受傷的男性角色！");
                                return;
                            }
                        }
                        else if(type === 'LI_JIAN') {
                            let target = this.players[targetIdx];
                            let targetIsFemale = ['zhen_ji', 'huang_yue_ying', 'da_qiao', 'sun_shang_xiang', 'diao_chan', 'jie_da_qiao'].includes(target.hero.id);
                            if(targetIsFemale) {
                                this.log("離間只能指定男性角色！");
                                return;
                            }
                        }
                        else if(type === 'QU_HU') {
                            let target = this.players[targetIdx];
                            if(target.hp <= p.hp) {
                                this.log("必須選擇一名體力值比你多的角色！");
                                return;
                            }
                        }
                        else if(type === 'TIAO_XIN') {
                            let target = this.players[targetIdx];
                            let attackRange = this.getAttackRange(target);
                            let dist = this.getDistance(targetIdx, 0);
                            if(dist > attackRange) {
                                this.log("你不在該角色的攻擊範圍內，無法挑釁！");
                                return;
                            }
                        }
                        else if(type === 'JI_XI') {
                            let dist = this.getDistance(0, targetIdx);
                            if(dist > 1 && !p.hero.skills.includes('奇才')) {
                                this.log("距離過遠！");
                                return;
                            }
                            if(this.players[targetIdx].hero.skills.includes('謙遜')) {
                                this.log("該角色擁有謙遜，不能被指定！");
                                return;
                            }
                            if(this.players[targetIdx].hero.skills.includes('帷幕')) {
                                // Black tricks are protected, but Ji Xi uses "田" (which is virtual, and Weimu protects only from black trick cards).
                            }
                        }
                        else if(type === 'LI_LI') {
                            let attackerIdx = this.pendingAction.attackerIdx;
                            let attacker = this.players[attackerIdx];
                            let dist = this.getDistance(attackerIdx, targetIdx);
                            let attackRange = this.getAttackRange(attacker);
                            if(dist > attackRange) {
                                this.log("該角色不在攻擊來源的攻擊範圍內！");
                                return;
                            }
                            if(targetIdx === attackerIdx) {
                                this.log("不能將目標轉移給攻擊來源！");
                                return;
                            }
                        }
                    }

                    let maxTargets = this.pendingAction.maxTargets || 1;
                    if(maxTargets > 1) {
                        if(this.selectedTargets.includes(targetIdx)) {
                            this.selectedTargets = this.selectedTargets.filter(id => id !== targetIdx);
                        } else if(this.selectedTargets.length < maxTargets) {
                            this.selectedTargets.push(targetIdx);
                        }
                    } else {
                        this.selectedTargets = [targetIdx];
                    }
                    UI.updateAll();
                }
            }

            async onCardClick(cardId) {
                let p = this.players[0];
                if (p.flags.yiJueLoss) {
                    this.log(`你處於義絕狀態，無法使用/打出手牌！`);
                    return;
                }
                let card = p.hand.find(c => c.id === cardId);
                if(!card) return;

                if(this.state === 'PLAYING') {
                    // --- 神趙雲 龍魂 主動轉化 ---
                    if (p.hero.skills.includes('龍魂')) {
                        if (card.suit === SUIT.HEART && card.name !== '桃' && p.hp < p.maxHp) {
                            let use = await this.askForSkill(p, '龍魂', `是否發動【龍魂】將【${card.name}】當作【桃】使用？`);
                            if (use) { card.name = '桃'; card.type = 'basic'; }
                        } else if (card.suit === SUIT.DIAMOND && card.name !== '殺') {
                            let use = await this.askForSkill(p, '龍魂', `是否發動【龍魂】將【${card.name}】當作【火殺】使用？`);
                            if (use) { card.name = '殺'; card.type = 'basic'; card.damageType = 'fire'; }
                        }
                    }

                    if(card.type === 'equip') {
                        let idx = p.hand.findIndex(c => c.id === cardId);
                        this.equipCard(p, p.hand.splice(idx, 1)[0]);
                        UI.updateAll();
                        return;
                    }
                    if(card.name === '桃') {
                        if(p.hp >= p.maxHp) return;
                        this.discardPile.push(p.hand.splice(p.hand.findIndex(c => c.id === cardId), 1)[0]);
                        p.hp++;
                        this.log('你使用【桃】回復1點體力');
                        UI.updateAll();
                        return;
                    }
                    if(card.name === '酒') {
                        if (p.flags.drunk) {
                            this.log("你本回合已經喝過酒了！");
                            return;
                        }
                        this.discardPile.push(p.hand.splice(p.hand.findIndex(c => c.id === cardId), 1)[0]);
                        p.flags.drunk = true;
                        this.log('你使用了【酒】，下一張【殺】造成的傷害+1！');
                        UI.updateAll();
                        return;
                    }
                    if(card.name === '鐵索連環') {
                        let recast = await this.askForSkill(p, '鐵索連環_重鑄', '確定=重鑄(摸一張牌)，取消=使用(指定連環目標)');
                        if(recast) {
                            this.discardPile.push(p.hand.splice(p.hand.findIndex(c => c.id === cardId), 1)[0]);
                            await this.drawCards(p, 1, '重鑄摸了');
                            UI.updateAll();
                            return;
                        }
                        this.state = 'TARGETING';
                        this.pendingAction = { type: 'USE_CARD', card, maxTargets: 2 };
                        this.selectedTargets = [];
                        this.log('請選擇 1 至 2 名角色進行鐵索連環');
                        UI.updateAll();
                        return;
                    }
                    if(card.name === '無中生有' || card.name === '桃園結義' || card.name === '南蠻入侵' || card.name === '萬箭齊發' || card.name === '五穀豐登') {
                        this.useImmediateCard(p, card);
                        return;
                    }
                    let isSha = card.name === '殺' ||
                        (p.hero.skills.includes('龍膽') && card.name === '閃') ||
                        (p.hero.skills.includes('武聖') && card.color === COLOR.RED) ||
                        (p.hero.skills.includes('武神') && card.suit === SUIT.HEART);
                    let needsTarget = ['決鬥', '過河拆橋', '順手牽羊', '樂不思蜀', '火攻', '兵糧寸斷'].includes(card.name) || isSha;
                    if(needsTarget) {
                        let isSha = card.name === '殺' || (p.hero.skills.includes('龍膽') && card.name === '閃') || (p.hero.skills.includes('武聖') && card.color === COLOR.RED) || (p.hero.skills.includes('武神') && card.suit === SUIT.HEART);
                        let maxTargets = isSha && p.equips.weapon && p.equips.weapon.name === '方天畫戟' && p.hand.length === 1 ? 3 : 1;
                        this.state = 'TARGETING';
                        this.pendingAction = { type: 'USE_CARD', card, maxTargets };
                        this.selectedTargets = [];
                        this.log(maxTargets > 1 ? '請選擇最多三名目標' : '請選擇一名目標');
                        UI.updateAll();
                    }
                } else if(this.state === 'RESPONDING' || this.state === 'DISCARDING') {
                    let isValid = this.state === 'DISCARDING';
                    if(this.state === 'RESPONDING') {
                        let validNames = this.pendingAction.names;
                        let validSuit = this.pendingAction.suit;
                        isValid = validNames.length === 0 || validNames.includes(card.name) ||
                            (validNames.includes('閃') && p.hero.skills.includes('龍膽') && card.name === '殺') ||
                            (validNames.includes('殺') && p.hero.skills.includes('龍膽') && card.name === '閃') ||
                            (validNames.includes('殺') && p.hero.skills.includes('武聖') && card.color === COLOR.RED) ||
                            (validNames.includes('閃') && p.hero.skills.includes('傾國') && card.color === COLOR.BLACK) ||
                            (validNames.includes('桃') && p.hero.skills.includes('急救') && card.color === COLOR.RED && this.currentPlayerIdx !== p.id) ||
                            (validNames.includes('殺') && p.hero.skills.includes('武神') && card.suit === SUIT.HEART) ||
                            (validNames.includes('桃') && p.hero.skills.includes('龍魂') && card.suit === SUIT.HEART) ||
                            (validNames.includes('殺') && p.hero.skills.includes('龍魂') && card.suit === SUIT.DIAMOND) ||
                            (validNames.includes('閃') && p.hero.skills.includes('龍魂') && card.suit === SUIT.CLUB) ||
                            (validNames.includes('無懈可擊') && p.hero.skills.includes('龍魂') && card.suit === SUIT.SPADE);
                        if (validSuit && card.suit !== validSuit) isValid = false;
                    }
                    if(isValid) {
                        if(this.selectedCardIds.includes(cardId)) this.selectedCardIds = this.selectedCardIds.filter(id => id !== cardId);
                        else {
                            if(this.selectedCardIds.length >= this.pendingAction.count) this.selectedCardIds.shift();
                            this.selectedCardIds.push(cardId);
                        }
                    }
                    UI.updateAll();
                }
            }

            async useImmediateCard(p, card) {
                let idx = p.hand.findIndex(c => c.id === card.id);
                if(idx < 0) return;
                this.discardPile.push(p.hand.splice(idx, 1)[0]);
                this.state = 'WAITING';
                UI.updateAll();
                await this.resolveImmediateCard(p, card);
                if(this.state !== 'GAME_OVER') {
                    this.state = 'PLAYING';
                    this.log('請出牌或結束回合');
                    UI.updateAll();
                }
            }

            async resolveImmediateCard(source, card) {
                if(card.type === 'trick' && source.hero.skills.includes('集智')) await this.drawCards(source, 1, '發動【集智】摸了');
                if(card.name === '無中生有') {
                    if(!await this.askWuxie(card, source)) await this.drawCards(source, 2, '使用【無中生有】摸了');
                } else if(card.name === '桃園結義') {
                    for(let p of this.getLivingPlayers()) if(p.hp < p.maxHp) p.hp++;
                    this.log('桃園結義生效，受傷角色各回復1點體力');
                    UI.updateAll(); await this.sleep(800);
                } else if(card.name === '南蠻入侵' || card.name === '萬箭齊發') {
                    let need = card.name === '南蠻入侵' ? '殺' : '閃';
                    for(let target of this.getLivingPlayers().filter(p => p.id !== source.id)) {
                        if(target.equips.armor && target.equips.armor.name === '藤甲') {
                            this.log(`【${target.hero.name}】裝備了【藤甲】，${card.name}對其無效！`);
                            UI.updateAll(); await this.sleep(800);
                            continue;
                        }
                        if(await this.askWuxie(card, target)) continue;
                        if(need === '閃') {
                            let dodgePlayed = false;
                            if(target.equips.armor && target.equips.armor.name === '八卦陣') {
                                let useBagua = await this.askForSkill(target, '八卦陣', `是否發動【八卦陣】判定？`);
                                if(useBagua) {
                                    let judge = this.drawCard();
                                    this.discardPile.push(judge);
                                    this.log(`八卦陣判定為 ${judge.suit} ${judge.point}`);
                                    UI.updateAll(); await this.sleep(800);
                                    if(judge.color === COLOR.RED) {
                                        dodgePlayed = true;
                                        this.log(`八卦陣生效，視為打出一張閃！`);
                                        UI.updateAll(); await this.sleep(800);
                                        await this.onPlayDodge(target, source);
                                    } else {
                                        this.log(`八卦陣判定失敗！`);
                                        UI.updateAll(); await this.sleep(800);
                                    }
                                }
                            }
                            if(!dodgePlayed) {
                                let ok = await this.askForCard(target, ['閃'], 1, `【${card.name}】請打出 閃`, true);
                                if(!ok) {
                                    await this.dealDamage(source, target, 1, card);
                                } else {
                                    await this.onPlayDodge(target, source);
                                }
                            }
                        } else {
                            let ok = await this.askForCard(target, ['殺'], 1, `【${card.name}】請打出 殺`, true);
                            if(!ok) await this.dealDamage(source, target, 1, card);
                        }
                        if(this.state === 'GAME_OVER') return;
                    }
                } else if(card.name === '五穀豐登') {
                    for(let p of this.getLivingPlayers()) p.hand.push(this.drawCard());
                    this.log('五穀豐登簡化結算：每名角色摸一張牌');
                    UI.updateAll(); await this.sleep(800);
                }
            }

            async onConfirm() {
                let p = this.players[0];
                if(this.state === 'RESPONDING') {
                    let playedCardId = this.selectedCardIds[0];
                    let playedCard = p.hand.find(c => c.id === playedCardId);
                    if (playedCard && p.hero.skills.includes('龍魂')) {
                        if (playedCard.suit === SUIT.HEART) { playedCard.name = '桃'; playedCard.type = 'basic'; }
                        else if (playedCard.suit === SUIT.DIAMOND) { playedCard.name = '殺'; playedCard.type = 'basic'; playedCard.damageType = 'fire'; }
                        else if (playedCard.suit === SUIT.CLUB) { playedCard.name = '閃'; playedCard.type = 'basic'; }
                        else if (playedCard.suit === SUIT.SPADE) { playedCard.name = '無懈可擊'; playedCard.type = 'trick'; }
                    }
                }

                if(this.state === 'TARGETING') {
                    let type = this.pendingAction.type;
                    if (['REN_DE', 'JIE_YIN', 'LI_JIAN', 'FAN_JIAN', 'QU_HU', 'QU_HU_DAMAGE', 'DI_MENG', 'YI_JUE', 'LEI_JI', 'JIE_MING'].includes(type)) {
                        let resolve = this.pendingAction.resolve;
                        let targets = this.selectedTargets;
                        this.state = 'WAITING';
                        this.pendingAction = null;
                        this.selectedTargets = [];
                        UI.updateAll();
                        if (type === 'LI_JIAN' || type === 'DI_MENG') {
                            await resolve(targets);
                        } else {
                            await resolve(targets[0]);
                        }
                        if (this.state !== 'GAME_OVER') {
                            this.state = 'PLAYING';
                            this.log('請出牌或結束回合');
                            UI.updateAll();
                        }
                        return;
                    }

                    let targets = this.selectedTargets.map(id => this.players[id]).filter(Boolean);
                    let target = targets[0];
                    let card = this.pendingAction.card;
                    let idx = p.hand.findIndex(c => c.id === card.id);
                    let isSha = card.name === '殺' || (p.hero.skills.includes('龍膽') && card.name === '閃') || (p.hero.skills.includes('武聖') && card.color === COLOR.RED) || (p.hero.skills.includes('武神') && card.suit === SUIT.HEART);
                    
                    if(card.name === '樂不思蜀' || card.name === '兵糧寸斷') {
                        target.judges.push(p.hand.splice(idx, 1)[0]);
                        this.log(`你對【${target.hero.name}】使用了 ${card.name}！`);
                        this.state = 'PLAYING';
                    } else {
                        if (idx >= 0) {
                            this.discardPile.push(p.hand.splice(idx, 1)[0]);
                        }
                        this.log(`你使用了 ${card.name}！`);
                        this.state = 'WAITING';
                    }
                    this.selectedCardIds = [];
                    this.selectedTargets = [];
                    UI.updateAll();
                    await this.sleep(800);
                    
                    if(isSha) {
                        p.flags.usedSha++;
                        for(let t of targets) {
                            await this.resolveAttack(p, t, card);
                            if(this.state === 'GAME_OVER') break;
                        }
                    } else if(card.name === '過河拆橋' || card.name === '順手牽羊') {
                        let w = await this.askWuxie(card, target);
                        if(!w) await this.removeOneCard(p, target, card.name === '順手牽羊' ? 'gain' : 'discard');
                    } else if(card.name === '決鬥') {
                        await this.resolveDuel(p, target, card);
                    } else if(card.name === '鐵索連環') {
                        let w = await this.askWuxie(card, target);
                        if(!w) {
                            for (let t of targets) {
                                t.isChained = !t.isChained;
                                this.log(`【${t.hero.name}】${t.isChained ? '進入' : '脫離'}連環狀態！`);
                                UI.updateAll(); await this.sleep(600);
                            }
                        }
                    } else if(card.name === '火攻') {
                        await this.resolveFireAttack(p, target, card);
                    }
                    
                    if(this.state !== 'GAME_OVER') {
                        this.state = 'PLAYING';
                        this.log("請出牌或結束回合");
                        UI.updateAll();
                    }
                } else if(this.state === 'ASK_SKILL') {
                    let res = this.pendingAction.resolve;
                    this.state = 'WAITING';
                    this.pendingAction = null;
                    UI.updateAll();
                    await this.sleep(800);
                    res(true);
                } else if(this.state === 'RESPONDING' || this.state === 'DISCARDING') {
                    if(this.selectedCardIds.length === this.pendingAction.count) {
                        for(let id of this.selectedCardIds) {
                            let idx = p.hand.findIndex(c => c.id === id);
                            this.discardPile.push(p.hand.splice(idx, 1)[0]);
                        }
                        this.log(this.state === 'DISCARDING' ? `你棄置了 ${this.pendingAction.count} 張牌` : `你打出了卡牌！`);
                        let res = this.pendingAction.resolve;
                        let action = this.pendingAction;
                        this.state = 'WAITING';
                        this.selectedCardIds = [];
                        UI.updateAll();
                        await this.sleep(800);
                        res(true);
                    }
                }
            }

            async onCancel() {
                if(this.state === 'TARGETING') {
                    this.state = 'PLAYING';
                    this.selectedCardIds = [];
                    this.selectedTargets = [];
                    this.pendingAction = null;
                    this.log("取消出牌");
                    UI.updateAll();
                } else if(this.state === 'ASK_SKILL') {
                    let res = this.pendingAction.resolve;
                    this.state = 'WAITING';
                    this.pendingAction = null;
                    this.log("你選擇了取消");
                    UI.updateAll();
                    await this.sleep(800);
                    res(false);
                } else if(this.state === 'RESPONDING') {
                    if(this.pendingAction.optional) {
                        let res = this.pendingAction.resolve;
                        this.state = 'WAITING';
                        this.selectedCardIds = [];
                        this.log("你選擇了取消");
                        UI.updateAll();
                        await this.sleep(800);
                        res(false);
                    }
                }
            }

            async endTurn() {
                if(this.state !== 'PLAYING') return;
                this.state = 'WAITING';
                UI.updateAll();
                await this.discardPhase(this.players[0]);
            }

            async resolveDuel(source, target, card) {
                if(await this.askWuxie(card, target)) return;
                let attacker = target;
                let defender = source;
                while(!attacker.isDead && !defender.isDead) {
                    let need = defender.hero.skills.includes('無雙') ? 2 : 1;
                    let ok = true;
                    for(let i=0; i<need; i++) {
                        if(!await this.askForCard(attacker, ['殺'], 1, `【決鬥】請打出殺`, true)) { ok = false; break; }
                    }
                    if(!ok) {
                        let amount = 1 + (defender.flags.luoYi ? 1 : 0);
                        await this.dealDamage(defender, attacker, amount, card);
                        return;
                    }
                    [attacker, defender] = [defender, attacker];
                }
            }

            async resolveFireAttack(source, target, card) {
                let w = await this.askWuxie(card, target);
                if (w) return;
                
                if (target.hand.length === 0) return;
                
                // 1. Target shows a card
                let shownCardIdx = Math.floor(Math.random() * target.hand.length);
                let shownCard = target.hand[shownCardIdx];
                this.log(`【${target.hero.name}】展示了手牌：${shownCard.name}，花色為【${shownCard.suit}】`);
                await this.sleep(1200);
                
                // 2. Attacker decides to discard a card of the same suit
                if (source.id === 0) {
                    let hasSameSuit = source.hand.some(c => c.suit === shownCard.suit);
                    if (!hasSameSuit) {
                        this.log(`你沒有與【${shownCard.suit}】相同花色的手牌，火攻失敗。`);
                        await this.sleep(800);
                        return;
                    }
                    
                    let discarded = await this.askForCard(source, [], 1, `請選擇一張【${shownCard.suit}】花色的手牌棄置以發動火攻`, true, shownCard.suit);
                    if (discarded && discarded.length > 0) {
                        this.log(`你棄置了 ${discarded[0].name}，火攻成功！`);
                        await this.dealDamage(source, target, 1, card, 'fire');
                    } else {
                        this.log(`你取消了棄牌，火攻失敗。`);
                        await this.sleep(800);
                    }
                } else {
                    // AI attacker
                    let discardedIdx = source.hand.findIndex(c => c.suit === shownCard.suit);
                    if (discardedIdx !== -1) {
                        let disc = source.hand.splice(discardedIdx, 1)[0];
                        this.discardPile.push(disc);
                        this.log(`【${source.hero.name}】棄置了手牌 ${disc.name}，火攻成功！`);
                        await this.sleep(800);
                        await this.dealDamage(source, target, 1, card, 'fire');
                    } else {
                        this.log(`【${source.hero.name}】沒有相同花色的手牌，火攻失敗。`);
                        await this.sleep(800);
                    }
                }
            }

            nextTurn() {
                if(this.state === 'GAME_OVER') return;
                this.players.forEach(p => { p.flags.yiJueLoss = false; });
                let next = (this.currentPlayerIdx + 1) % this.players.length;
                while(this.players[next].isDead) next = (next + 1) % this.players.length;
                this.startTurn(next);
            }

            async checkGameOver() {
                let lord = this.players.find(p => p.role === ROLE.LORD);
                let aliveRebels = this.players.filter(p => p.role === ROLE.REBEL && !p.isDead).length;
                let aliveSpies = this.players.filter(p => p.role === ROLE.SPY && !p.isDead).length;
                let aliveLoyals = this.players.filter(p => p.role === ROLE.LOYAL && !p.isDead).length;

                if(lord && lord.isDead) {
                    this.state = 'GAME_OVER';
                    if(aliveRebels === 0 && aliveLoyals === 0 && aliveSpies > 0) {
                        this.log('遊戲結束：內奸獲勝');
                    } else {
                        this.log('遊戲結束：反賊方獲勝');
                    }
                } else if(aliveRebels === 0 && aliveSpies === 0) {
                    this.state = 'GAME_OVER';
                    this.log('遊戲結束：主忠方獲勝');
                }
                UI.updateAll();
            }

            sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        }

        // --- 3. UI RENDERER ---
        const UI = {
            initPlayers: function(numPlayers) {
                document.querySelectorAll('.player-area.ai-player').forEach(e => e.remove());
                
                let bf = document.getElementById('battlefield');
                let aiCount = numPlayers - 1;
                let positions = [];
                
                if(aiCount === 3) {
                    positions = [ {left:'10px', top:'45%'}, {left:'50%', top:'10px', tx:'-50%'}, {right:'10px', top:'45%'} ];
                } else if(aiCount === 4) {
                    positions = [ {left:'10px', top:'30%'}, {left:'10px', top:'70%'}, {right:'10px', top:'30%'}, {right:'10px', top:'70%'} ];
                } else {
                    let leftCount = Math.floor(aiCount / 3);
                    let rightCount = Math.floor(aiCount / 3);
                    let topCount = aiCount - leftCount - rightCount;
                    
                    for(let i=0; i<leftCount; i++) {
                        let pct = 20 + (60 * (i + 1) / (leftCount + 1));
                        positions.push({ left: '10px', top: `${pct}%`, tx: '0' });
                    }
                    for(let i=0; i<topCount; i++) {
                        let pct = 20 + (60 * (i + 1) / (topCount + 1));
                        positions.push({ left: `${pct}%`, top: '10px', tx: '-50%' });
                    }
                    for(let i=0; i<rightCount; i++) {
                        let pct = 20 + (60 * (i + 1) / (rightCount + 1));
                        positions.push({ right: '10px', top: `${pct}%`, tx: '0' });
                    }
                }
                
                let scale = 1;
                if(aiCount > 4) scale = 0.85;
                if(aiCount > 7) scale = 0.75;

                for(let i=1; i<=aiCount; i++) {
                    let pos = positions[i-1];
                    let div = document.createElement('div');
                    div.className = 'player-area ai-player';
                    div.id = `p${i}`;
                    div.onclick = () => Engine.onPlayerClick(i);
                    
                    div.style.position = 'absolute';
                    if(pos.left) div.style.left = pos.left;
                    if(pos.right) div.style.right = pos.right;
                    if(pos.top) div.style.top = pos.top;
                    
                    let transformStr = `translateY(-50%) scale(${scale})`;
                    if(pos.tx) transformStr = `translate(${pos.tx}, -50%) scale(${scale})`;
                    if(pos.top === '10px') {
                        transformStr = pos.tx ? `translateX(${pos.tx}) scale(${scale})` : `scale(${scale})`;
                    }
                    
                    div.style.transform = transformStr;
                    div.style.transformOrigin = pos.left ? 'left center' : (pos.right ? 'right center' : 'top center');
                    
                    if(pos.top === '10px') {
                        div.style.flexDirection = 'row';
                        div.style.gap = '20px';
                    }
                    
                    div.innerHTML = `
                        <div class="name-tag" id="name${i}">電腦${i}</div>
                        <div class="hero-card" id="hero${i}" onclick="UI.showHeroInfo(${i}); event.stopPropagation();">
                            <div id="heroName${i}">?</div>
                            <div class="role-icon role-unknown" id="role${i}">?</div>
                            <div class="hand-count" id="h${i}">0</div>
                            <div class="hp-bar" id="hp${i}"></div>
                        </div>
                        <div class="ai-equip" id="equip${i}"></div>
                    `;
                    bf.appendChild(div);
                }
            },
            showCardInfoPanel: function(card) {
                document.getElementById('cipTitle').innerText = card.name;
                document.getElementById('cipDesc').innerHTML = card.desc || '此牌無特殊說明。';
                document.getElementById('cardInfoPanel').style.display = 'block';
            },
            showCardInfoPanelById: function(cardId) {
                let p0 = Engine.players[0];
                if (!p0) return;
                let card = p0.hand.find(c => c.id === cardId);
                if (card) {
                    this.showCardInfoPanel(card);
                }
            },
            hideCardInfoPanel: function() {
                document.getElementById('cardInfoPanel').style.display = 'none';
            },
            showHeroInfo: function(idx) {
                if(Engine.players.length === 0) return;
                let p = Engine.players[idx];
                document.getElementById('infoTitle').innerText = p.hero.name;
                document.getElementById('infoDesc').innerHTML = p.hero.desc || '無技能說明';
                let imgEl = document.getElementById('infoImage');
                if(p.hero.img) {
                    imgEl.style.display = 'block';
                    imgEl.style.backgroundImage = `url('${p.hero.img}')`;
                } else { imgEl.style.display = 'none'; }
                document.getElementById('infoModal').style.display = 'flex';
            },
            showEquipInfo: function(type) {
                if(Engine.players.length === 0) return;
                let p = Engine.players[0];
                let eq = p.equips[type];
                if(eq) {
                    document.getElementById('infoTitle').innerText = eq.name;
                    document.getElementById('infoDesc').innerHTML = eq.desc || '無裝備說明';
                    document.getElementById('infoImage').style.display = 'none';
                    document.getElementById('infoModal').style.display = 'flex';
                }
            },
            updateAll: function() {
                if(Engine.players.length === 0) return;
                for(let i=0; i<Engine.players.length; i++) {
                    let p = Engine.players[i];
                    let el = document.getElementById(`p${i}`);
                    
                    document.getElementById(`heroName${i}`).innerText = p.hero.name;
                    let heroCardEl = document.getElementById(`hero${i}`);
                    if(p.hero.img) {
                        heroCardEl.style.backgroundImage = `url('${p.hero.img}')`;
                        heroCardEl.style.backgroundSize = 'cover';
                        heroCardEl.style.backgroundPosition = 'center';
                        document.getElementById(`heroName${i}`).style.display = 'none';
                    } else {
                        document.getElementById(`heroName${i}`).style.display = 'block';
                        document.getElementById(`heroName${i}`).style.background = 'rgba(0,0,0,0.6)';
                    }
                    
                    document.getElementById(`hp${i}`).innerHTML = `❤️ ${p.hp} / ${p.maxHp}`;
                    if(i !== 0) document.getElementById(`h${i}`).innerText = p.hand.length;
                    
                    let rEl = document.getElementById(`role${i}`);
                    if(p.role === ROLE.LORD || i === 0 || p.isDead || Engine.state === 'GAME_OVER') {
                        rEl.innerText = p.role;
                        rEl.className = 'role-icon role-' + (p.role===ROLE.LORD?'lord':p.role===ROLE.LOYAL?'loyal':p.role===ROLE.REBEL?'rebel':'spy');
                    } else {
                        rEl.innerText = '?';
                        rEl.className = 'role-icon role-unknown';
                    }

                    let nameText = i === 0 ? "玩家" : `電腦${i}`;
                    nameText += ` (${p.hero.name})`;
                    if (p.isChained) nameText += ' [⛓️連環]';
                    if (p.flags.drunk) nameText += ' [🍶酒]';
                    if (p.hero.skills.includes('狂暴')) {
                        nameText += ` [🔥暴怒:${p.flags.wrath || 0}]`;
                    }
                    if (p.flags.yiJueLoss) {
                        nameText += ' [🚫義絕]';
                    }
                    if (p.flags.turnedOver) {
                        nameText += ' [💤翻面]';
                    }
                    if (p.flags.tuntian) {
                        nameText += ` [🌾田:${p.flags.tuntian}]`;
                    }
                    document.getElementById(`name${i}`).innerText = nameText;

                    if(i !== 0) {
                        let jHTML = p.judges.map(j => `<div class="ai-equip-item" style="border-color:#eab308; color:#eab308;">判定: ${j.name}</div>`).join('');
                        document.getElementById(`equip${i}`).innerHTML = `
                            ${jHTML}
                            <div class="ai-equip-item">武器: ${p.equips.weapon ? p.equips.weapon.name : '無'}</div>
                            <div class="ai-equip-item">防具: ${p.equips.armor ? p.equips.armor.name : '無'}</div>
                            <div class="ai-equip-item">+1馬: ${p.equips.defMount ? p.equips.defMount.name : '無'}</div>
                            <div class="ai-equip-item">-1馬: ${p.equips.offMount ? p.equips.offMount.name : '無'}</div>
                            <div class="ai-equip-item">寶物: ${p.equips.treasure ? p.equips.treasure.name : '無'}</div>
                        `;
                    } else {
                        // show judges for p0 inside eq section or a new section
                        let jHTML = p.judges.map(j => `<span style="background:rgba(0,0,0,0.8);color:var(--theme-gold);padding:2px 4px;margin-bottom:2px;border-radius:4px;font-size:0.8rem;">[判定] ${j.name}</span>`).join('');
                        // We will append it to weapon if it exists, or just prepend to equip0 in hand section? Actually, let's prepend to eqWeapon0.
                    }

                    if(p.isDead) el.classList.add('dead'); else el.classList.remove('dead');
                    if(Engine.currentPlayerIdx === i && !p.isDead) el.classList.add('active'); else el.classList.remove('active');
                    if(Engine.state === 'TARGETING' && i !== 0 && !p.isDead) el.classList.add('targetable'); else el.classList.remove('targetable');
                    if(Engine.selectedTargets.includes(i)) el.style.borderColor = 'var(--theme-gold)'; else el.style.borderColor = '';
                }

                let p0 = Engine.players[0];
                let handHTML = '';
                p0.hand.forEach(c => {
                    let isSelected = Engine.selectedCardIds.includes(c.id);
                    let isDisabled = false;
                    
                    if(Engine.state !== 'PLAYING' && Engine.state !== 'RESPONDING' && Engine.state !== 'DISCARDING') isDisabled = true;
                    if(Engine.state === 'PLAYING') {
                        let maxSha = (p0.equips.weapon && p0.equips.weapon.name==='諸葛連弩' ? 99 : 1) + (p0.flags.extraShaCount || 0);
                        let canUseSha = p0.flags.usedSha < maxSha || p0.hero.skills.includes('咆哮');
                        let isShaCard = c.name === '殺' ||
                            (p0.hero.skills.includes('龍膽') && c.name === '閃') ||
                            (p0.hero.skills.includes('武聖') && c.color === COLOR.RED) ||
                            (p0.hero.skills.includes('武神') && c.suit === SUIT.HEART) ||
                            (p0.hero.skills.includes('龍魂') && c.suit === SUIT.DIAMOND);
                        let isShanCard = c.name === '閃';
                        
                        if(isShanCard && !p0.hero.skills.includes('龍膽')) isDisabled = true;
                        if(c.name === '無懈可擊') isDisabled = true;
                        
                        let isPeachCard = c.name === '桃' || (p0.hero.skills.includes('龍魂') && c.suit === SUIT.HEART);
                        if(isPeachCard && p0.hp >= p0.maxHp) isDisabled = true;
                        if(isShaCard && !canUseSha) isDisabled = true;
                    }
                    if(Engine.state === 'RESPONDING') {
                        let validNames = Engine.pendingAction.names;
                        let validSuit = Engine.pendingAction.suit;
                        let validColor = Engine.pendingAction.color;
                        let valid = validNames.length === 0 || validNames.includes(c.name) || 
                            (validNames.includes('閃') && p0.hero.skills.includes('龍膽') && c.name === '殺') ||
                            (validNames.includes('殺') && p0.hero.skills.includes('龍膽') && c.name === '閃') ||
                            (validNames.includes('殺') && p0.hero.skills.includes('武聖') && c.color === COLOR.RED) ||
                            (validNames.includes('閃') && p0.hero.skills.includes('傾國') && c.color === COLOR.BLACK) ||
                            (validNames.includes('桃') && p0.hero.skills.includes('急救') && c.color === COLOR.RED && Engine.currentPlayerIdx !== 0) ||
                            (validNames.includes('殺') && p0.hero.skills.includes('武神') && c.suit === SUIT.HEART) ||
                            (validNames.includes('桃') && p0.hero.skills.includes('龍魂') && c.suit === SUIT.HEART) ||
                            (validNames.includes('殺') && p0.hero.skills.includes('龍魂') && c.suit === SUIT.DIAMOND) ||
                            (validNames.includes('閃') && p0.hero.skills.includes('龍魂') && c.suit === SUIT.CLUB) ||
                            (validNames.includes('無懈可擊') && p0.hero.skills.includes('龍魂') && c.suit === SUIT.SPADE);
                        if (validSuit && c.suit !== validSuit) valid = false;
                        if (validColor && c.color !== validColor) valid = false;
                        if(!valid) isDisabled = true;
                    }
                    
                    handHTML += `
                        <div class="card face-up ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''} ${c.bg ? c.bg : ''}" 
                             onclick="Engine.onCardClick(${c.id})"
                             onmouseenter="UI.showCardInfoPanelById(${c.id})"
                             onmouseleave="UI.hideCardInfoPanel()">
                            <div class="card-illustration" style="background-image: url('${c.img || ''}')"></div>
                            <div class="card-title" style="color:${c.color === COLOR.RED ? '#dc2626' : '#1c1917'}; text-shadow: 0px 0px 3px rgba(255,255,255,0.8);">${c.name}</div>
                            <div class="card-suit suit-${c.color}">${c.suit}</div>
                            <div class="card-point suit-${c.color}">${c.point}</div>
                            <div class="card-desc">${c.type === 'equip' ? c.equipType : c.type}</div>
                        </div>
                    `;
                });
                document.getElementById('hand0').innerHTML = handHTML;

                let eq = p0.equips;
                let jHTML = p0.judges.map(j => `<div style="border:1px solid #eab308; padding:5px; border-radius:4px; color:#eab308; margin-bottom:2px;">判定: ${j.name}</div>`).join('');
                document.getElementById('eqWeapon0').innerHTML = jHTML + '武器: ' + (eq.weapon ? eq.weapon.name : '無');
                document.getElementById('eqArmor0').innerText = '防具: ' + (eq.armor ? eq.armor.name : '無');
                document.getElementById('eqDefMount0').innerText = '+1馬: ' + (eq.defMount ? eq.defMount.name : '無');
                document.getElementById('eqOffMount0').innerText = '-1馬: ' + (eq.offMount ? eq.offMount.name : '無');
                document.getElementById('eqTreasure0').innerText = '寶物: ' + (eq.treasure ? eq.treasure.name : '無');

                document.getElementById('btnEndTurn').style.display = (Engine.state === 'PLAYING' && Engine.currentPlayerIdx === 0) ? 'inline-block' : 'none';
                let activeSkillNames = ['仁德', '制衡', '苦肉', '青囊', '結姻', '離間', '反間', '奇襲', '國色', '亂擊', '驅虎', '締盟', '神憤', '義絕'];
                let hasActiveSkills = p0 && (p0.hero.skills.some(s => activeSkillNames.includes(s)) || (p0.equips.weapon && p0.equips.weapon.name === '丈八蛇矛'));
                document.getElementById('btnSkill').style.display = (Engine.state === 'PLAYING' && Engine.currentPlayerIdx === 0 && hasActiveSkills) ? 'inline-block' : 'none';
                
                let showConfirm = false;
                if(Engine.state === 'TARGETING' && Engine.selectedTargets.length > 0) showConfirm = true;
                if(Engine.state === 'RESPONDING' && Engine.selectedCardIds.length === Engine.pendingAction.count) showConfirm = true;
                if(Engine.state === 'DISCARDING' && Engine.selectedCardIds.length === Engine.pendingAction.count) showConfirm = true;
                if(Engine.state === 'ASK_SKILL') showConfirm = true;
                document.getElementById('btnConfirm').style.display = showConfirm ? 'inline-block' : 'none';

                if(Engine.state === 'TARGETING' || Engine.state === 'RESPONDING' || Engine.state === 'ASK_SKILL') {
                    if(Engine.state === 'RESPONDING' && !Engine.pendingAction.optional) {
                        document.getElementById('btnCancel').style.display = 'none';
                    } else {
                        document.getElementById('btnCancel').style.display = 'inline-block';
                        document.getElementById('btnCancel').innerText = "取消";
                    }
                } else {
                    document.getElementById('btnCancel').style.display = 'none';
                }
                
                let deckEl = document.getElementById('deckCount');
                if (deckEl && Engine && Engine.deck) deckEl.innerText = `牌堆剩餘: ${Engine.deck.length} 張`;
            }
        };

        // --- 4. INIT LOBBY ---

        const Engine = new GameEngine();
        
        window.renderLobbyHeroes = function() {
            let grid = document.getElementById('heroGrid');
            if(!grid) return;
            grid.innerHTML = '';
            
            let allowGod = document.getElementById('expGod') ? document.getElementById('expGod').checked : true;
            let allowBreakthrough = document.getElementById('expBreakthrough') ? document.getElementById('expBreakthrough').checked : true;
            let allowSP = document.getElementById('expSP') ? document.getElementById('expSP').checked : true;
            
            HEROES.forEach(h => {
                if(h.exp === 'god' && !allowGod) return;
                if(h.exp === 'breakthrough' && !allowBreakthrough) return;
                if(h.exp === 'sp' && !allowSP) return;
                
                let el = document.createElement('div');
                el.className = 'hero-select-card';
                
                // Use avatar image for selection screen
                let avatarImg = `../assets/SanGuoSha/heroes_avatar/${h.id}.png`;
                el.style.backgroundImage = `url('${avatarImg}')`;
                el.style.backgroundSize = 'cover';
                el.style.backgroundPosition = 'center';
                
                el.title = h.name;
                el.innerHTML = `<div class="hero-select-name" style="background: rgba(0,0,0,0.6); padding: 2px 0; border-radius: 0 0 4px 4px; width: 100%; text-align: center; position: absolute; bottom: 0; left: 0; box-sizing: border-box;">${h.name}</div>`;
                el.onclick = () => { Engine.initGame(h); };
                grid.appendChild(el);
            });
        };
        
        window.renderLobbyHeroes();

    </script>
</body>
</html>
