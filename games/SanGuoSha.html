                if (source.equips.weapon && source.equips.weapon.name === '朱雀羽扇' && card.name === '殺') {
                    let useFan = await this.askForSkill(source, '朱雀羽扇', `是否發動【朱雀羽扇】將此【殺】轉化為【火殺】？`);
                    if (useFan) {
                        this.log(`【${source.hero.name}】發動【朱雀羽扇】，將【殺】轉化為【火殺】！`);
                        attackCard = Object.assign({}, card, { damageType: 'fire', name: '火殺' });
                    }
                }

                if (source.equips.weapon && source.equips.weapon.name === '雌雄雙股劍' && srcIsFemale !== tgtIsFemale) {
                    let use = await this.askForSkill(source, '雌雄雙股劍', `是否發動【雌雄雙股劍】？`);
                    if(use) {
                        this.log(`【${source.hero.name}】發動了 雌雄雙股劍`);
                        UI.updateAll(); await this.sleep(800);
                        let opt = false;
                        if(target.hand.length > 0) {
                            opt = await this.askForSkill(target, '雌雄雙股劍_選擇', `確定=棄一張牌，取消=讓對方摸一張牌`);
                        }
                        if(opt) {
                            await this.askForCard(target, [], 1, `請棄置一張手牌`);
                        } else {
                            source.hand.push(this.drawCard());
                            this.log(`【${source.hero.name}】摸了一張牌`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    }
                }

                let ignoreArmor = source.equips.weapon && source.equips.weapon.name === '青釭劍';
                if(ignoreArmor) {
                    this.log(`【${source.hero.name}】的青釭劍無視了防具！`);
                    UI.updateAll(); await this.sleep(800);
                }

                // Renwang Shield (仁王盾) Check
                if (!ignoreArmor && target.equips.armor && target.equips.armor.name === '仁王盾' && attackCard.color === COLOR.BLACK) {
                    this.log(`【${target.hero.name}】的【仁王盾】使黑色【殺】無效！`);
                    UI.updateAll(); await this.sleep(800);
                    if (source.flags.drunk) {
                        source.flags.drunk = false;
                        this.log(`【${source.hero.name}】的【酒】效果消失。`);
                    }
                    return;
                }

                // Vine Armor (藤甲) Check
                if (!ignoreArmor && target.equips.armor && target.equips.armor.name === '藤甲' && attackCard.damageType === 'normal') {
                    this.log(`【${target.hero.name}】的【藤甲】使普通【殺】無效！`);
                    UI.updateAll(); await this.sleep(800);
                    if (source.flags.drunk) {
                        source.flags.drunk = false;
                        this.log(`【${source.hero.name}】的【酒】效果消失。`);
                    }
                    return;
                }

                let requireTwo = source.hero.skills.includes('無雙') ? 2 : 1;
                let flashed = 0;
                while(flashed < requireTwo) {
                    let dodgePlayed = false;
                    
                    if(!ignoreArmor && target.equips.armor && target.equips.armor.name === '八卦陣') {
                        let useBagua = await this.askForSkill(target, '八卦陣', `是否發動【八卦陣】判定？`);
                        if(useBagua) {
                            let judge = this.drawCard();
                            this.discardPile.push(judge);
                            this.log(`八卦陣判定為 ${judge.suit} ${judge.point}`);
                            UI.updateAll(); await this.sleep(800);
                            if(judge.color === COLOR.RED) {
                                dodgePlayed = true;
                                this.log(`八卦陣生效，視為打出一張閃！`);
                                UI.updateAll(); await this.sleep(800);
                                await this.onPlayDodge(target, source);
                            } else {
                                this.log(`八卦陣判定失敗！`);
                                UI.updateAll(); await this.sleep(800);
                            }
                        }
                    }
                    
                    if(!dodgePlayed) {
                        dodgePlayed = await this.askForCard(target, ['閃'], 1, `【${source.hero.name}】對你出殺，請打出 1 張閃！`, true);
                        if (dodgePlayed) {
                            await this.onPlayDodge(target, source);
                        }
                    }
                    
                    if(dodgePlayed) {
                        flashed++;
                    } else {
                        break;
                    }
                }
                
                if(flashed >= requireTwo) {
                    this.log(`【${target.hero.name}】閃避了攻擊！`);
                    if (source.hero.skills.includes('咆哮') && source.hero.id === 'jie_zhang_fei') {
                        await this.drawCards(source, 1, '發動【咆哮】摸了');
                    }
                    if (target.hero.skills.includes('涯角')) {
                        await this.drawCards(target, 1, '發動【涯角】摸了');
                    }
                    if (source.flags.drunk) {
                        source.flags.drunk = false;
                        this.log(`【${source.hero.name}】的【酒】效果消失。`);
                    }
                    UI.updateAll(); await this.sleep(800);
                    if(source.equips.weapon && source.equips.weapon.name === '貫石斧' && source.hand.length >= 2) {
                        let use = await this.askForSkill(source, '貫石斧', `攻擊被閃避，是否發動【貫石斧】棄兩張牌強制命中？`);
                        if(use) {
                            let discarded = await this.askForCard(source, [], 2, `請選擇兩張手牌棄置`);
                            if(discarded) isHit = true;
                        }
                    }
                    if(!isHit && source.equips.weapon && source.equips.weapon.name === '青龍偃月刀') {
                        let use = await this.askForSkill(source, '青龍偃月刀', `攻擊被閃避，是否發動【青龍偃月刀】繼續對其出殺？`);
                        if(use) {
                            let shaPlayed = await this.askForCard(source, ['殺'], 1, `請打出一張殺！`, true);
                            if(shaPlayed) {
                                await this.resolveAttack(source, target, attackCard);
                                return;
                            }
                        }
                    }
                }
                
                if(flashed < requireTwo || isHit) {
                    let amount = 1 + (source.flags.luoYi ? 1 : 0) + (source.flags.drunk ? 1 : 0);
                    if (source.flags.drunk) {
                        source.flags.drunk = false;
                        this.log(`【${source.hero.name}】的【酒】生效，傷害+1！`);
                    }
                    if (source.equips.weapon && source.equips.weapon.name === '古錠刀' && target.hand.length === 0) {
                        amount++;
                        this.log(`【古錠刀】對空手牌角色傷害+1！`);
                    }
                    await this.dealDamage(source, target, amount, attackCard);
                    
                    if (source.hero.skills.includes('利馭') && !target.isDead) {
                        this.log(`【界呂布】發動【利馭】`);
                        await this.drawCards(target, 1, '利馭摸牌');
                        let ref = this.getFirstRemovableCard(target);
                        if (ref) {
                            if (ref.zone === 'hand') {
                                let card = target.hand.pop();
                                source.hand.push(card);
                            } else {
                                await this.loseEquip(target, ref.slot, 'hand', source);
                            }
                            this.log(`【界呂布】獲得了【${target.hero.name}】的一張牌`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    }
                    
                    if(source.equips.weapon && source.equips.weapon.name === '麒麟弓' && (target.equips.defMount || target.equips.offMount) && !target.isDead) {
                        let use = await this.askForSkill(source, '麒麟弓', `是否發動【麒麟弓】棄置其一匹馬？`);
                        if(use) {
                            let slot = target.equips.defMount ? 'defMount' : 'offMount';
                            await this.loseEquip(target, slot, 'discard');
                            this.log(`【${source.hero.name}】用麒麟弓棄置了【${target.hero.name}】的坐騎`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    }
                }
            }

            async doAITurn(p) {
                this.state = 'AI_THINKING';
                await this.sleep(800);
                
                let enemies = this.players.filter(o => o.id !== p.id && !o.isDead && this.isEnemy(p, o));
                let allies = this.players.filter(o => o.id !== p.id && !o.isDead && this.isSameSide(p, o));
                
                if (p.flags.yiJueLoss) {
                    this.log(`【${p.hero.name}】處於義絕狀態，無法出牌及發動非鎖定技`);
                    await this.sleep(800);
                    await this.discardPhase(p);
                    return;
                }

                // 1. AI Hero Active Skills BEFORE playing cards
                if (p.hero.skills.includes('苦肉') && p.hp > 1) {
                    p.hp--;
                    this.log(`【${p.hero.name}】發動【苦肉】流失1點體力！`);
                    UI.updateAll(); await this.sleep(600);
                    await this.drawCards(p, 2, '發動【苦肉】摸了');
                }
                if (p.hero.skills.includes('神憤') && (p.flags.wrath || 0) >= 6) {
                    p.flags.wrath -= 6;
                    this.log(`【${p.hero.name}】消耗6個暴怒標記發動【神憤】！`);
                    UI.updateAll(); await this.sleep(800);
                    for (let target of this.getLivingPlayers().filter(o => o.id !== p.id)) {
                        await this.dealDamage(p, target, 1, null);
                        for(let slot of ['weapon', 'armor', 'defMount', 'offMount', 'treasure']) {
                            if(target.equips[slot]) await this.loseEquip(target, slot, 'discard');
                        }
                        let discardCount = Math.min(4, target.hand.length);
                        if (discardCount > 0) {
                            if (target.id === 0) {
                                await this.askForCard(target, [], discardCount, `【神憤】請棄置 ${discardCount} 張手牌`, false);
                            } else {
                                for(let i=0; i<discardCount; i++) this.discardPile.push(target.hand.pop());
                                UI.updateAll(); await this.sleep(400);
                            }
                        }
                    }
                    p.flags.turnedOver = !p.flags.turnedOver;
                    this.log(`【${p.hero.name}】翻面！`);
                    UI.updateAll(); await this.sleep(800);
                    await this.discardPhase(p);
                    return;
                }
                if (p.hero.skills.includes('青囊') && !p.flags.usedQingNang && p.hand.length > 0) {
                    let injured = this.getLivingPlayers().find(o => o.hp < o.maxHp && this.isSameSide(p, o));
                    if (injured) {
                        p.flags.usedQingNang = true;
                        this.discardPile.push(p.hand.pop());
                        injured.hp++;
                        this.log(`【${p.hero.name}】發動【青囊】令【${injured.hero.name}】回復1點體力`);
                        UI.updateAll(); await this.sleep(800);
                    }
                }
                if (p.hero.skills.includes('離間') && !p.flags.usedLiJian && p.hand.length > 0) {
                    let maleEnemies = enemies.filter(o => !['zhen_ji', 'huang_yue_ying', 'da_qiao', 'sun_shang_xiang', 'diao_chan'].includes(o.hero.id));
                    if (maleEnemies.length >= 2) {
                        p.flags.usedLiJian = true;
                        this.discardPile.push(p.hand.pop());
                        this.log(`【${p.hero.name}】發動【離間】令【${maleEnemies[0].hero.name}】與【${maleEnemies[1].hero.name}】決鬥！`);
                        UI.updateAll(); await this.sleep(800);
                        await this.resolveDuel(maleEnemies[0], maleEnemies[1], { name: '決鬥' });
                    }
                }
                if (p.hero.skills.includes('反間') && !p.flags.usedFanJian && p.hand.length > 0) {
                    let enemy = enemies[0];
                    if (enemy) {
                        p.flags.usedFanJian = true;
                        let card = p.hand.pop();
                        this.log(`【${p.hero.name}】對【${enemy.hero.name}】發動【反間】！`);
                        let guessColor = Math.random() > 0.5 ? COLOR.RED : COLOR.BLACK;
                        enemy.hand.push(card);
                        if (card.color !== guessColor) {
                            this.log(`【${enemy.hero.name}】猜錯了，受到 1 點傷害！`);
                            await this.dealDamage(p, enemy, 1, null);
                        } else {
                            this.log(`【${enemy.hero.name}】猜對了！`);
                            await this.sleep(800);
                        }
                    }
                }
                if (p.hero.skills.includes('奇襲')) {
                    let blackCardIdx = p.hand.findIndex(c => c.color === COLOR.BLACK);
                    while (blackCardIdx !== -1 && enemies.length > 0) {
                        let target = enemies.find(o => o.hand.length > 0 || o.equips.weapon || o.equips.armor || o.equips.defMount || o.equips.offMount);
                        if (!target) break;
                        let card = p.hand.splice(blackCardIdx, 1)[0];
                        this.discardPile.push(card);
                        this.log(`【${p.hero.name}】發動【奇襲】，將黑色牌當【過河拆橋】對【${target.hero.name}】使用`);
                        UI.updateAll(); await this.sleep(800);
                        let w = await this.askWuxie({ name: '過河拆橋' }, target);
                        if (!w) await this.removeOneCard(p, target, 'discard');
                        blackCardIdx = p.hand.findIndex(c => c.color === COLOR.BLACK);
                    }
                }
                if (p.hero.skills.includes('國色')) {
                    let diamondIdx = p.hand.findIndex(c => c.suit === SUIT.DIAMOND);
                    while (diamondIdx !== -1 && enemies.length > 0) {
                        let target = enemies.find(o => !o.judges.some(j => j.name === '樂不思蜀'));
                        if (!target) break;
                        let card = p.hand.splice(diamondIdx, 1)[0];
                        target.judges.push(card);
                        this.log(`【${p.hero.name}】發動【國色】，將方塊牌當【樂不思蜀】對【${target.hero.name}】使用`);
                        UI.updateAll(); await this.sleep(800);
                        diamondIdx = p.hand.findIndex(c => c.suit === SUIT.DIAMOND);
                    }
                }
                
                // 2. Play cards from hand
                for(let i=p.hand.length-1; i>=0; i--) {
                    if (p.isDead) break;
                    let c = p.hand[i];
                    if(c.type === 'equip') {
                        await this.equipCard(p, p.hand.splice(i, 1)[0]);
                    } else if(c.name === '桃') {
                        if(p.hp < p.maxHp) {
                            this.discardPile.push(p.hand.splice(i, 1)[0]);
                            p.hp++;
                            this.log(`【${p.hero.name}】使用了 桃 回復了 1 點體力`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    } else if(c.name === '酒') {
                        let hasSha = p.hand.some(c => c.name === '殺' || (p.hero.skills.includes('龍膽') && c.name === '閃') || (p.hero.skills.includes('武聖') && c.color === COLOR.RED) || (p.hero.skills.includes('武神') && c.suit === SUIT.HEART));
                        let inRange = enemies.some(o => this.getDistance(p.id, o.id) <= this.getAttackRange(p));
                        if (hasSha && inRange && !p.flags.drunk) {
                            this.discardPile.push(p.hand.splice(i, 1)[0]);
                            p.flags.drunk = true;
                            this.log(`【${p.hero.name}】使用了【酒】，本回合下一張【殺】傷害+1！`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    } else if(c.name === '樂不思蜀' || c.name === '閃電' || c.name === '兵糧寸斷') {
                        if(c.name === '樂不思蜀') {
                            let target = enemies.find(o => !o.judges.some(j => j.name === '樂不思蜀'));
                            if(target) {
                                target.judges.push(p.hand.splice(i, 1)[0]);
                                this.log(`【${p.hero.name}】對【${target.hero.name}】使用了 樂不思蜀`);
                                UI.updateAll(); await this.sleep(800);
                            }
                        } else if(c.name === '兵糧寸斷') {
                            let target = enemies.find(o => this.getDistance(p.id, o.id) <= 1 && !o.judges.some(j => j.name === '兵糧寸斷'));
                            if(target) {
                                target.judges.push(p.hand.splice(i, 1)[0]);
                                this.log(`【${p.hero.name}】對【${target.hero.name}】使用了 兵糧寸斷`);
                                UI.updateAll(); await this.sleep(800);
                            }
                        } else {
                            if(!p.judges.some(j => j.name === '閃電')) {
                                p.judges.push(p.hand.splice(i, 1)[0]);
                                this.log(`【${p.hero.name}】使用了 閃電`);
                                UI.updateAll(); await this.sleep(800);
                            }
                        }
                    } else if(c.name === '決鬥') {
                        if(enemies.length > 0) {
                            this.discardPile.push(p.hand.splice(i,1)[0]);
                            await this.resolveDuel(p, enemies[0], c);
                        }
                    } else if(c.name === '火攻') {
                        let target = enemies.find(o => o.hand.length > 0);
                        if (target) {
                            this.discardPile.push(p.hand.splice(i, 1)[0]);
                            await this.resolveFireAttack(p, target, c);
                        }
                    } else if(c.name === '鐵索連環') {
                        this.discardPile.push(p.hand.splice(i, 1)[0]);
                        await this.drawCards(p, 1, '重鑄摸了');
                    } else if(c.name === '無中生有') {
                        this.discardPile.push(p.hand.splice(i,1)[0]);
                        if(!await this.askWuxie(c, p)) await this.drawCards(p, 2, '使用【無中生有】摸了');
                    } else if(c.name === '南蠻入侵' || c.name === '萬箭齊發' || c.name === '桃園結義') {
                        await this.useImmediateCard(p, p.hand.splice(i, 1)[0]);
                    }
                }
                
                // 3. AI Sha attack
                let canSha = (p.flags.usedSha < (p.equips.weapon && p.equips.weapon.name === '諸葛連弩' ? 99 : 1));
                if(p.hero.skills.includes('咆哮')) canSha = true;
                if(canSha) {
                    let idx = p.hand.findIndex(c => c.name === '殺' || (p.hero.skills.includes('龍膽') && c.name === '閃') || (p.hero.skills.includes('武聖') && c.color === COLOR.RED) || (p.hero.skills.includes('武神') && c.suit === SUIT.HEART));
                    if(idx !== -1) {
                        enemies = enemies.filter(o => this.getDistance(p.id, o.id) <= this.getAttackRange(p));
                        if(enemies.length > 0) {
                            let target = enemies[0];
                            let card = p.hand.splice(idx,1)[0];
                            this.discardPile.push(card);
                            p.flags.usedSha++;
                            this.log(`【${p.hero.name}】對【${target.hero.name}】使用了 殺！`);
                            UI.updateAll(); await this.sleep(800);
                            await this.resolveAttack(p, target, card);
                        }
                    }
                }
                
                // 4. Post-play AI Skills (like Rende)
                if (p.hero.skills.includes('仁德') && p.hand.length > 0 && allies.length > 0) {
                    let ally = allies[0];
                    while (p.hand.length > 0) {
                        let card = p.hand.pop();
                        ally.hand.push(card);
                        p.flags.renDeCount = (p.flags.renDeCount || 0) + 1;
                        this.log(`【${p.hero.name}】發動【仁德】給了【${ally.hero.name}】一張牌`);
                        if (p.flags.renDeCount === 2 && p.hp < p.maxHp) {
                            p.hp++;
                            this.log(`【${p.hero.name}】發動【仁德】回復了 1 點體力！`);
                        }
                        UI.updateAll(); await this.sleep(400);
                    }
                }
                
                if (p.hero.skills.includes('制衡') && !p.flags.usedZhiHeng && p.hand.length > 0) {
                    p.flags.usedZhiHeng = true;
                    let count = p.hand.length;
                    while (p.hand.length > 0) this.discardPile.push(p.hand.pop());
                    await this.drawCards(p, count, '發動【制衡】摸了');
                }
                
                await this.discardPhase(p);
            }

            async onPlayDodge(player, source) {
                if (player.hero.skills.includes('雷擊') && !player.isDead) {
                    let use = await this.askForSkill(player, '雷擊', `是否發動【雷擊】對一名角色造成2點雷電傷害？`);
                    if (use) {
                        let judge = await this.performJudge(player, '雷擊');
                        if (judge.suit === SUIT.SPADE) {
                            let damagedTarget = null;
                            if (player.id === 0) {
                                this.state = 'TARGETING';
                                this.pendingAction = {
                                    type: 'LEI_JI',
                                    resolve: async targetIdx => {
                                        damagedTarget = this.players[targetIdx];
                                        await this.dealDamage(player, damagedTarget, 2, null, 'lightning');
                                    }
                                };
                                this.selectedTargets = [];
                                this.log('請選擇一名角色發動雷擊');
                                UI.updateAll();
                                await new Promise(resolve => {
                                    let check = setInterval(() => {
                                        if (this.state !== 'TARGETING') {
                                            clearInterval(check);
                                            resolve();
                                        }
                                    }, 100);
                                });
                            } else {
                                let enemies = this.getLivingPlayers().filter(p => this.isEnemy(player, p));
                                damagedTarget = enemies.sort((a,b) => a.hp - b.hp)[0] || source || player;
                                await this.dealDamage(player, damagedTarget, 2, null, 'lightning');
                            }
                        } else {
                            this.log('雷擊判定不為黑桃，發動失敗！');
                            await this.sleep(800);
                        }
                    }
                }
            }

            async performPinDian(p1, p2) {
                this.log(`【${p1.hero.name}】與【${p2.hero.name}】開始拼點！`);
                await this.sleep(800);
                
                let c1, c2;
                if (p1.id === 0) {
                    let cards = await this.askForCard(p1, [], 1, '請選擇一張拼點手牌', false);
                    c1 = cards[0];
                } else {
                    let maxIdx = 0;
                    for (let i = 1; i < p1.hand.length; i++) {
                        if (this.getCardPointValue(p1.hand[i].point) > this.getCardPointValue(p1.hand[maxIdx].point)) {
                            maxIdx = i;
                        }
                    }
                    c1 = p1.hand.splice(maxIdx, 1)[0];
                    this.discardPile.push(c1);
                }
                
                if (p2.id === 0) {
                    let cards = await this.askForCard(p2, [], 1, '請選擇一張拼點手牌', false);
                    c2 = cards[0];
                } else {
                    let maxIdx = 0;
                    for (let i = 1; i < p2.hand.length; i++) {
                        if (this.getCardPointValue(p2.hand[i].point) > this.getCardPointValue(p2.hand[maxIdx].point)) {
                            maxIdx = i;
                        }
                    }
                    c2 = p2.hand.splice(maxIdx, 1)[0];
                    this.discardPile.push(c2);
                }
                
                this.log(`【${p1.hero.name}】打出：${c1.name} (${c1.suit} ${c1.point})`);
                await this.sleep(1000);
                this.log(`【${p2.hero.name}】打出：${c2.name} (${c2.suit} ${c2.point})`);
                await this.sleep(1000);
                
                let v1 = this.getCardPointValue(c1.point);
                let v2 = this.getCardPointValue(c2.point);
                let win = v1 > v2;
                this.log(`拼點結果：【${win ? p1.hero.name : p2.hero.name}】贏！`);
                await this.sleep(800);
                return win;
            }

            getCardPointValue(p) {
                if (p === 'A') return 1;
                if (p === 'J') return 11;
                if (p === 'Q') return 12;
                if (p === 'K') return 13;
                return parseInt(p);
            }

            shouldAIWuxie(player, target, trickCard, negated) {
                let harmful = ['決鬥', '南蠻入侵', '萬箭齊發', '樂不思蜀', '兵糧寸斷', '閃電', '過河拆橋', '順手牽羊'].includes(trickCard.name);
                let sameSide = this.isSameSide(player, target);
                return negated ? ((harmful && !sameSide) || (!harmful && sameSide)) : ((harmful && sameSide) || (!harmful && !sameSide));
            }

            async askWuxie(trickCard, target) {
                let negated = false;
                let passed = 0;
                let idx = this.currentPlayerIdx;
                while(passed < this.players.length) {
                    let p = this.players[idx];
                    if(!p.isDead && p.hand.some(c => c.name === '無懈可擊')) {
                        let used = false;
                        if(p.id === 0) {
                            used = await this.askForCard(p, ['無懈可擊'], 1, `【${trickCard.name}】${negated ? '已被無懈，是否再用無懈使其生效？' : `即將對【${target.hero.name}】生效，是否使用無懈可擊？`}`, true);
                        } else if(this.shouldAIWuxie(p, target, trickCard, negated)) {
                            let wIdx = p.hand.findIndex(c => c.name === '無懈可擊');
                            this.discardPile.push(p.hand.splice(wIdx, 1)[0]);
                            used = true;
                        }
                        if(used) {
                            negated = !negated;
                            passed = 0;
                            this.log(`【${p.hero.name}】使用了 無懈可擊，${trickCard.name}${negated ? '暫時被抵消' : '重新生效'}`);
                            UI.updateAll(); await this.sleep(800);
                        }
                    }
                    idx = (idx + 1) % this.players.length;
                    passed++;
                }
                return negated;
            }

            async askForCard(player, validCardNames, count, promptMsg, optional = false, suitConstraint = null, colorConstraint = null) {
                if (player.flags.yiJueLoss) {
                    this.log(`【${player.hero.name}】處於義絕狀態，無法出牌/打出牌！`);
                    await this.sleep(600);
                    return false;
                }
                if (player.id === 0) {
                    return new Promise(resolve => {
                        this.state = 'RESPONDING';
                        this.pendingAction = { type: 'NEED_CARD', names: validCardNames, count: count, resolve: resolve, optional: optional, suit: suitConstraint, color: colorConstraint };
                        this.log(promptMsg);
                        UI.updateAll();
                    });
                } else {
                    let found = [];
                    for(let i=player.hand.length-1; i>=0; i--) {
                        let c = player.hand[i];
                        let isValid = validCardNames.length === 0 || validCardNames.includes(c.name) || 
                            (validCardNames.includes('閃') && player.hero.skills.includes('龍膽') && c.name === '殺') ||
                            (validCardNames.includes('殺') && player.hero.skills.includes('龍膽') && c.name === '閃') ||
                            (validCardNames.includes('殺') && player.hero.skills.includes('武聖') && c.color === COLOR.RED) ||
                            (validCardNames.includes('閃') && player.hero.skills.includes('傾國') && c.color === COLOR.BLACK) ||
                            (validCardNames.includes('桃') && player.hero.skills.includes('急救') && c.color === COLOR.RED && this.currentPlayerIdx !== player.id) ||
                            (validCardNames.includes('殺') && player.hero.skills.includes('武神') && c.suit === SUIT.HEART) ||
                            (validCardNames.includes('桃') && player.hero.skills.includes('龍魂') && c.suit === SUIT.HEART) ||
                            (validCardNames.includes('殺') && player.hero.skills.includes('龍魂') && c.suit === SUIT.DIAMOND) ||
                            (validCardNames.includes('閃') && player.hero.skills.includes('龍魂') && c.suit === SUIT.CLUB) ||
                            (validCardNames.includes('無懈可擊') && player.hero.skills.includes('龍魂') && c.suit === SUIT.SPADE);
                        if (suitConstraint && c.suit !== suitConstraint) isValid = false;
                        if (colorConstraint && c.color !== colorConstraint) isValid = false;
                        if (isValid) {
                            found.push(i);
                            if(found.length === count) break;
                        }
                    }
                    if(found.length === count) {
                        let discardedCards = [];
                        found.sort((a,b) => b-a);
                        for(let idx of found) {
                            let card = player.hand.splice(idx, 1)[0];
                            if (player.hero.skills.includes('龍魂')) {
                                if (card.suit === SUIT.HEART && validCardNames.includes('桃')) { card.name = '桃'; card.type = 'basic'; }
                                else if (card.suit === SUIT.DIAMOND && validCardNames.includes('殺')) { card.name = '殺'; card.type = 'basic'; card.damageType = 'fire'; }
                                else if (card.suit === SUIT.CLUB && validCardNames.includes('閃')) { card.name = '閃'; card.type = 'basic'; }
                                else if (card.suit === SUIT.SPADE && validCardNames.includes('無懈可擊')) { card.name = '無懈可擊'; card.type = 'trick'; }
                            }
                            discardedCards.push(card);
                        }
                        discardedCards.forEach(c => this.discardPile.push(c));
                        return discardedCards;
                    }
                    return false;
                }
            }

            async askForSkill(player, skillName, promptMsg) {
                if(player.id === 0) {
                    return new Promise(resolve => {
                        this.state = 'ASK_SKILL';
                        this.pendingAction = { type: 'ASK_SKILL', skillName: skillName, resolve: resolve };
                        this.log(promptMsg + ' (確定=發動，取消=不發動)');
                        UI.updateAll();
                    });
                } else {
                    if(skillName === '八卦陣') return true;
                    if(skillName === '青龍偃月刀' && player.hand.some(c=>c.name==='殺' || (player.hero.skills.includes('龍膽')&&c.name==='閃') || (player.hero.skills.includes('武聖')&&c.color===COLOR.RED))) return true;
                    if(skillName === '貫石斧' && player.hand.length >= 2) return true;
                    if(skillName === '雌雄雙股劍') return true;
                    if(skillName === '麒麟弓') return true;
                    if(skillName === '雌雄雙股劍_選擇') return true;
                    if(skillName === '麒麟弓_選擇') return true;
                    if(skillName === '奸雄') return true;
                    if(skillName === '反饋') return true;
                    if(skillName === '剛烈') return true;
                    if(skillName === '雷擊') return true;
                    if(skillName === '節命') return true;
                    if(skillName === '好施') return true;
                    if(skillName === '歸心') return true;
                    if(skillName === '朱雀羽扇') return true;
                    return false;
                }
            }

            async transmitChainedDamage(originalTarget, amount, damageType, damageCard) {
                let chainedPlayers = this.players.filter(p => !p.isDead && p.isChained && p.id !== originalTarget.id);
                originalTarget.isChained = false;
                for (let p of chainedPlayers) {
                    p.isChained = false;
                }
                for (let p of chainedPlayers) {
                    this.log(`【鐵索連環】傷害傳導至【${p.hero.name}】！`);
                    await this.sleep(600);
                    await this.dealDamage(null, p, amount, damageCard, damageType, false);
                }
            }

            async dealDamage(source, target, amount, damageCard=null, damageType='normal', triggerChain=true) {
                if (damageCard && damageCard.damageType) {
                    damageType = damageCard.damageType;
                }
                
                let ignoreArmor = source && source.equips.weapon && source.equips.weapon.name === '青釭劍';
                if (!ignoreArmor && target.equips.armor && target.equips.armor.name === '藤甲') {
                    if (damageType === 'fire') {
                        amount++;
                        this.log(`【藤甲】使收到的火焰傷害+1！`);
                        await this.sleep(600);
                    }
                }
                
                if (!ignoreArmor && target.equips.armor && target.equips.armor.name === '白銀獅子') {
                    if (amount > 1) {
                        amount = 1;
                        this.log(`【白銀獅子】將傷害限制為1點！`);
                        await this.sleep(600);
                    }
                }

                target.hp -= amount;
                this.log(`【${target.hero.name}】受到 ${amount} 點【${damageType === 'fire' ? '火焰' : damageType === 'lightning' ? '雷電' : '普通'}】傷害`);
                
                if (source && source.hero.skills.includes('狂暴')) {
                    source.flags.wrath = (source.flags.wrath || 0) + amount;
                    this.log(`【${source.hero.name}】造成傷害，獲得 ${amount} 個暴怒標記 (當前:${source.flags.wrath})`);
                }
                if (target && target.hero.skills.includes('狂暴')) {
                    target.flags.wrath = (target.flags.wrath || 0) + amount;
                    this.log(`【${target.hero.name}】受到傷害，獲得 ${amount} 個暴怒標記 (當前:${target.flags.wrath})`);
                }

                UI.updateAll(); await this.sleep(800);
                
                await this.triggerHook('onDamage', { source, target, amount, card: damageCard, damageType });
                await this.handleDamageSkills(source, target, amount, damageCard);
                
                if (triggerChain && target.isChained && (damageType === 'fire' || damageType === 'lightning')) {
                    await this.transmitChainedDamage(target, amount, damageType, damageCard);
                }
                
                if(target.hp <= 0) {
                    await this.checkDying(target, source);
                }
            }

            async handleDamageSkills(source, target, amount, damageCard) {
                if(target.hp <= 0) return;
                
                // Cao Cao (奸雄) / Jie Cao Cao (奸雄)
                if(target.hero.skills.includes('奸雄') && damageCard) {
                    let prompt = target.hero.id === 'jie_cao_cao' ? `是否發動【奸雄】獲得傷害牌並摸一張牌？` : `是否發動【奸雄】獲得傷害牌？`;
                    let use = await this.askForSkill(target, '奸雄', prompt);
                    if(use) {
                        target.hand.push(this.getCardFromDiscard(damageCard));
                        if (target.hero.id === 'jie_cao_cao') {
                            await this.drawCards(target, 1, '發動【奸雄】摸了');
                        }
                        this.log(`【${target.hero.name}】發動【奸雄】獲得了 ${damageCard.name}`);
                        UI.updateAll(); await this.sleep(800);
                    }
                }
                
                // Sima Yi (反饋)
                if(target.hero.skills.includes('反饋') && source && source.hand.length > 0) {
                    let use = await this.askForSkill(target, '反饋', `是否發動【反饋】獲得傷害來源一張牌？`);
                    if(use) {
                        target.hand.push(source.hand.pop());
                        this.log(`【${target.hero.name}】發動【反饋】獲得一張牌`);
                        UI.updateAll(); await this.sleep(800);
                    }
                }
                
                // Xiahou Dun (剛烈)
                if(target.hero.skills.includes('剛烈') && source && !source.isDead) {
                    let use = await this.askForSkill(target, '剛烈', `是否發動【剛烈】？`);
                    if(use) {
                        let judge = await this.performJudge(target, '剛烈');
                        this.log(`剛烈判定為 ${judge.suit} ${judge.point}`);
                        await this.sleep(800);
                        if(judge.suit !== SUIT.HEART) {
                            let discarded = source.hand.length >= 2 ? await this.askForCard(source, [], 2, `【剛烈】請棄置兩張牌，否則受到1點傷害`, true) : false;
                            if(!discarded) await this.dealDamage(target, source, 1, null);
                        }
                    }
                }
                
                // Guo Jia (遺計)
                if(target.hero.skills.includes('遺計')) {
                    for(let d=0; d<amount; d++) {
                        await this.drawCards(target, 2, '發動【遺計】摸了');
                    }
                }
                
                // Hua Xiong (耀武)
                if(target.hero.skills.includes('耀武') && source && damageCard && damageCard.name === '殺' && damageCard.color === COLOR.RED) {
                    if(source.hp < source.maxHp) source.hp++; else source.hand.push(this.drawCard());
                    this.log(`【華雄】耀武觸發，【${source.hero.name}】獲得收益`);
                    UI.updateAll(); await this.sleep(800);
                }
                
                // Xun Yu (節命)
                if(target.hero.skills.includes('節命')) {
                    for (let d = 0; d < amount; d++) {
                        let use = await this.askForSkill(target, '節命', `是否發動【節命】令一名角色補牌？`);
                        if (use) {
                            let chosenTarget = null;
                            if (target.id === 0) {
                                this.state = 'TARGETING';
                                this.pendingAction = {
                                    type: 'JIE_MING',
                                    resolve: async tIdx => {
                                        chosenTarget = this.players[tIdx];
                                        let count = Math.min(5, chosenTarget.maxHp - chosenTarget.hand.length);
                                        if (count > 0) {
                                            await this.drawCards(chosenTarget, count, '發動【節命】摸了');
                                        } else {
                                            this.log(`【${chosenTarget.hero.name}】手牌已達上限，無需摸牌`);
                                            await this.sleep(800);
                                        }
                                    }
                                };
                                this.selectedTargets = [];
                                this.log('請選擇發動節命的目標角色');
                                UI.updateAll();
                                await new Promise(res => {
                                    let check = setInterval(() => {
                                        if (this.state !== 'TARGETING') {
                                            clearInterval(check);
                                            res();
                                        }
                                    }, 100);
                                });
                            } else {
                                let allies = this.getLivingPlayers().filter(o => this.isSameSide(target, o));
                                chosenTarget = allies.sort((a,b) => a.hand.length - b.hand.length)[0] || target;
                                let count = Math.min(5, chosenTarget.maxHp - chosenTarget.hand.length);
                                if (count > 0) {
                                    await this.drawCards(chosenTarget, count, '發動【節命】摸了');
                                }
                            }
                        }
                    }
                }
                
                // Zuo Ci (新生)
                if(target.hero.skills.includes('新生')) {
                    for (let d = 0; d < amount; d++) {
                        await this.drawCards(target, 1, '發動【新生】摸了');
                    }
                }
                
                // Shen Cao Cao (歸心)
                if(target.hero.skills.includes('歸心')) {
                    for (let d = 0; d < amount; d++) {
                        let use = await this.askForSkill(target, '歸心', `是否發動【歸心】獲得所有其他角色的一張牌並翻面？`);
                        if (use) {
                            for (let p of this.getLivingPlayers().filter(o => o.id !== target.id)) {
                                let ref = this.getFirstRemovableCard(p);
                                if (ref) {
                                    if (ref.zone === 'hand') {
                                        let card = p.hand.pop();
                                        target.hand.push(card);
                                    } else {
                                        await this.loseEquip(p, ref.slot, 'hand', target);
                                    }
                                }
                            }
                            this.log(`【神曹操】發動【歸心】收刮了所有人的各一張牌！`);
                            target.flags.turnedOver = !target.flags.turnedOver;
                            this.log(`【神曹操】翻面！`);
                            UI.updateAll(); await this.sleep(1000);
                        }
                    }
                }
            }

            async checkDying(target, source) {
                this.log(`【${target.hero.name}】進入瀕死狀態！`);
                
                // 神趙雲 絕境: draw on enter dying
                if (target.hero.skills.includes('絕境') && target.hand.length < 2) {
                    await this.drawCards(target, 2 - target.hand.length, '發動【絕境】');
                }

                // 賈詡 完殺
                let isWansha = this.players[this.currentPlayerIdx].hero.skills.includes('完殺');

                while(target.hp <= 0) {
                    let rescued = false;
                    for(let i=0; i<this.players.length; i++) {
                        let rescuerIdx = (this.currentPlayerIdx + i) % this.players.length;
                        let rescuer = this.players[rescuerIdx];
                        if(rescuer.isDead) continue;
                        
                        // 完殺限制
                        if (isWansha && rescuer.id !== this.currentPlayerIdx && rescuer.id !== target.id) {
                            continue;
                        }
                        
                        if(rescuer.id === 0) {
                            let validRescueCards = (rescuer.id === target.id) ? ['桃', '酒'] : ['桃'];
                            let played = await this.askForCard(rescuer, validRescueCards, 1, `【${target.hero.name}】瀕死，是否使用桃/酒？`, true);
                            if(played) {
                                target.hp++; rescued = true;
                                this.log(`你對【${target.hero.name}】使用了回復卡牌！`);
                                UI.updateAll(); await this.sleep(800);
                            }
                        } else {
                            let cardIdx = rescuer.hand.findIndex(c => c.name === '桃');
                            if (cardIdx === -1 && rescuer.id === target.id) {
                                cardIdx = rescuer.hand.findIndex(c => c.name === '酒');
                            }
                            if(cardIdx !== -1) {
                                let shouldSave = rescuer.id === target.id || rescuer.role === target.role || (rescuer.role === ROLE.LOYAL && target.role === ROLE.LORD) || (rescuer.role === ROLE.LORD && target.role === ROLE.LOYAL);
                                if(shouldSave) {
                                    let c = rescuer.hand.splice(cardIdx, 1)[0];
                                    this.discardPile.push(c);
                                    target.hp++; rescued = true;
                                    this.log(`【${rescuer.hero.name}】對【${target.hero.name}】使用了 ${c.name}！`);
                                    UI.updateAll(); await this.sleep(800);
                                }
                            }
                        }
                        if(target.hp > 0) {
                            // 神趙雲 絕境: draw on exit dying
                            if (target.hero.skills.includes('絕境') && target.hand.length < 2) {
                                await this.drawCards(target, 2 - target.hand.length, '發動【絕境】');
                            }
                            break;
                        }
                    }
                    if(!rescued) break;
                }
                if(target.hp <= 0) {
                    target.isDead = true;
                    this.log(`【${target.hero.name}】(${target.role}) 陣亡！`);
                    UI.updateAll();
                    await this.sleep(800);
                    
                    // Shen Guan Yu (武魂) trigger
                    if (target.hero.skills.includes('武魂') && source && !source.isDead) {
                        this.log(`【神關羽】觸發【武魂】，索命【${source.hero.name}】！`);
                        await this.sleep(1000);
                        let judge = await this.performJudge(source, '武魂');
                        if (judge.name !== '桃' && judge.name !== '桃園結義') {
                            source.isDead = true;
                            source.hp = 0;
                            this.log(`【${source.hero.name}】判定結果不為桃或桃園結義，【武魂】生效，立即死亡！`);
                            UI.updateAll(); await this.sleep(1000);
                        } else {
                            this.log(`【${source.hero.name}】判定為【${judge.name}】，武魂未生效。`);
                            await this.sleep(800);
                        }
                    }
                    
                    if(source && source.id !== target.id && !source.isDead) {
                        if(target.role === ROLE.REBEL) {
                            this.log(`【${source.hero.name}】擊殺了反賊，獲得 3 張牌獎勵！`);
                            await this.drawCards(source, 3, '擊殺反賊獎勵摸了');
                        } else if(target.role === ROLE.LOYAL && source.role === ROLE.LORD) {
                            this.log(`主公誤殺忠臣，棄置所有手牌與裝備！`);
                            await this.sleep(800);
                            while(source.hand.length > 0) this.discardPile.push(source.hand.pop());
                            for(let slot of ['weapon', 'armor', 'defMount', 'offMount', 'treasure']) {
                                if(source.equips[slot]) {
                                    this.discardPile.push(source.equips[slot]);
                                    source.equips[slot] = null;
                                }
                            }
                            UI.updateAll(); await this.sleep(800);
                        }
                    }
                    await this.checkGameOver();
                }
            }

            async onSkillClick() {
                let p = this.players[0];
                if (p.flags.yiJueLoss) {
                    this.log(`你處於義絕狀態，無法使用/發動技能！`);
                    return;
                }
                let activeSkills = [];
                if(p.hero.skills.includes('仁德')) activeSkills.push('仁德');
                if(p.hero.skills.includes('制衡') && !p.flags.usedZhiHeng) activeSkills.push('制衡');
                if(p.hero.skills.includes('苦肉')) activeSkills.push('苦肉');
                if(p.hero.skills.includes('青囊') && !p.flags.usedQingNang) activeSkills.push('青囊');
                if(p.hero.skills.includes('結姻') && !p.flags.usedJieYin) activeSkills.push('結姻');
                if(p.hero.skills.includes('離間') && !p.flags.usedLiJian) activeSkills.push('離間');
                if(p.hero.skills.includes('反間') && !p.flags.usedFanJian) activeSkills.push('反間');
                if(p.hero.skills.includes('奇襲')) activeSkills.push('奇襲');
                if(p.hero.skills.includes('國色')) activeSkills.push('國色');
                if(p.hero.skills.includes('亂擊')) activeSkills.push('亂擊');
                if(p.hero.skills.includes('驅虎') && !p.flags.usedQuHu) activeSkills.push('驅虎');
                if(p.hero.skills.includes('締盟') && !p.flags.usedDiMeng) activeSkills.push('締盟');
                if(p.hero.skills.includes('神憤') && (p.flags.wrath || 0) >= 6) activeSkills.push('神憤');
                if(p.hero.skills.includes('義絕') && !p.flags.usedYiJue) activeSkills.push('義絕');
                if(p.equips.weapon && p.equips.weapon.name === '丈八蛇矛') activeSkills.push('丈八蛇矛');
                
                if(activeSkills.length === 0) {
                    this.log('沒有可以發動的主動技能或已達次數上限');
                    return;
                }
                
                let skill = activeSkills[0];
                if (activeSkills.length > 1) {
                    let opt = await this.askForSkill(p, '選擇技能', `確定=發動【${activeSkills[0]}】，取消=發動【${activeSkills[1]}】`);
                    skill = opt ? activeSkills[0] : activeSkills[1];
                }
                
                if(skill === '苦肉') {
                    let res = await this.askForSkill(p, '苦肉', `是否失去1點體力並摸兩張牌？`);
                    if(res) {
                        p.hp--;
                        this.log(`【${p.hero.name}】發動【苦肉】流失1點體力！`);
                        UI.updateAll(); await this.sleep(600);
                        if(!p.isDead) {
                            await this.drawCards(p, 2, '發動【苦肉】摸了');
                        }
                    }
                    if(this.state !== 'GAME_OVER') { this.state = 'PLAYING'; UI.updateAll(); }
                }
                else if(skill === '制衡') {
                    let cards = await this.askForCard(p, [], 99, '請選擇任意張手牌/裝備棄置發動【制衡】(可選多張，按確定)', true);
                    if(cards && cards.length > 0) {
                        p.flags.usedZhiHeng = true;
                        let count = cards.length;
                        await this.drawCards(p, count, '發動【制衡】摸了');
                    }
                    if(this.state !== 'GAME_OVER') { this.state = 'PLAYING'; UI.updateAll(); }
                }
                else if(skill === '青囊') {
                    let cards = await this.askForCard(p, [], 1, '請棄置一張手牌發動【青囊】', true);
                    if(cards && cards.length === 1) {
                        p.flags.usedQingNang = true;
                        let target = this.getLivingPlayers().find(o => o.hp < o.maxHp) || p;
                        if(target.hp < target.maxHp) target.hp++;
                        this.log(`【青囊】令【${target.hero.name}】回復1點體力`);
                        UI.updateAll(); await this.sleep(800);
                    }
                    if(this.state !== 'GAME_OVER') { this.state = 'PLAYING'; UI.updateAll(); }
                }
                else if(skill === '仁德') {
                    let cards = await this.askForCard(p, [], 1, '請選擇要給出的一張手牌發動【仁德】', true);
                    if (cards && cards.length === 1) {
                        let card = cards[0];
                        let discardIdx = this.discardPile.findIndex(c => c.id === card.id);
