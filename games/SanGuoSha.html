<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三國殺 (San Guo Sha) - 終極優化版 (標準+軍爭+界限突破+神話+SP)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        :root {
            --bg-color: #0c0a09;
            --text-main: #f5f5f4;
            --theme-red: #ef4444;
            --theme-gold: #f59e0b;
            --theme-border: #78350f;
            --glass-bg: rgba(24, 18, 15, 0.85);
            --glass-border: rgba(245, 158, 11, 0.25);
            --glow-gold: 0 0 15px rgba(245, 158, 11, 0.6);
        }

        body {
            margin: 0; padding: 0; box-sizing: border-box;
            background: radial-gradient(circle, #2e1d13 0%, #0d0907 100%);
            font-family: 'Noto Serif TC', serif;
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(12, 10, 9, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--theme-border);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .back-btn { 
            color: #d6d3d1; 
            text-decoration: none; 
            font-size: 1rem; 
            font-weight: 700;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { color: var(--theme-gold); }
        .game-title { 
            background: linear-gradient(to right, #ffe17d, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0; 
            font-size: 1.8rem; 
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.2); 
        }

        /* Battlefield */
        .battlefield {
            flex: 1; position: relative;
        }

        /* Player Areas */
        .player-area {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            border-radius: 12px; padding: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .player-area.active { 
            box-shadow: var(--glow-gold), 0 10px 30px rgba(0,0,0,0.7); 
            border-color: var(--theme-gold); 
            transform: scale(1.02);
        }
        .player-area.dead { filter: grayscale(100%); opacity: 0.4; pointer-events: none; }
        .player-area.targetable { 
            box-shadow: 0 0 20px #10b981; 
            border-color: #10b981; 
            cursor: pointer; 
        }
        .player-area.targetable:hover {
            transform: scale(1.03);
        }

        /* P0 (Human) - Bottom */
        #p0 { 
            bottom: 12px; left: 50%; transform: translateX(-50%); 
            width: 96%; max-width: 1300px; 
            flex-direction: row; justify-content: space-between; 
            padding: 14px 20px;
        }
        #p0 .hero-section { display: flex; align-items: center; gap: 20px; }
        #p0 .hand-section { 
            display: flex; gap: 12px; flex: 1; margin: 0 24px; 
            overflow-x: auto; padding-bottom: 12px; align-items: flex-end; height: 190px;
            scrollbar-width: thin;
            scrollbar-color: var(--theme-border) transparent;
        }
        #p0 .hand-section::-webkit-scrollbar {
            height: 6px;
        }
        #p0 .hand-section::-webkit-scrollbar-thumb {
            background-color: var(--theme-border);
            border-radius: 3px;
        }
        #p0 .equip-section { display: flex; flex-direction: column; gap: 6px; width: 160px; font-size: 0.9rem; }
        
        /* P1 (Left), P2 (Top), P3 (Right) */
        #p1 { top: 45%; left: 16px; transform: translateY(-50%); }
        #p2 { top: 16px; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 20px;}
        #p3 { top: 45%; right: 16px; transform: translateY(-50%); }
        
        .ai-equip { font-size: 0.8rem; color: #d6d3d1; text-align: center; margin-top: 10px; display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .ai-equip-item { background: rgba(12, 10, 9, 0.6); border: 1px solid rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .hero-card {
            width: 110px; height: 154px; background-size: cover; background-position: center;
            border: 2px solid var(--theme-border); border-radius: 8px; position: relative;
            background-color: #1c1917; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; font-weight: bold; color: var(--theme-gold); text-shadow: 1px 1px 3px black;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .hero-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        #p0 .hero-card { width: 125px; height: 175px; font-size: 1.8rem;}

        .role-icon {
            position: absolute; top: -14px; left: -14px; width: 34px; height: 34px;
            border-radius: 50%; border: 2px solid #f59e0b;
            display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 1.1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 10;
        }
        .role-lord { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); color: #fff; }
        .role-loyal { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); color: white; }
        .role-rebel { background: linear-gradient(135deg, #10b981 0%, #064e3b 100%); color: white; }
        .role-spy { background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%); color: white; }
        .role-unknown { background: #4b5563; color: #d1d5db; border-color: #9ca3af; }

        .hp-bar {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            background: rgba(12, 10, 9, 0.95); color: #ef4444; border: 1px solid var(--theme-gold);
            padding: 2px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); white-space: nowrap; display: flex; align-items: center; gap: 4px;
        }
        
        .hand-count {
            position: absolute; top: -14px; right: -14px; background: linear-gradient(135deg, #d97706 0%, #78350f 100%); color: white;
            border-radius: 50%; width: 28px; height: 28px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; border: 2px solid var(--theme-gold); box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            font-size: 0.9rem;
        }

        .name-tag { font-weight: bold; text-align: center; margin-bottom: 6px; text-shadow: 0 2px 4px black; color: #f5f5f4; }

        /* Cards */
        .card {
            width: 100px; 
            height: 140px; 
            background: #e5e7eb; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #4b5563;
            position: relative; cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: black; flex-shrink: 0;
            background-image: url('../assets/SanGuoSha/backgrounds/card_back.png');
            background-size: cover;
        }
        .card.face-up { background-image: none; background: linear-gradient(to bottom, #f9fafb 0%, #f3f4f6 100%); }
        .card:hover:not(.disabled) { 
            transform: translateY(-16px) scale(1.05); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-color: var(--theme-gold);
        }
        .card.selected { 
            transform: translateY(-24px) scale(1.05); 
            box-shadow: var(--glow-gold), 0 10px 25px rgba(0,0,0,0.6); 
            border-color: var(--theme-gold); 
        }
        .card.disabled { filter: grayscale(100%); pointer-events: none; opacity: 0.45; }
        
        .card-illustration {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 24px;
            background-size: cover;
            background-position: center;
            border-radius: 5px;
            border: 1px solid rgba(120, 53, 15, 0.2);
            opacity: 0.95;
            z-index: 1;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 900;
            position: absolute;
            top: 10px;
            left: 10px;
            writing-mode: vertical-rl;
            text-shadow: 0px 0px 4px white, 0px 0px 2px white;
            z-index: 10;
            letter-spacing: 2px;
        }
        .card-suit { font-size: 1.1rem; font-weight: bold; position: absolute; top: 6px; right: 6px; z-index: 10; text-shadow: 0px 0px 3px white; }
        .card-point { font-size: 1.1rem; font-weight: bold; position: absolute; top: 22px; right: 6px; z-index: 10; text-shadow: 0px 0px 3px white; }
        .suit-red { color: #ef4444; }
        .suit-black { color: #111827; }
        .card-desc {
            font-size: 0.65rem;
            position: absolute;
            bottom: 4px;
            left: 6px;
            right: 6px;
            text-align: center;
            line-height: 1.2;
            color: #f5f5f4;
            background: rgba(12, 10, 9, 0.85);
            padding: 2px 0;
            border-radius: 0 0 4px 4px;
            font-weight: bold;
            z-index: 10;
        }

        /* Center Area */
        .center-area {
            position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 50;
        }
        .log-box {
            background: rgba(12, 10, 9, 0.85); 
            border: 1px solid var(--theme-border); 
            padding: 16px 32px;
            border-radius: 12px; color: var(--theme-gold); font-size: 1.25rem; text-align: center;
            min-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }
        .action-buttons { display: flex; gap: 12px; }
        .btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%); 
            color: white; border: 1px solid var(--theme-gold); padding: 10px 24px;
            border-radius: 8px; font-size: 1.05rem; cursor: pointer; font-weight: bold; 
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:hover:not(:disabled) { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); 
            transform: scale(1.05); 
            box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4);
        }
        .btn:disabled { background: #4b5563; border-color: #6b7280; cursor: not-allowed; transform: none; color: #9ca3af; box-shadow: none;}
        .btn-cancel { background: linear-gradient(135deg, #4b5563 0%, #374151 100%); border-color: #9ca3af; }
        
        /* Modals */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0; 
            background: rgba(12, 10, 9, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200; display: none; justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-content { 
            background: radial-gradient(circle, #2d1a10 0%, #170d08 100%); 
            border: 2px solid var(--theme-border); padding: 32px; border-radius: 16px; 
            text-align: center; width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); 
            overflow: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; margin-top: 24px; }
        .hero-select-card {
            width: 100px; height: 140px; border: 2px solid #4b5563; border-radius: 8px;
            cursor: pointer; position: relative; background-color: #1c1917;
            display: flex; justify-content: center; align-items: center; color: var(--theme-gold); font-weight: bold; font-size: 1.2rem;
            background-size: cover; background-position: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .hero-select-card:hover { border-color: var(--theme-gold); transform: scale(1.08) translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.6); }
        .hero-select-name { position: absolute; bottom: 5px; font-size: 0.9rem; text-shadow: 1px 1px 3px black; color: white;}
        
        /* Card Info Panel */
        .card-info-panel {
            position: absolute; right: 24px; bottom: 240px; width: 260px;
            background: rgba(24, 18, 15, 0.95); border: 1px solid var(--theme-gold);
            border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none; z-index: 90; pointer-events: none;
            backdrop-filter: blur(8px); transition: opacity 0.3s;
        }
        .cip-title { color: var(--theme-gold); font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 6px;}
        .cip-desc { color: #e7e5e4; font-size: 0.9rem; line-height: 1.5; }

        /* Card Backgrounds */
        .card.bg-sha { background-image: url('../assets/SanGuoSha/backgrounds/basic_bg.png'); }
        .card.bg-shan { background-image: url('../assets/SanGuoSha/backgrounds/basic_bg.png'); }
        .card.bg-tao { background-image: url('../assets/SanGuoSha/backgrounds/basic_bg.png'); }
        .card.bg-trick { background-image: url('../assets/SanGuoSha/backgrounds/trick_bg.png'); }
        .card.bg-delay_trick { background-image: url('../assets/SanGuoSha/backgrounds/trick_bg.png'); }
        .card.bg-equip { background-image: url('../assets/SanGuoSha/backgrounds/equip_bg.png'); }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="../index.html" class="back-btn">← 返回大廳</a>
        <h1 class="game-title">三國殺 - 終極優化版 (標準+軍爭+界限突破+神話+SP)</h1>
        <div id="selfTestBadge" style="background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 4px;">
            <span>牌堆驗證中...</span>
        </div>
    </div>

    <div class="battlefield" id="battlefield">

        <!-- Player 0 (Bottom - Human) -->
        <div class="player-area" id="p0" onclick="Engine.onPlayerClick(0)">
            <div class="hero-section">
                <div class="hero-card" id="hero0" onclick="UI.showHeroInfo(0); event.stopPropagation();">
                    <div id="heroName0">?</div>
                    <div class="role-icon" id="role0" style="width:45px; height:45px; font-size:1.5rem; left:-20px;">主</div>
                    <div class="hp-bar" id="hp0"></div>
                </div>
                <div style="text-align:center;">
                    <div class="name-tag" id="name0" style="font-size:1.2rem;">玩家</div>
                    <button class="btn" id="btnSkill" style="display:none; margin-top:10px; font-size: 0.9rem; padding: 5px 10px;" onclick="Engine.onSkillClick()">發動技能</button>
                </div>
            </div>
            
            <div class="hand-section" id="hand0"></div>
            
            <div class="equip-section" id="equip0">
                <div style="border:1px solid #777; padding:5px; border-radius:4px; cursor:pointer;" id="eqWeapon0" onclick="UI.showEquipInfo('weapon')">武器: 無</div>
                <div style="border:1px solid #777; padding:5px; border-radius:4px; cursor:pointer;" id="eqArmor0" onclick="UI.showEquipInfo('armor')">防具: 無</div>
                <div style="border:1px solid #777; padding:5px; border-radius:4px; cursor:pointer;" id="eqDefMount0" onclick="UI.showEquipInfo('defMount')">+1馬: 無</div>
                <div style="border:1px solid #777; padding:5px; border-radius:4px; cursor:pointer;" id="eqOffMount0" onclick="UI.showEquipInfo('offMount')">-1馬: 無</div>
                <div style="border:1px solid #777; padding:5px; border-radius:4px; cursor:pointer;" id="eqTreasure0" onclick="UI.showEquipInfo('treasure')">寶物: 無</div>
            </div>
        </div>

        <!-- Center Area -->
        <div class="center-area">
            <div id="deckCount" style="color:var(--theme-gold); font-size:1.2rem; font-weight:bold; margin-bottom: 5px; text-shadow: 1px 1px 2px black;">牌堆剩餘: 0 張</div>
            <div class="log-box" id="gameLog">等待遊戲開始...</div>
            <div class="action-buttons">
                <button class="btn" id="btnConfirm" style="display:none;" onclick="Engine.onConfirm()">確定</button>
                <button class="btn btn-cancel" id="btnCancel" style="display:none;" onclick="Engine.onCancel()">取消</button>
                <button class="btn btn-cancel" id="btnEndTurn" style="display:none;" onclick="Engine.endTurn()">結束回合</button>
            </div>
        </div>

        <!-- Card Info Panel (Floating) -->
        <div class="card-info-panel" id="cardInfoPanel">
            <div id="cipTitle" class="cip-title"></div>
            <div id="cipDesc" class="cip-desc"></div>
        </div>
    </div>

    <!-- Lobby / Hero Selection Modal -->
    <div class="modal-overlay" id="lobbyModal" style="display:flex;">
        <div class="modal-content" style="max-width: 900px; max-height: 80vh; overflow-y: auto;">
            <div style="display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #777; padding-bottom: 15px; margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1 style="color:var(--theme-gold); margin:0;">請選擇你的武將</h1>
                    <div style="color: white; font-size: 1.1rem; display: flex; gap: 15px; align-items: center;">
                        <div>
                            <label for="gameModeSelect">模式：</label>
                            <select id="gameModeSelect" style="background: #333; color: white; border: 1px solid #777; padding: 5px; font-size: 1rem; border-radius: 4px;" onchange="if(window.Engine) window.Engine.updateLobbyMode()">
                                <option value="identity" selected>身分局</option>
                                <option value="1v1">1v1 單挑</option>
                                <option value="national">國戰</option>
                            </select>
                        </div>
                        <div id="playerCountWrapper">
                            <label for="playerCountSelect">人數：</label>
                            <select id="playerCountSelect" style="background: #333; color: white; border: 1px solid #777; padding: 5px; font-size: 1rem; border-radius: 4px;">
                                <option value="4" selected>4 人局 (1主 1忠 1反 1內)</option>
                                <option value="5">5 人局 (1主 1忠 2反 1內)</option>
                                <option value="6">6 人局 (1主 1忠 3反 1內)</option>
                                <option value="7">7 人局 (1主 2忠 3反 1內)</option>
                                <option value="8">8 人局 (1主 2忠 4反 1內)</option>
                                <option value="9">9 人局 (1主 3忠 4反 1內)</option>
                                <option value="10">10 人局 (1主 3忠 4反 2內)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div style="color: #ccc; font-size: 0.95rem; display: flex; gap: 15px; align-items: center;">
                    <span style="color: var(--theme-gold); font-weight: bold;">擴充包：</span>
                    <label><input type="checkbox" id="expMilitary" checked onchange="if(window.Engine) window.Engine.validateDeckTest()"> 軍爭篇</label>
                    <label><input type="checkbox" id="expGod" checked onchange="if(window.renderLobbyHeroes) window.renderLobbyHeroes(); if(window.Engine) window.Engine.validateDeckTest()"> 神話再臨</label>
                    <label><input type="checkbox" id="expBreakthrough" checked onchange="if(window.renderLobbyHeroes) window.renderLobbyHeroes(); if(window.Engine) window.Engine.validateDeckTest()"> 界限突破</label>
                    <label><input type="checkbox" id="expSP" checked onchange="if(window.renderLobbyHeroes) window.renderLobbyHeroes(); if(window.Engine) window.Engine.validateDeckTest()"> SP</label>
                    <button class="btn" style="padding: 2px 10px; font-size: 0.8rem;" onclick="if(window.Engine) window.Engine.validateDeckTest()">重新驗證牌堆</button>
                </div>
            </div>
            <div class="hero-grid" id="heroGrid"></div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="modal-overlay" id="infoModal" onclick="this.style.display='none'" style="z-index: 300;">
        <div class="modal-content" style="cursor: pointer; max-width: 400px; padding: 20px;">
            <h2 id="infoTitle" style="color: var(--theme-gold); margin-top: 0; font-size: 2rem;">標題</h2>
            <div id="infoImage" style="width: 150px; height: 210px; background-size: cover; background-position: center; margin: 0 auto 20px auto; border-radius: 8px; border: 2px solid #777; display:none;"></div>
            <p id="infoDesc" style="font-size: 1.2rem; line-height: 1.6; color: #f5f5f4; text-align: left;">說明</p>
            <p style="color: #777; font-size: 0.9rem; margin-top: 20px;">(點擊任意處關閉)</p>
                     </div>
    </div>

    <!-- Guan Xing Modal -->
    <div class="modal-overlay" id="guanXingModal" style="display:none; z-index: 400; align-items: center; justify-content: center;">
        <div class="modal-content" style="max-width: 600px; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
            <h2 style="color: var(--theme-gold); margin: 0; text-align: center;">觀星</h2>
            <p style="margin: 0; color: #ddd; text-align: center;">點擊卡牌決定其置於牌堆頂或牌堆底（先點選的排在最上方/最下方）</p>
            
            <div style="border: 1px dashed rgba(245, 158, 11, 0.4); padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.5);">
                <div style="color: var(--theme-gold); font-weight: bold; margin-bottom: 8px;">候選卡牌 (Candidate Cards)</div>
                <div id="gxCandidates" style="display: flex; gap: 10px; justify-content: center; min-height: 120px; flex-wrap: wrap;"></div>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1; border: 1px solid #10b981; padding: 10px; border-radius: 8px; background: rgba(16, 185, 129, 0.05); display: flex; flex-direction: column;">
                    <div style="color: #10b981; font-weight: bold; margin-bottom: 8px; text-align: center;">置於牌堆頂 (Top of Deck)</div>

            { id: 'si_ma_yi', name: '司馬懿', hp: 3, faction: 'wei', exp: 'standard', skills: ['反饋', '鬼才'], desc: '【反饋】當你受到傷害後，你可以獲得傷害來源的一張牌。<br>【鬼才】當一名角色的判定牌生效前，你可以打出一張手牌代替之。' },
            { id: 'xia_hou_dun', name: '夏侯惇', hp: 4, faction: 'wei', exp: 'standard', skills: ['剛烈'], desc: '【剛烈】當你受到傷害後，你可以進行一次判定，若結果不為紅桃，傷害來源選擇一項：棄置兩張手牌，或受到你對其造成的1點傷害。' },
            { id: 'zhang_liao', name: '張遼', hp: 4, faction: 'wei', exp: 'standard', skills: ['突襲'], desc: '【突襲】摸牌階段，你可以放棄摸牌，改為獲得一至兩名其他角色的各一張手牌。' },
            { id: 'xu_chu', name: '許褚', hp: 4, faction: 'wei', exp: 'standard', skills: ['裸衣'], desc: '【裸衣】摸牌階段，你可以少摸一張牌，若如此做，你本回合使用【殺】或【決鬥】造成的傷害+1。' },
            { id: 'guo_jia', name: '郭嘉', hp: 3, faction: 'wei', exp: 'standard', skills: ['天妒', '遺計'], desc: '【天妒】當你的判定牌生效後，你可以獲得此牌。<br>【遺計】當你受到1點傷害後，你可以摸兩張牌，然後可以將這些牌交給任意角色。' },
            { id: 'zhen_ji', name: '甄姬', hp: 3, faction: 'wei', exp: 'standard', skills: ['傾國', '洛神'], desc: '【傾國】你可以將一張黑色手牌當【閃】使用或打出。<br>【洛神】準備階段，你可以進行一次判定，若結果為黑色，你獲得此牌，並可重複此流程。' },
            
            { id: 'liu_bei', name: '劉備', hp: 4, faction: 'shu', exp: 'standard', skills: ['仁德', '激將'], desc: '【仁德】出牌階段，你可以將任意張手牌交給其他角色，若你於此階段給出第二張手牌，你回復1點體力。<br>【激將】主公技，當你需要使用或打出【殺】時，你可以令其他蜀勢力角色打出【殺】。' },
            { id: 'guan_yu', name: '關羽', hp: 4, faction: 'shu', exp: 'standard', skills: ['武聖'], desc: '【武聖】你可以將一張紅色牌當【殺】使用或打出。' },
            { id: 'zhang_fei', name: '張飛', hp: 4, faction: 'shu', exp: 'standard', skills: ['咆哮'], desc: '【咆哮】你使用【殺】無次數限制。' },
            { id: 'zhu_ge_liang', name: '諸葛亮', hp: 3, faction: 'shu', exp: 'standard', skills: ['觀星', '空城'], desc: '【觀星】準備階段，你可以觀看牌堆頂的 X 張牌（X 為存活角色數且最多為5），然後將 these 牌以任意順序置於牌堆頂或牌堆底。<br>【空城】鎖定技，若你沒有手牌，你不能被選擇為【殺】或【決鬥】的目標。' },
            { id: 'zhao_yun', name: '趙雲', hp: 4, faction: 'shu', exp: 'standard', skills: ['龍膽'], desc: '【龍膽】你可以將一張【殺】當【閃】使用或打出；你可以將一張【閃】當【殺】使用或打出。' },
            { id: 'ma_chao', name: '馬超', hp: 4, faction: 'shu', exp: 'standard', skills: ['馬術', '鐵騎'], desc: '【馬術】鎖定技，你計算與其他角色的距離-1。<br>【鐵騎】當你使用【殺】指定一名角色為目標後，你可以進行一次判定，若結果為紅色，該角色不能使用【閃】。' },
            { id: 'huang_yue_ying', name: '黃月英', hp: 3, faction: 'shu', exp: 'standard', skills: ['集智', '奇才'], desc: '【集智】當你使用一張非延時類錦囊牌時，你可以摸一張牌。<br>【奇才】鎖定技，你使用錦囊牌無距離限制。' },
 
            { id: 'sun_quan', name: '孫權', hp: 4, faction: 'wu', exp: 'standard', skills: ['制衡', '救援'], desc: '【制衡】出牌階段限一次，你可以棄置任意張牌，然後摸等量的牌。<br>【救援】主公技，鎖定技，其他吳勢力角色對你使用【桃】回復的體力+1。' },
            { id: 'gan_ning', name: '甘寧', hp: 4, faction: 'wu', exp: 'standard', skills: ['奇襲'], desc: '【奇襲】你可以將一張黑色牌當【過河拆橋】使用。' },
            { id: 'lu_meng', name: '呂蒙', hp: 4, faction: 'wu', exp: 'standard', skills: ['克己'], desc: '【克己】若你於出牌階段內未使用或打出過【殺】，棄牌階段你的手牌上限為你的體力上限。' },
            { id: 'zhou_yu', name: '周瑜', hp: 3, faction: 'wu', exp: 'standard', skills: ['英姿', '反間'], desc: '【英姿】摸牌階段，你可以額外摸一張牌。<br>【反間】出牌階段限一次，你可以令一名其他角色選擇一種花色後獲得你的一張手牌，若猜錯則受到1點傷害。' },
            { id: 'lu_xun', name: '陸遜', hp: 3, faction: 'wu', exp: 'standard', skills: ['謙遜', '連營'], desc: '【謙遜】你不能成為【順手牽羊】和【樂不思蜀】的目標。<br>【連營】當你失去最後的手牌後，你可以摸一張牌。' },
            { id: 'sun_shang_xiang', name: '孫尚香', hp: 3, faction: 'wu', exp: 'standard', skills: ['結姻', '梟姬'], desc: '【結姻】出牌階段限一次，你可以棄置兩張手牌，令你與一名已受傷男性角色各回復1點體力。<br>【梟姬】當你失去裝備區裡的一張牌後，你可以摸兩張牌。' },
            
            { id: 'lu_bu', name: '呂布', hp: 4, faction: 'qun', exp: 'standard', skills: ['無雙'], desc: '【無雙】鎖定技，你使用【殺】指定目標後，目標需連續使用兩張【閃】才能抵消；你發起【決鬥】時，對方每次需打出兩張【殺】。' },
            { id: 'diao_chan', name: '貂蟬', hp: 3, faction: 'qun', exp: 'standard', skills: ['離間', '閉月'], desc: '【離間】出牌階段限一次，你可以棄置一張牌，令兩名男性角色視為由其中一名對另一名使用【決鬥】。<br>【閉月】結束階段，你可以摸一張牌。' },
            { id: 'hua_tuo', name: '華佗', hp: 3, faction: 'qun', exp: 'standard', skills: ['急救', '青囊'], desc: '【急救】你的回合外，你可以將一張紅色牌當【桃】使用。<br>【青囊】出牌階段限一次，你可以棄置一張手牌，令一名角色回復1點體力。' },
            { id: 'yuan_shao', name: '袁紹', hp: 4, faction: 'qun', exp: 'standard', skills: ['亂擊', '血裔'], desc: '【亂擊】你可以將兩張相同花色的手牌當【萬箭齊發】使用。<br>【血裔】主公技，你的手牌上限額外增加群勢力角色數。' },
            { id: 'hua_xiong', name: '華雄', hp: 6, faction: 'qun', exp: 'standard', skills: ['耀武'], desc: '【耀武】鎖定技，當你受到紅色【殺】造成的傷害時，傷害來源回復1點體力或摸一張牌。' },

            // --- Breakthrough (界限突破) Heroes ---
            { id: 'jie_cao_cao', name: '界曹操', hp: 4, faction: 'wei', exp: 'breakthrough', skills: ['奸雄', '護駕'], desc: '【奸雄】當你受到傷害後，你可以獲得對你造成傷害的牌，並可摸一張牌。<br>【護駕】主公技，當你需要使用或打出【閃】時，你可以令其他魏勢力角色打出【閃】。' },
            { id: 'jie_liu_bei', name: '界劉備', hp: 4, faction: 'shu', exp: 'breakthrough', skills: ['仁德', '激將'], desc: '【仁德】出牌階段，你可以將任意張手牌交給其他角色，若你於此階段給出第二張手牌，你回復1點體力。當你於此階段給出牌數達到兩張或更多時，你可以將一張基本牌當作另一張基本牌使用。<br>【激將】主公技，當你需要使用或打出【殺】時，你可以令其他蜀勢力角色打出【殺】。' },
            { id: 'jie_guan_yu', name: '界關羽', hp: 4, faction: 'shu', exp: 'breakthrough', skills: ['武聖', '義絕'], desc: '【武聖】你可以將一張紅色牌當【殺】使用或打出。<br>【義絕】出牌階段限一次，你可以與一名其他角色拼點。若你贏，該角色本回合非鎖定技失效且不能使用/打出手牌；若你輸，其可以回復1點體力。' },
            { id: 'jie_zhang_fei', name: '界張飛', hp: 4, faction: 'shu', exp: 'breakthrough', skills: ['咆哮', '替身'], desc: '【咆哮】你使用【殺】無次數限制。你使用的【殺】被【閃】抵消後，你可以摸一張牌。<br>【替身】限定技，準備階段，若你已受傷，你可以摸X張牌（X為你已損失的體力值），然後回復1點體力。' },
            { id: 'jie_zhao_yun', name: '界趙雲', hp: 4, faction: 'shu', exp: 'breakthrough', skills: ['龍膽', '涯角'], desc: '【龍膽】你可以將【殺】當【閃】、或【閃】當【殺】使用或打出。<br>【涯角】當你於回合外使用或打出一張手牌後，你可以展示牌堆頂的一張牌。若此牌與你使用的牌類型相同，你可以獲得此牌；若不同，你可以將此牌交給一名其他角色。' },
            { id: 'jie_lu_bu', name: '界呂布', hp: 4, faction: 'qun', exp: 'breakthrough', skills: ['無雙', '利馭'], desc: '【無雙】鎖定技，【殺】需兩張【閃】避開；【決鬥】需兩張【殺】避開。<br>【利馭】當你使用【殺】對一名其他角色造成傷害後，該角色可以選擇：摸一張牌，然後將其裝備區裡的一張牌交給你；或讓你獲得其一張手牌。' },
            { id: 'jie_huang_gai', name: '界黃蓋', hp: 4, faction: 'wu', exp: 'breakthrough', skills: ['苦肉', '詐降'], desc: '【苦肉】出牌階段限一次，你可以失去1點體力，然後摸兩張牌。<br>【詐降】鎖定技，每當你失去1點體力後，你摸三張牌。若此時是你的回合內，你本回合使用【殺】的次數上限+1，你使用紅色的【殺】無距離限制且不能被【閃】抵消。' },
            { id: 'jie_da_qiao', name: '界大喬', hp: 3, faction: 'wu', exp: 'breakthrough', skills: ['國色', '流離'], desc: '【國色】你可以將一張方塊牌當作【樂不思蜀】使用，若此牌是裝備牌，你摸一張牌。出牌階段限一次，你可以棄置一張【樂不思蜀】並摸一張牌。<br>【流離】當你成為【殺】的目標時，你可以棄置一張牌，將此【殺】轉移給攻擊範圍內的一名其他角色（此【殺】的來源除外）。' },

            // --- expansion (神話再臨 & SP) Heroes ---
            { id: 'zhang_jiao', name: '張角', hp: 3, faction: 'qun', exp: 'god', skills: ['雷擊', '鬼道', '黃天'], desc: '【雷擊】當你使用或打出一張【閃】時，你可以進行判定。若結果為黑桃，你令一名角色受到2點雷電傷害。<br>【鬼道】當一名角色的判定牌生效前，你可以用一張黑色牌代替之。<br>【黃天】主公技，群勢力角色於出牌階段可以交給你一張【閃】或【閃電】。' },
            { id: 'xun_yu', name: '荀彧', hp: 3, faction: 'wei', exp: 'god', skills: ['驅虎', '節命'], desc: '【驅虎】出牌階段限一次，你可以與一名體力比你多的角色拼點。若你贏，其對你指定的另一名角色造成1點傷害；若你輸，其對你造成1點傷害。<br>【節命】當你受到1點傷害後，你可以令一名角色摸牌至其手牌上限（最多摸5張）。' },
            { id: 'lu_su', name: '魯肅', hp: 3, faction: 'wu', exp: 'god', skills: ['好施', '締盟'], desc: '【好施】摸牌階段，你可以額外摸兩張牌。若你的手牌數大於5，你必須將一半的手牌交給手牌最少的一名其他角色。<br>【締盟】出牌階段限一次，你可以棄置等同於兩名其他角色手牌差的牌，然後交換他們的手牌。' },
            { id: 'zuo_ci', name: '左慈', hp: 3, faction: 'qun', exp: 'god', skills: ['化身', '新生'], desc: '【化身】準備階段/結束階段，你可以選擇獲得一個已在武將牌池中的隨機技能。<br>【新生】當你受到1點傷害後，你可以摸一張牌。' },
            { id: 'deng_ai', name: '鄧艾', hp: 4, faction: 'wei', exp: 'god', skills: ['屯田', '鑿險'], desc: '【屯田】每次你在回合外失去牌時，你可以進行判定，若結果不為紅桃，你獲得一個「田」並置於武將牌上；你每有一個「田」，你與其他角色的距離-1。<br>【鑿險】覺醒技，準備階段開始時，若你的「田」達到3張或更多，你減1點體力上限，獲得技能「急襲」（可以將「田」當【順手牽羊】使用）。' },
            { id: 'jiang_wei', name: '姜維', hp: 4, faction: 'shu', exp: 'god', skills: ['挑釁', '志繼'], desc: '【挑釁】出牌階段限一次，你可以令一名你在其攻擊範圍內的其他角色對你使用一張【殺】，若其不如此做，你棄置其一張牌。<br>【志繼】覺醒技，準備階段開始時，若你沒有手牌，你減1點體力上限，回復1點體力（若已滿則摸兩張牌），然後獲得技能「觀星」。' },
            { id: 'jia_xu', name: '賈詡', hp: 3, faction: 'qun', exp: 'god', skills: ['帷幕', '完殺', '亂武'], desc: '【帷幕】鎖定技，你不能成為黑色錦囊牌的目標。<br>【完殺】鎖定技，你的回合內，不處於瀕死狀態的角色不能使用【桃】拯救瀕死角色。<br>【亂武】限定技，出牌階段，你可以令所有其他角色各對其距離最近的另一名角色使用一張【殺】，否則失去1點體力。' },
            { id: 'shen_guan_yu', name: '神關羽', hp: 5, faction: 'qun', exp: 'god', skills: ['武神', '武魂'], desc: '【武神】鎖定技，你的紅桃手牌視為普通【殺】；你使用紅桃【殺】無距離限制。<br>【武魂】鎖定技，當你死亡時，令殺死你的角色進行判定，若結果不為【桃】或【桃園結義】，該角色立即死亡。' },
            { id: 'shen_lu_bu', name: '神呂布', hp: 5, faction: 'qun', exp: 'god', skills: ['狂暴', '神憤'], desc: '【狂暴】鎖定技，遊戲開始你獲得2個「暴怒」標記；當你造成或受到傷害時，獲得1個標記。<br>【神憤】出牌階段限一次，你可以棄置6個標記，對所有其他角色各造成1點傷害，然後他們需棄置裝備區所有牌 and 4張手牌，最後你翻面。' },
            { id: 'shen_cao_cao', name: '神曹操', hp: 3, faction: 'wei', exp: 'god', skills: ['歸心'], desc: '【歸心】當你受到1點傷害後，你可以獲得所有其他角色區域裡的一張牌，然後你翻面。' },
            { id: 'shen_zhao_yun', name: '神趙雲', hp: 2, faction: 'qun', exp: 'god', skills: ['絕境', '龍魂'], desc: '【絕境】鎖定技，你的手牌上限始終為2；每當你受到或回復1點體力後，或你進入或脫離瀕死狀態時，若你的手牌數小於2，你摸牌至2張。<br>【龍魂】你可以將同花色的牌按以下規則使用或打出：紅桃當【桃】；方塊當火【殺】；梅花當【閃】；黑桃當【無懈可擊】。' },

            // --- SP Heroes ---
            { id: 'sp_zhao_yun', name: 'SP趙雲', hp: 4, faction: 'qun', skills: ['龍膽', '衝陣'], desc: '【龍膽】你可以【殺】當【閃】、【閃】當【殺】使用或打出。<br>【衝陣】當你發動【龍膽】使用或打出一張牌時，你可以獲得對方一張手牌。' },
            { id: 'sp_guan_yu', name: 'SP關羽', hp: 4, faction: 'wei', skills: ['單騎'], desc: '【單騎】覺醒技，準備階段，若你的手牌數大於體力值且你沒有馬，你減少1點體力上限，然後獲得【馬術】和【怒斬】。' }

        function generateDeck() {
            let deck = [];
            let id = 0;
            
            const addCard = (name, suit, point, isMilitary = false) => {
                const meta = CARD_META[name];
                if (!meta) {
                    console.error('Missing card meta for: ' + name);
                    return;
                }
                const isRed = (suit === SUIT.HEART || suit === SUIT.DIAMOND);
                
                const suitEng = SUIT_ENG[suit] || '';
                const cardEng = CARD_ENG[name] || '';
                let imgPath = `../assets/SanGuoSha/cards/${name}.png`;
                if (isMilitary) {
                    imgPath = `../assets/SanGuoSha/cards/${suitEng}_${point}_${cardEng}.png`;
                }
                
                deck.push({
                    id: id++,
                    name: name,
                    type: meta.type,
                    suit: suit,
                    point: point,
                    color: isRed ? COLOR.RED : COLOR.BLACK,
                    bg: meta.bg || 'bg-trick',
                    desc: meta.desc || '',
                    equipType: meta.equipType,
                    range: meta.range,
                    damageType: meta.damageType || 'normal',
                    img: imgPath
                });
            };

            // 1. Standard Deck (104 cards, 2 copies of each suit/point mapping)
            for (const suitKey in STANDARD_CARDS) {
                const suitChar = SUIT[suitKey];
                const suitMap = STANDARD_CARDS[suitKey];
                for (const point in suitMap) {
                    const cardNames = suitMap[point];
                    cardNames.forEach(name => {
                        addCard(name, suitChar, point);
                    });
                }
            }

            // 2. EX Cards (4 cards)
            let elExpEx = document.getElementById('expEX');
            if (!elExpEx || elExpEx.checked) {
                addCard('寒冰劍', SUIT.SPADE, '2');
                addCard('仁王盾', SUIT.CLUB, '2');
                addCard('閃電', SUIT.HEART, 'Q');
                addCard('銀月槍', SUIT.DIAMOND, 'Q'); // Using 銀月槍 if SP/EX enabled
            } else {
                addCard('寒冰劍', SUIT.SPADE, '2');
                addCard('仁王盾', SUIT.CLUB, '2');
                addCard('閃電', SUIT.HEART, 'Q');
                addCard('無懈可擊', SUIT.DIAMOND, 'Q');
            }

            // 3. Military Dispute Deck
            let elMilitary = document.getElementById('expMilitary');
            let useMilitary = elMilitary ? elMilitary.checked : true;
            if (useMilitary) {
                for (const suitKey in MILITARY_CARDS) {
                    const suitChar = SUIT[suitKey];
                    const suitMap = MILITARY_CARDS[suitKey];
                    for (const point in suitMap) {
                        const name = suitMap[point];
                        addCard(name, suitChar, point, true);
                    }
                }
            }

            // 4. Mode Exclusive Decks
            let mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'identity';
            
            if (mode === '1v1') {
                for (const suitKey in V1_CARDS) {
                    const suitChar = SUIT[suitKey];
                    const suitMap = V1_CARDS[suitKey];
                    for (const point in suitMap) {
                        addCard(suitMap[point], suitChar, point);
                    }
                }
            } else if (mode === 'national') {
                for (const suitKey in NATIONAL_CARDS) {
                    const suitChar = SUIT[suitKey];
                    const suitMap = NATIONAL_CARDS[suitKey];
                    for (const point in suitMap) {
                        addCard(suitMap[point], suitChar, point);
                    }
                }
            }

            // Verify deck length
            console.log('Generated deck of ' + deck.length + ' cards.');
            
            // Self-verification check
            const suitCounts = { [SUIT.SPADE]: 0, [SUIT.HEART]: 0, [SUIT.CLUB]: 0, [SUIT.DIAMOND]: 0 };
            deck.forEach(c => { suitCounts[c.suit]++; });
            console.log('Deck suit distribution:', suitCounts);
            
            let verificationPassed = true;
            let expectedTotal = 108; // Base standard + EX
            if (useMilitary) expectedTotal += 52;
            if (mode === '1v1') expectedTotal += 4;
            if (mode === 'national') expectedTotal += 9; // Assuming National cards map has 9 cards

            if (deck.length !== expectedTotal) {
                console.error(`CRITICAL: Deck size is not ${expectedTotal}! Current size is: ${deck.length}`);
                verificationPassed = false;
            }
            
            // Verify that each of the 4 suits contains exactly all 13 points (A to K)
            for (let suitChar of [SUIT.SPADE, SUIT.HEART, SUIT.CLUB, SUIT.DIAMOND]) {
                let pointsInSuit = new Set(deck.filter(c => c.suit === suitChar).map(c => c.point));
                if (pointsInSuit.size !== 13) {
                    console.error('CRITICAL: Suit ' + suitChar + ' does not contain all 13 points A-K!');
                    verificationPassed = false;
                }
            }

            setTimeout(() => {
                let badge = document.getElementById('selfTestBadge');
                if (badge) {
                    if (verificationPassed) {
                        badge.style.background = '#065f46';
                        badge.style.borderColor = '#10b981';
                        badge.style.color = '#34d399';
                        badge.innerHTML = `<span>牌堆驗證: ${deck.length}張 (各花色A-K齊全) [✓ 通過]</span>`;
                    } else {
                        badge.style.background = '#991b1b';
                        badge.style.borderColor = '#ef4444';
                        badge.style.color = '#fca5a5';
                        badge.innerHTML = `<span>牌堆驗證: 錯誤 (${deck.length}張) [✗ 失敗]</span>`;
                    }
                }
            }, 100);

            return deck.sort(() => Math.random() - 0.5);
        }

        // --- 2. GAME ENGINE ---
        class GameEngine {
            constructor() {
                this.players = [];
                this.deck = generateDeck();
                this.discardPile = [];
                this.currentPlayerIdx = 0;
                this.state = 'INIT'; // INIT, PLAYING, TARGETING, RESPONDING, DISCARDING, WAITING, GAME_OVER
                this.pendingAction = null;
                this.selectedCardIds = [];
                this.selectedTargets = [];
                this.hooks = {
                    onPhaseStart: [],
                    beforeJudge: [],
                    afterJudge: [],
                    onDraw: [],
                    onDamage: [],
                    onLoseEquip: []
                };
            }

            updateLobbyMode() {
                let mode = document.getElementById('gameModeSelect').value;
                let wrap = document.getElementById('playerCountWrapper');
                if (wrap) {
                    wrap.style.display = (mode === '1v1') ? 'none' : 'block';
                }
                this.validateDeckTest();
                window.renderLobbyHeroes();
            }

            validateDeckTest() {
                generateDeck(); // regenerates and updates badge
            }

            initGame(humanHero, numPlayers = null) {
                if(!humanHero) return;
                let mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'identity';
                
                if (mode === '1v1') {
                    numPlayers = 2;
                } else if(!numPlayers) {
                    let sel = document.getElementById('playerCountSelect');
                    numPlayers = sel ? parseInt(sel.value) : 5;
                }
                this.players = [];
                this.deck = generateDeck();
                this.discardPile = [];
                this.selectedCardIds = [];
                this.selectedTargets = [];
                this.pendingAction = null;

                let roles = [];
                if (mode === '1v1') {
                    roles = [ROLE.LORD, ROLE.REBEL];
                } else {
                    let roleCounts = {
                        4: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 1, [ROLE.REBEL]: 1, [ROLE.SPY]: 1 },
                        5: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 1, [ROLE.REBEL]: 2, [ROLE.SPY]: 1 },
                        6: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 1, [ROLE.REBEL]: 3, [ROLE.SPY]: 1 },
                        7: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 2, [ROLE.REBEL]: 3, [ROLE.SPY]: 1 },
                        8: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 2, [ROLE.REBEL]: 4, [ROLE.SPY]: 1 },
                        9: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 3, [ROLE.REBEL]: 4, [ROLE.SPY]: 1 },
                        10: { [ROLE.LORD]: 1, [ROLE.LOYAL]: 3, [ROLE.REBEL]: 4, [ROLE.SPY]: 2 }
                    }[numPlayers] || { [ROLE.LORD]: 1, [ROLE.LOYAL]: 1, [ROLE.REBEL]: 2, [ROLE.SPY]: 1 };

                    Object.keys(roleCounts).forEach(r => {
                        for(let i=0; i<roleCounts[r]; i++) roles.push(r);
                    });
                    roles.sort(() => Math.random() - 0.5);
                }

                let availableHeroes = HEROES.filter(h => h.id !== humanHero.id).sort(() => Math.random() - 0.5);
                
                for(let i=0; i<numPlayers; i++) {
                    let hero = (i === 0) ? humanHero : availableHeroes.pop();
                    let pRole = roles[i];
                    let maxHp = hero.hp + (pRole === ROLE.LORD ? 1 : 0);
                    
                    let playerObj = {
                        id: i, hero: hero, role: pRole, hp_: maxHp, maxHp: maxHp,
                        hand: [], equips: { weapon: null, armor: null, defMount: null, offMount: null, treasure: null },
                        judges: [], isDead: false, flags: { usedSha: 0, skipPlay: false, usedZhiHeng: false, usedQingNang: false }
                    };
                    
                    let self = this;
                    Object.defineProperty(playerObj, 'hp', {
                        get() { return this.hp_; },
                        set(val) {
                            let oldHp = this.hp_;
                            this.hp_ = val;
                            if (val > oldHp) {
                                self.onPlayerHealed(this, val - oldHp);
                            } else if (val < oldHp) {
                                self.onPlayerDamaged(this, oldHp - val);
                            }
                        }
                    });
                    
                    this.players.push(playerObj);
                    this.wrapHand(playerObj);
                }
                
                for(let i=0; i<numPlayers; i++) {
                    for(let c=0; c<4; c++) this.players[i].hand.push(this.drawCard());
                }

                document.getElementById('lobbyModal').style.display = 'none';
                UI.initPlayers(numPlayers);
                UI.updateAll();
                
                this.log("遊戲開始！");
                this.startTurn(0);
            }

            wrapHand(player) {
                let self = this;
                let originalSplice = player.hand.splice;
                player.hand.splice = function(start, deleteCount, ...items) {
                    let removed = originalSplice.call(this, start, deleteCount, ...items);
                    if (removed && removed.length > 0) {
                        removed.forEach(card => {
                            self.onCardLost(player, card, 'hand');
                        });
                    }
                    return removed;
                };
                
                let originalPop = player.hand.pop;
                player.hand.pop = function() {
                    let card = originalPop.call(this);
                    if (card) {
                        self.onCardLost(player, card, 'hand');
                    }
                    return card;
                };
            }

            onCardLost(player, card, zone) {
                if (this.currentPlayerIdx !== player.id && !player.isDead) {
                    if (player.hero.skills.includes('屯田')) {
                        setTimeout(async () => {
                            if (player.isDead) return;
                            this.log(`【${player.hero.name}】發動【屯田】！`);
                            let judgeCard = await this.performJudge(player, '屯田');
                            if (judgeCard.suit !== SUIT.HEART) {
                                player.flags.tuntian = (player.flags.tuntian || 0) + 1;
                                this.log(`【${player.hero.name}】獲得一個「田」（當前共有 ${player.flags.tuntian} 個「田」）`);
                                UI.updateAll();
                            } else {
                                this.log(`【屯田】判定為紅桃，失敗！`);
                            }
                        }, 50);
                    }
                }
            }

            async performGuanXing(player) {
                let x = Math.min(5, this.getLivingPlayers().length);
                let cards = [];
                for(let i=0; i<x; i++) {
                    if (this.deck.length === 0 && this.discardPile.length === 0) break;
                    cards.push(this.drawCard());
                }
                
                this.log(`【${player.hero.name}】發動【觀星】觀看牌堆頂 ${cards.length} 張牌`);
                
                if (player.id === 0) {
                    return new Promise(resolve => {
                        let gxCandidates = [...cards];
                        let gxTop = [];
                        let gxBottom = [];
                        
                        let modal = document.getElementById('guanXingModal');
                        let candContainer = document.getElementById('gxCandidates');
                        let topContainer = document.getElementById('gxTop');
                        let bottomContainer = document.getElementById('gxBottom');
                        let confirmBtn = document.getElementById('btnGxConfirm');
                        
                        const renderCards = () => {
                            candContainer.innerHTML = '';
                            topContainer.innerHTML = '';
                            bottomContainer.innerHTML = '';
                            
                            const createCardEl = (c, section) => {
                                let el = document.createElement('div');
                                el.className = 'card face-up';
                                el.style.width = '75px';
                                el.style.height = '105px';
                                el.style.borderWidth = '1px';
                                el.style.boxShadow = '0 2px 5px rgba(0,0,0,0.3)';
                                el.innerHTML = `
                                    <div class="card-illustration" style="background-image: url('${c.img || ''}')"></div>
                                    <div class="card-title" style="font-size: 0.75rem; color:${c.color === 'red' ? '#dc2626' : '#1c1917'};">${c.name}</div>
                                    <div class="card-suit" style="font-size: 0.75rem; left:2px; top:2px;">${c.suit}</div>
                                    <div class="card-point" style="font-size: 0.75rem; right:2px; top:2px;">${c.point}</div>
                                `;
                                el.onclick = () => {
                                    if (section === 'candidates') {
                                        gxCandidates = gxCandidates.filter(item => item.id !== c.id);
                                        gxTop.push(c);
                                    } else if (section === 'top') {
                                        gxTop = gxTop.filter(item => item.id !== c.id);
                                        gxBottom.push(c);
                                    } else if (section === 'bottom') {
                                        gxBottom = gxBottom.filter(item => item.id !== c.id);
                                        gxCandidates.push(c);
                                    }
                                    renderCards();
                                };
                                return el;
                            };
                            
                            gxCandidates.forEach(c => candContainer.appendChild(createCardEl(c, 'candidates')));
                            gxTop.forEach(c => topContainer.appendChild(createCardEl(c, 'top')));
                            gxBottom.forEach(c => bottomContainer.appendChild(createCardEl(c, 'bottom')));
                            
                            confirmBtn.disabled = (gxCandidates.length > 0);
                        };
                        
                        confirmBtn.onclick = () => {
                            modal.style.display = 'none';
                            for(let i = gxBottom.length - 1; i >= 0; i--) {
                                this.deck.unshift(gxBottom[i]);
                            }
                            for(let i = gxTop.length - 1; i >= 0; i--) {
                                this.deck.push(gxTop[i]);
                            }
                            resolve();
                        };
                        
                        renderCards();
                        modal.style.display = 'flex';
                    });
                } else {
                    let top = [];
                    let bottom = [];
                    cards.forEach(c => {
                        if (c.name === '閃電') {
                            bottom.push(c);
                        } else {
                            top.push(c);
                        }
                    });
                    
                    for(let i = bottom.length - 1; i >= 0; i--) {
                        this.deck.unshift(bottom[i]);
                    }
                    for(let i = top.length - 1; i >= 0; i--) {
                        this.deck.push(top[i]);
                    }
                    await this.sleep(1000);
                }
            }

            async performLuanWu(source) {
                this.log(`【${source.hero.name}】發動限定技【亂武】！`);
                UI.updateAll(); await this.sleep(1200);
                
                let living = this.getLivingPlayers().filter(o => o.id !== source.id);
                for (let player of living) {
                    if (player.isDead) continue;
                    let minDist = 99;
                    let targets = [];
                    for (let other of this.getLivingPlayers().filter(o => o.id !== player.id)) {
                        let d = this.getDistance(player.id, other.id);
                        if (d < minDist) {
                            minDist = d;
                            targets = [other];
                        } else if (d === minDist) {
                            targets.push(other);
                        }
                    }
                    
                    if (targets.length === 0) continue;
                    
                    let shaIdx = player.hand.findIndex(c => c.name === '殺' || (player.hero.skills.includes('龍膽') && c.name === '閃') || (player.hero.skills.includes('武聖') && c.color === COLOR.RED) || (player.hero.skills.includes('武神') && c.suit === SUIT.HEART));
                    let hasSha = (shaIdx !== -1);
                    
                    let usedSha = false;
                    if (hasSha) {
                        let target = targets[0];
                        if (player.id === 0) {
                            let prompt = `【亂武】請選擇一名最近的角色使用 殺（候選角色：${targets.map(o=>o.hero.name).join(', ')}）`;
                            let chosenIdx = await this.askForLuanWuTarget(player, targets, prompt);
                            target = this.players[chosenIdx];
                            
                            let ok = await this.askForCard(player, ['殺'], 1, `【亂武】請打出一張 殺 對【${target.hero.name}】使用，否則失去1點體力`, true);
                            if (ok) {
                                usedSha = true;
                                this.log(`【${player.hero.name}】對【${target.hero.name}】使用了一張【殺】！`);
                            }
                        } else {
                            let preferred = targets.find(o => !this.isSameSide(player, o)) || targets[0];
                            let card = player.hand.splice(shaIdx, 1)[0];
                            this.discardPile.push(card);
                            this.log(`【${player.hero.name}】對【${preferred.hero.name}】使用了一張【殺】！`);
                            UI.updateAll(); await this.sleep(800);
                            await this.resolveAttack(player, preferred, card);
                            usedSha = true;
                        }
                    }
                    
                    if (!usedSha) {
                        this.log(`【${player.hero.name}】沒有打出【殺】，失去 1 點體力`);
                        await this.loseHp(player, 1);
                    }
                    if (this.state === 'GAME_OVER') return;
                }
            }

            askForLiuliTarget(player, candidates, prompt) {
                return new Promise(resolve => {
                    this.state = 'TARGETING';
                    this.pendingAction = {
                        type: 'LI_LI',
                        attackerIdx: this.currentPlayerIdx,
                        resolve: resolveTarget => {
                            resolve(resolveTarget);
                        }
                    };
                    this.selectedTargets = [];
                    this.log(prompt);
                    UI.updateAll();
                });
            }

            askForLuanWuTarget(player, targets, prompt) {
                return new Promise(resolve => {
                    this.state = 'TARGETING';
                    this.pendingAction = {
                        type: 'LUAN_WU_TARGET',
                        targets: targets.map(o => o.id),
                        resolve: resolveTarget => {
                            resolve(resolveTarget);
                        }
                    };
                    this.selectedTargets = [];
                    this.log(prompt);
                    UI.updateAll();
                });
            }

            onPlayerHealed(player, amount) {
                if (player.hero.skills.includes('絕境') && player.hand.length < 2 && !player.isDead) {
                    setTimeout(async () => {
                        if (player.hand.length < 2 && !player.isDead) {
                            await this.drawCards(player, 2 - player.hand.length, '發動【絕境】');
                        }
                    }, 50);
                }
            }

            onPlayerDamaged(player, amount) {
                if (player.hero.skills.includes('詐降')) {
                    setTimeout(async () => {
                        this.log(`【${player.hero.name}】發動【詐降】！`);
                        await this.drawCards(player, 3 * amount, '發動【詐降】');
                        if (this.currentPlayerIdx === player.id) {
                            player.flags.extraShaCount = (player.flags.extraShaCount || 0) + amount;
                            player.flags.zhaxiangActive = true;
                            this.log(`【詐降】生效：本回合出殺次數上限+${amount}，且紅【殺】無距離限制且不可避開！`);
                            UI.updateAll();
                        }
                    }, 50);
                }
                
                if (player.hero.skills.includes('絕境') && player.hand.length < 2 && !player.isDead) {
                    setTimeout(async () => {
                        if (player.hand.length < 2 && !player.isDead) {
                            await this.drawCards(player, 2 - player.hand.length, '發動【絕境】');
                        }
                    }, 50);
                }
            }

            async loseHp(player, amount = 1) {
                player.hp -= amount;
                if (player.hp <= 0) {
                    await this.checkDying(player, null);
                }
            }

            drawCard() {
                if(this.deck.length === 0) {
                    this.deck = this.discardPile.sort(() => Math.random() - 0.5);
                    this.discardPile = [];
                    this.log("洗牌！");
                }
                return this.deck.pop();
            }

            log(msg) {
                document.getElementById('gameLog').innerText = msg;
            }

            async triggerHook(name, context) {
                for(const fn of this.hooks[name] || []) {
                    await fn(context, this);
                }
                return context;
            }

            isSameSide(a, b) {
                if(a.role === ROLE.SPY || b.role === ROLE.SPY) return false;
                if(a.role === b.role) return true;
                return (a.role === ROLE.LORD && b.role === ROLE.LOYAL) || (a.role === ROLE.LOYAL && b.role === ROLE.LORD);
            }

            isEnemy(a, b) {
                if(a.role === ROLE.REBEL) return b.role === ROLE.LORD || b.role === ROLE.LOYAL;
                if(a.role === ROLE.LOYAL || a.role === ROLE.LORD) return b.role === ROLE.REBEL || b.role === ROLE.SPY;
                if(a.role === ROLE.SPY) return true;
                return true;
            }

            getLivingPlayers() {
                return this.players.filter(p => !p.isDead);
            }

            getCardFromDiscard(card) {
                if(!card) return null;
                let idx = this.discardPile.findIndex(c => c.id === card.id);
                return idx >= 0 ? this.discardPile.splice(idx, 1)[0] : card;
            }

            async startTurn(playerIdx) {
                this.currentPlayerIdx = playerIdx;
                let p = this.players[playerIdx];
                if(p.isDead) { this.nextTurn(); return; }
                
                if (p.flags.turnedOver) {
                    p.flags.turnedOver = false;
                    this.log(`【${p.hero.name}】翻回正面，跳過此回合`);
                    UI.updateAll(); await this.sleep(800);
                    this.nextTurn();
                    return;
                }

                // --- Awakening Skills & Start-of-turn Skills ---
                // 1. 鄧艾: 鑿險
                if (p.hero.skills.includes('屯田') && !p.flags.zaoxianAwakened && (p.flags.tuntian || 0) >= 3) {
                    p.flags.zaoxianAwakened = true;
                    p.maxHp--;
                    if (p.hp > p.maxHp) p.hp = p.maxHp;
                    p.hero.skills.push('急襲');
                    p.hero.skills = p.hero.skills.filter(s => s !== '鑿險');
                    this.log(`【鄧艾】發動【鑿險】覺醒！減1點體力上限，獲得技能【急襲】！`);
                    UI.updateAll(); await this.sleep(1000);
                }

                // 2. 姜維: 志繼
                if (p.hero.skills.includes('挑釁') && !p.flags.zhijiAwakened && p.hand.length === 0) {
                    p.flags.zhijiAwakened = true;
                    p.maxHp--;
                    if (p.hp > p.maxHp) p.hp = p.maxHp;
                    if (p.hp < p.maxHp) {
                        p.hp++;
                        this.log(`【姜維】發動【志繼】覺醒！減1點體力上限，回復1點體力，獲得技能【觀星】！`);
                    } else {
                        this.log(`【姜維】發動【志繼】覺醒！減1點體力上限，摸兩張牌，獲得技能【觀星】！`);
                        await this.drawCards(p, 2, '發動【志繼】');
                    }
                    p.hero.skills.push('觀星');
                    p.hero.skills = p.hero.skills.filter(s => s !== '志繼');
                    UI.updateAll(); await this.sleep(1000);
                }

                // 3. 甄姬: 洛神
                if (p.hero.skills.includes('洛神') && !p.isDead) {
                    let use = await this.askForSkill(p, '洛神', '是否發動【洛神】？');
                    while (use) {
                        let judge = await this.performJudge(p, '洛神');
                        if (judge.color === COLOR.BLACK) {
                            p.hand.push(judge);
                            this.log(`【${p.hero.name}】發動【洛神】獲得判定牌：${judge.name}`);
                            UI.updateAll(); await this.sleep(800);
                            use = await this.askForSkill(p, '洛神', '是否繼續發動【洛神】？');
                        } else {
                            this.log(`【洛神】判定為紅色，終止。`);
                            use = false;
                        }
                    }
                }

                // 4. 諸葛亮/姜維: 觀星
                if (p.hero.skills.includes('觀星') && !p.isDead) {
                    let use = await this.askForSkill(p, '觀星', '是否發動【觀星】？');
                    if (use) {
                        await this.performGuanXing(p);
                    }
                }

                if (p.hero.id === 'sp_guan_yu' && !p.flags.awakened) {
                    if (p.hand.length > p.hp && !p.equips.defMount && !p.equips.offMount) {
                        p.flags.awakened = true;
                        p.maxHp--;
                        if (p.hp > p.maxHp) p.hp = p.maxHp;
                        p.hero.skills.push('馬術');
                        p.hero.skills.push('武聖');
                        this.log(`【SP關羽】發動【單騎】覺醒！失去1點體力上限，獲得【馬術】和【武聖】！`);
                        UI.updateAll(); await this.sleep(1000);
                    }
                }

                p.flags.usedSha = 0;
                p.flags.skipPlay = false;
                p.flags.skipDraw = false;
                p.flags.drunk = false;
                p.flags.usedZhiHeng = false;
                p.flags.usedQingNang = false;
                p.flags.usedJieYin = false;
                p.flags.usedLiJian = false;
                p.flags.usedFanJian = false;
                p.flags.luoYi = false;
                
                this.log(`【${p.hero.name}】的回合開始`);
                UI.updateAll();
                await this.sleep(800);
                
                await this.triggerHook('onPhaseStart', { player: p, phase: 'start' });
                await this.judgePhase(p);
                if(p.isDead || this.state === 'GAME_OVER') return;
                
                let skipPlay = p.flags.skipPlay;
                let skipDraw = p.flags.skipDraw;
                
                if (!skipDraw) {
                    await this.drawPhase(p);
                } else {
                    this.log(`【${p.hero.name}】跳過摸牌階段！`);
                    await this.sleep(800);
                }
                
                if(!skipPlay) {
                    await this.playPhase(p);
                } else {
                    this.log(`【${p.hero.name}】跳過出牌階段`);
                    await this.sleep(800);
                    await this.discardPhase(p);
                }
            }
            
            async judgePhase(p) {
                await this.triggerHook('onPhaseStart', { player: p, phase: 'judge' });
                while(p.judges && p.judges.length > 0) {
                    let jCard = p.judges.pop();
                    this.log(`【${p.hero.name}】進行 ${jCard.name} 的判定...`);
                    await this.sleep(800);
                    
                    let wuxie = await this.askWuxie(jCard, p);
                    if(wuxie) {
                        this.log(`${jCard.name} 被無懈可擊抵消了！`);
                        this.discardPile.push(jCard);
                        continue;
                    }
                    
                    let judge = await this.performJudge(p, jCard.name);
                    this.log(`判定結果為 ${judge.suit} ${judge.point}`);
                    await this.sleep(800);
                    
                    if(jCard.name === '樂不思蜀') {
                        if(judge.suit !== SUIT.HEART) {
                            p.flags.skipPlay = true;
                            this.log(`【${p.hero.name}】樂不思蜀生效，跳過出牌階段！`);
                        } else {
                            this.log(`【${p.hero.name}】樂不思蜀失效！`);
                        }
                        this.discardPile.push(jCard);
                    } else if(jCard.name === '兵糧寸斷') {
                        if(judge.suit !== SUIT.CLUB) {
                            p.flags.skipDraw = true;
                            this.log(`【${p.hero.name}】兵糧寸斷生效，跳過摸牌階段！`);
                        } else {
                            this.log(`【${p.hero.name}】兵糧寸斷失效！`);
                        }
                        this.discardPile.push(jCard);
                    } else if(jCard.name === '閃電') {
                        if(judge.suit === SUIT.SPADE && ['2','3','4','5','6','7','8','9'].includes(judge.point)) {
                            this.log(`閃電劈中了【${p.hero.name}】！`);
                            this.discardPile.push(jCard);
                            await this.dealDamage(null, p, 3, jCard);
                            if(p.isDead) return;
                        } else {
                            this.log(`閃電未劈中，傳遞給下家。`);
                            let nextIdx = (this.currentPlayerIdx + 1) % this.players.length;
                            while(this.players[nextIdx].isDead) nextIdx = (nextIdx + 1) % this.players.length;
                            this.players[nextIdx].judges.push(jCard);
                        }
                    }
                }
            }
            
            async performJudge(player, reason) {
                let judge = this.drawCard();
                this.log(`判定牌為：${judge.name} (${judge.suit} ${judge.point})`);
                UI.updateAll(); await this.sleep(800);
                
                let changed = true;
                while (changed) {
                    changed = false;
                    for (let i = 0; i < this.players.length; i++) {
                        let idx = (this.currentPlayerIdx + i) % this.players.length;
                        let p = this.players[idx];
                        if (p.isDead) continue;
                        
                        if (p.hero.skills.includes('鬼才') && p.hand.length > 0) {
                            let cards = await this.askForCard(p, [], 1, `【${p.hero.name}】是否發動【鬼才】使用手牌代替判定牌？`, true);
                            if (cards && cards.length === 1) {
                                let newJudge = cards[0];
                                this.discardPile.push(judge);
                                judge = newJudge;
                                this.log(`【${p.hero.name}】發動【鬼才】代替判定，新判定牌為：${judge.name} (${judge.suit} ${judge.point})`);
                                UI.updateAll(); await this.sleep(800);
                                changed = true;
                                break;
                            }
                        }
                        if (p.hero.skills.includes('鬼道') && p.hand.some(c => c.color === COLOR.BLACK)) {
                            let cards = await this.askForCard(p, [], 1, `【${p.hero.name}】是否發動【鬼道】以黑色牌代替判定牌？`, true, null, COLOR.BLACK);
                            if (cards && cards.length === 1) {
                                let newJudge = cards[0];
                                let discardIdx = this.discardPile.findIndex(c => c.id === newJudge.id);
                                if(discardIdx !== -1) this.discardPile.splice(discardIdx, 1);
                                
                                p.hand.push(judge);
                                judge = newJudge;
                                this.log(`【${p.hero.name}】發動【鬼道】代替判定並獲得原判定牌，新判定牌為：${judge.name} (${judge.suit} ${judge.point})`);
                                UI.updateAll(); await this.sleep(800);
                                changed = true;
                                break;
                            }
                        }
                    }
                }
                
                let context = { player, reason, card: judge, replaced: false };
                await this.triggerHook('afterJudge', context);
                
                if (player.hero.skills.includes('天妒') && !player.isDead) {
                    player.hand.push(judge);
                    this.log(`【${player.hero.name}】發動【天妒】，獲得判定牌：${judge.name}`);
                    UI.updateAll(); await this.sleep(800);
                } else {
                    this.discardPile.push(judge);
                }
                
                return judge;
            }

            async drawCards(player, count, reason = '摸牌') {
                for(let i=0; i<count; i++) player.hand.push(this.drawCard());
                this.log(`【${player.hero.name}】${reason} ${count} 張`);
                UI.updateAll();
                await this.sleep(800);
            }

            async drawPhase(p) {
                await this.triggerHook('onPhaseStart', { player: p, phase: 'draw' });
                let context = { player: p, count: 2 };
                if(p.hero.skills.includes('英姿')) context.count++;
                if(p.hero.skills.includes('裸衣')) {
                    let use = await this.askForSkill(p, '裸衣', '是否發動【裸衣】少摸一張，本回合殺/決鬥傷害+1？');
                    if(use) { context.count--; p.flags.luoYi = true; }
                }
                await this.triggerHook('onDraw', context);
                await this.drawCards(p, Math.max(0, context.count), '摸了');
            }

            async playPhase(p) {
                await this.triggerHook('onPhaseStart', { player: p, phase: 'play' });
                if(p.id === 0) {
                    this.state = 'PLAYING';
                    this.log("請出牌或結束回合");
                    UI.updateAll();
                } else {
                    await this.doAITurn(p);
                }
            }

            async discardPhase(p) {
                await this.triggerHook('onPhaseStart', { player: p, phase: 'discard' });
                let limit = p.hp;
                if(p.hero.skills.includes('克己') && p.flags.usedSha === 0) limit = p.maxHp;
                if(p.hero.skills.includes('血裔') && p.role === ROLE.LORD) {
                    limit += this.players.filter(o => !o.isDead && o.hero.faction === 'qun').length;
                }
                let over = p.hand.length - limit;
                if(p.hero.skills.includes('克己') && p.flags.usedSha === 0) over = 0;
                if(over > 0) {
                    if(p.id === 0) {
                        return new Promise(resolve => {
                            this.state = 'DISCARDING';
                            this.pendingAction = {
                                type: 'DISCARD',
                                count: over,
                                resolve: async result => {
                                    resolve(result);
                                    await this.finishDiscardPhase(p);
                                }
                            };
                            this.log(`請棄置 ${over} 張牌`);
                            UI.updateAll();
                        });
                    } else {
                        for(let i=0; i<over; i++) this.discardPile.push(p.hand.pop());
                        this.log(`【${p.hero.name}】棄置了 ${over} 張牌`);
                        UI.updateAll();
                        await this.sleep(800);
                    }
                }
                await this.finishDiscardPhase(p);
            }

            async finishDiscardPhase(p) {
                await this.triggerHook('onPhaseStart', { player: p, phase: 'end' });
                if(p.hero.skills.includes('閉月') && !p.isDead) await this.drawCards(p, 1, '發動【閉月】摸了');
                this.nextTurn();
            }

            getDistance(fromIdx, toIdx) {
                if (fromIdx === toIdx) return 0;
                let alivePlayers = this.players.filter(p => !p.isDead).map(p => p.id);
                let idx1 = alivePlayers.indexOf(fromIdx);
                let idx2 = alivePlayers.indexOf(toIdx);
                if (idx1 === -1 || idx2 === -1) return 99;
                
                let dist = Math.abs(idx1 - idx2);
                let baseDist = Math.min(dist, alivePlayers.length - dist);
                let pFrom = this.players[fromIdx];
                let pTo = this.players[toIdx];
                let offMount = pFrom.equips.offMount ? -1 : 0;
                let defMount = pTo.equips.defMount ? 1 : 0;
                if(pFrom.hero.skills.includes('馬術')) offMount -= 1;
                
                // 吳六劍: other Wu characters calculate distance to you as -1
                if (pTo.equips.weapon && pTo.equips.weapon.name === '吳六劍' && pFrom.hero.faction === 'wu' && pFrom.id !== pTo.id) {
                    offMount -= 1;
                }
                
                // 屯田: Deng Ai calculates distance to others as -1 per "田"
                if (pFrom.hero.skills.includes('屯田') && pFrom.flags.tuntian) {
                    offMount -= pFrom.flags.tuntian;
                }
                
                return Math.max(1, baseDist + offMount + defMount);
            }

            getAttackRange(p) {
                return p.equips.weapon ? p.equips.weapon.range : 1;
            }

            async equipCard(player, card) {
                let slot = card.equipType;
                if(player.equips[slot]) await this.loseEquip(player, slot, 'discard');
                player.equips[slot] = card;
                this.log(`【${player.hero.name}】裝備了 ${card.name}`);
                UI.updateAll(); await this.sleep(600);
            }

            async loseEquip(player, slot, destination = 'discard', receiver = null) {
                let card = player.equips[slot];
                if(!card) return null;
                player.equips[slot] = null;
                if(destination === 'hand' && receiver) receiver.hand.push(card);
                else this.discardPile.push(card);
                await this.triggerHook('onLoseEquip', { player, card, slot, destination, receiver });
                if (card.name === '白銀獅子') {
                    if (player.hp < player.maxHp && !player.isDead) {
                        player.hp++;
                        this.log(`【${player.hero.name}】失去了白銀獅子，回復1點體力！`);
                        UI.updateAll(); await this.sleep(600);
                    }
                }
                if(player.hero.skills.includes('梟姬') && !player.isDead) {
                    await this.drawCards(player, 2, '發動【梟姬】摸了');
                }
                return card;
            }

            getFirstRemovableCard(target) {
                if(target.hand.length > 0) return { zone: 'hand', index: target.hand.length - 1 };
                for(let slot of ['weapon', 'armor', 'defMount', 'offMount', 'treasure']) {
                    if(target.equips[slot]) return { zone: 'equip', slot };
                }
                return null;
            }

            async removeOneCard(actor, target, mode) {
                let ref = this.getFirstRemovableCard(target);
                if(!ref) return false;
                if(ref.zone === 'hand') {
                    let card = target.hand.splice(ref.index, 1)[0];
                    if(mode === 'gain') actor.hand.push(card); else this.discardPile.push(card);
                } else {
                    await this.loseEquip(target, ref.slot, mode === 'gain' ? 'hand' : 'discard', actor);
                }
                this.log(`【${actor.hero.name}】${mode === 'gain' ? '獲得' : '棄置'}了【${target.hero.name}】的一張牌`);
                UI.updateAll(); await this.sleep(800);
                return true;
            }

            async resolveAttack(source, target, card) {
                let isHit = false;
                let females = ['zhen_ji', 'huang_yue_ying', 'da_qiao', 'sun_shang_xiang', 'diao_chan', 'jie_da_qiao'];
                let srcIsFemale = females.includes(source.hero.id);
                let tgtIsFemale = females.includes(target.hero.id);

                // --- 界大喬 流離 ---
                let hasCards = target.hand.length > 0 || Object.values(target.equips).some(x => x);
                if (target.hero.skills.includes('流離') && hasCards && !target.isDead) {
                    let candidates = this.getLivingPlayers().filter(o => 
                        o.id !== target.id && 
                        o.id !== source.id && 
                        this.getDistance(target.id, o.id) <= this.getAttackRange(target)
                    );
                    if (candidates.length > 0) {
                        let use = await this.askForSkill(target, '流離', `是否發動【流離】轉移【殺】的目標？`);
                        if (use) {
                            let discarded = false;
                            let cardToDiscard = null;
                            if (target.id === 0) {
                                let cards = await this.askForCard(target, [], 1, "請選擇一張手牌或裝備棄置發動【流離】", true);
                                if (cards && cards.length === 1) {
                                    discarded = true;
                                    cardToDiscard = cards[0];
                                }
                            } else {
                                cardToDiscard = target.hand.length > 0 ? target.hand.pop() : Object.values(target.equips).find(x => x);
                                if (cardToDiscard) {
                                    for (let slot in target.equips) {
                                        if (target.equips[slot] && target.equips[slot].id === cardToDiscard.id) {
                                            target.equips[slot] = null;
                                        }
                                    }
                                    this.discardPile.push(cardToDiscard);
                                    discarded = true;
                                }
                            }
                            
                            if (discarded) {
                                let chosenTarget = null;
                                if (target.id === 0) {
                                    chosenTarget = await this.askForLiuliTarget(target, candidates, `請選擇流離的轉移目標`);
                                } else {
                                    chosenTarget = candidates[0];
                                }
                                
                                this.log(`【${target.hero.name}】發動【流離】，將【殺】的目標轉移給【${chosenTarget.hero.name}】！`);
                                UI.updateAll(); await this.sleep(800);
                                await this.resolveAttack(source, chosenTarget, card);
                                return;
                            }
                        }
                    }
                }

                // --- 界黃蓋 詐降 命中判定 ---
                let isZhaxiangHit = (source.flags.zhaxiangActive && card.color === COLOR.RED);
                if (isZhaxiangHit) {
                    this.log(`【詐降】使此【殺】不可避開！`);
                    await this.sleep(800);
                }
                
                let attackCard = card;
