<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拉密 Rummikub</title>
  <style>
    :root { --bg:#101827; --panel:#1f2937; --line:#334155; --blue:#3b82f6; --gold:#facc15; --muted:#cbd5e1; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(135deg,#0f172a,#182c4f); color:#f8fafc; font-family:"Segoe UI","Noto Sans TC",sans-serif; }
    .top { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; background:rgba(15,23,42,.92); border-bottom:1px solid #334155; position:sticky; top:0; z-index:5; }
    a { color:#f8fafc; text-decoration:none; }
    h1 { margin:0; color:#93c5fd; font-size:22px; }
    .badge { border:1px solid #3b82f6; color:#bfdbfe; border-radius:16px; padding:5px 10px; font-size:13px; }
    .app { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px; }
    .panel { background:rgba(31,41,55,.93); border:1px solid var(--line); border-radius:8px; padding:14px; box-shadow:0 14px 30px rgba(0,0,0,.28); }
    .panel h2 { margin:0 0 10px; font-size:16px; color:#93c5fd; }
    .table { min-height:42vh; background:#0b5138; border:1px solid #2e7d5e; border-radius:8px; padding:14px; box-shadow:inset 0 0 30px rgba(0,0,0,.3); }
    .sets { display:flex; flex-direction:column; gap:10px; }
    .meld { min-height:70px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .meld-label { min-width:72px; color:#d1fae5; font-size:13px; }
    .rack-area { margin-top:14px; background:linear-gradient(#7c3f14,#451a03); border-radius:8px; padding:12px; }
    .rack { min-height:160px; display:flex; flex-wrap:wrap; gap:6px; padding:10px; background:rgba(0,0,0,.22); border-radius:6px; align-content:flex-start; }
    .tile { width:48px; height:70px; background:#fafaf9; border-radius:6px; box-shadow:2px 4px 8px rgba(0,0,0,.4), inset -2px -2px 5px rgba(0,0,0,.1); color:#111827; font-size:28px; font-weight:900; display:grid; place-items:center; cursor:pointer; position:relative; user-select:none; }
    .tile.selected { transform:translateY(-12px); outline:3px solid var(--gold); }
    .tile.black { color:#111827; } .tile.blue { color:#2563eb; } .tile.red { color:#dc2626; } .tile.orange { color:#ea580c; } .tile.joker { color:#be123c; }
    .tile::after { content:""; position:absolute; bottom:7px; width:24px; height:3px; border-radius:3px; background:currentColor; }
    .tile.joker::after { display:none; }
    button { border:1px solid #4069aa; background:#2563eb; color:white; border-radius:6px; padding:9px 12px; font-weight:800; cursor:pointer; }
    button:hover { background:#1d4ed8; } button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
    .stat { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat div { background:#111827; border:1px solid #475569; border-radius:7px; padding:10px; }
    .num { color:var(--gold); font-size:26px; font-weight:900; }
    .log { height:260px; overflow:auto; background:#111827; border-radius:6px; padding:10px; font-size:13px; line-height:1.5; color:#dbeafe; }
    .help { color:var(--muted); font-size:13px; line-height:1.55; }
    @media (max-width:900px){ .app{grid-template-columns:1fr}.tile{width:42px;height:62px;font-size:24px} }
  </style>
</head>
<body>
  <div class="top"><a href="../index.html">← 返回大廳</a><h1>拉密 Rummikub</h1><div class="badge">可完成單機版</div></div>
  <div class="app">
    <aside class="panel">
      <h2>操作</h2>
      <div id="turnText" class="help"></div>
      <div class="row">
        <button id="playBtn">打出選牌</button>
        <button id="drawBtn">抽牌</button>
        <button id="endBtn">結束回合</button>
      </div>
      <div class="row">
        <button id="sortValueBtn">數字排序</button>
        <button id="sortColorBtn">顏色排序</button>
        <button id="newBtn">新局</button>
      </div>
      <p class="help">合法出牌：同數字不同色 3-4 張，或同色連號 3 張以上。首次出牌總點數需至少 30。鬼牌可補任意數字，但每組仍需能形成合法組合。</p>
      <h2>狀態</h2>
      <div class="stat">
        <div>牌池<div class="num" id="poolCount"></div></div>
        <div>AI 架牌<div class="num" id="aiCount"></div></div>
        <div>你已破冰<div class="num" id="opened0"></div></div>
        <div>AI 已破冰<div class="num" id="opened1"></div></div>
      </div>
      <h2>紀錄</h2>
      <div id="log" class="log"></div>
    </aside>
    <main>
      <div class="table"><div id="sets" class="sets"></div></div>
      <div class="rack-area"><div id="rack" class="rack"></div></div>
    </main>
  </div>
  <script>
    const COLORS = ['black','blue','red','orange'];
    const CNAME = {black:'黑',blue:'藍',red:'紅',orange:'橙'};
    let pool, players, tableSets, turn, selected, gameOver;
    const $ = id => document.getElementById(id);
    function shuffle(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]); }
    function makePool(){
      const out=[]; let id=1;
      for(let copy=0; copy<2; copy++) for(const color of COLORS) for(let value=1; value<=13; value++) out.push({id:id++,color,value,joker:false});
      out.push({id:id++,color:'joker',value:0,joker:true},{id:id++,color:'joker',value:0,joker:true});
      return shuffle(out);
    }
    function draw(p,n=1){ for(let i=0;i<n && pool.length;i++) p.tiles.push(pool.pop()); }
    function newPlayer(name){ return {name, tiles:[], opened:false}; }
    function newGame(){
      pool=makePool(); players=[newPlayer('你'),newPlayer('AI')]; tableSets=[]; turn=0; selected=[]; gameOver=false;
      draw(players[0],14); draw(players[1],14); $('log').innerHTML=''; log('新局開始。'); render();
    }
    function tileText(t){ return t.joker ? '★' : t.value; }
    function tileEl(t, clickable=true){
      const d=document.createElement('div'); d.className=`tile ${t.joker?'joker':t.color} ${selected.includes(t.id)?'selected':''}`; d.textContent=tileText(t); d.title=t.joker?'鬼牌':`${CNAME[t.color]} ${t.value}`;
      if(clickable) d.onclick=()=>{ if(turn!==0||gameOver) return; selected = selected.includes(t.id) ? selected.filter(id=>id!==t.id) : [...selected,t.id]; renderRack(); };
      return d;
    }
    function render(){
      $('turnText').innerHTML = gameOver ? '遊戲結束' : `${turn===0?'你的':'AI 的'}回合`;
      $('poolCount').textContent=pool.length; $('aiCount').textContent=players[1].tiles.length;
      $('opened0').textContent=players[0].opened?'是':'否'; $('opened1').textContent=players[1].opened?'是':'否';
      $('playBtn').disabled=turn!==0||gameOver; $('drawBtn').disabled=turn!==0||gameOver; $('endBtn').disabled=turn!==0||gameOver;
      renderTable(); renderRack();
    }
    function renderTable(){
      $('sets').innerHTML = '';
      tableSets.forEach((set,i)=>{ const m=document.createElement('div'); m.className='meld'; m.innerHTML=`<div class="meld-label">第 ${i+1} 組</div>`; set.tiles.forEach(t=>m.appendChild(tileEl(t,false))); $('sets').appendChild(m); });
      if(tableSets.length===0) $('sets').innerHTML='<div class="help">桌面尚無組合。</div>';
    }
    function renderRack(){
      $('rack').innerHTML=''; players[0].tiles.forEach(t=>$('rack').appendChild(tileEl(t,true)));
    }
    function selectedTiles(){ return players[0].tiles.filter(t=>selected.includes(t.id)); }
    function setValue(tiles){ return tiles.reduce((a,t)=>a+(t.joker?0:t.value),0); }
    function validate(tiles){
      if(tiles.length < 3) return null;
      const jokers = tiles.filter(t=>t.joker).length, normal = tiles.filter(t=>!t.joker);
      const sameValue = normal.length && normal.every(t=>t.value===normal[0].value);
      const distinctColors = new Set(normal.map(t=>t.color)).size === normal.length;
      if(sameValue && distinctColors && tiles.length <= 4) return {type:'group', points:(normal[0]?.value || 0) * tiles.length};
      const sameColor = normal.length && normal.every(t=>t.color===normal[0].color);
      if(sameColor){
        const vals = normal.map(t=>t.value).sort((a,b)=>a-b);
        let gaps = 0, dup = false;
        for(let i=1;i<vals.length;i++){ if(vals[i]===vals[i-1]) dup=true; gaps += vals[i]-vals[i-1]-1; }
        const min = vals[0] - Math.max(0, jokers - gaps), max = vals[vals.length-1] + Math.max(0, jokers - gaps);
        if(!dup && gaps <= jokers && min >= 1 && max <= 13) return {type:'run', points:estimateRunPoints(vals,jokers)};
      }
      return null;
    }
    function estimateRunPoints(vals,jokers){
      if(!vals.length) return 0;
      let points = vals.reduce((a,b)=>a+b,0), missing = jokers;
      for(let v=vals[0]; v<=vals[vals.length-1]; v++) if(!vals.includes(v) && missing>0){ points += v; missing--; }
      let low = vals[0]-1, high = vals[vals.length-1]+1;
      while(missing>0){ if(low>=1){ points += low--; } else { points += high++; } missing--; }
      return points;
    }
    function playSelected(){
      const tiles = selectedTiles(), valid = validate(tiles), p=players[0];
      if(!valid){ log('這不是合法組合。'); return; }
      if(!p.opened && valid.points < 30){ log(`首次出牌需要 30 點，目前 ${valid.points} 點。`); return; }
      p.opened = true;
      tableSets.push({owner:0, type:valid.type, tiles});
      players[0].tiles = players[0].tiles.filter(t=>!selected.includes(t.id)); selected=[];
      log(`你打出 ${valid.type==='group'?'同數組':'順子'}。`);
      checkWin(); render();
    }
    function drawAndEnd(){
      draw(players[0],1); log('你抽 1 張牌。'); selected=[]; render(); setTimeout(aiTurn,450);
    }
    function endTurn(){ selected=[]; render(); setTimeout(aiTurn,450); }
    function sortValue(){ players[0].tiles.sort((a,b)=>(a.joker-b.joker)||a.value-b.value||COLORS.indexOf(a.color)-COLORS.indexOf(b.color)); renderRack(); }
    function sortColor(){ players[0].tiles.sort((a,b)=>(a.joker-b.joker)||COLORS.indexOf(a.color)-COLORS.indexOf(b.color)||a.value-b.value); renderRack(); }
    function findBestSet(p){
      const tiles=p.tiles;
      for(let v=1; v<=13; v++){
        const group = COLORS.map(c=>tiles.find(t=>!t.joker&&t.value===v&&t.color===c)).filter(Boolean);
        const jokers = tiles.filter(t=>t.joker);
        if(group.length + jokers.length >= 3) return group.slice(0,Math.min(4,group.length)).concat(jokers.slice(0,Math.max(0,3-group.length)));
      }
      for(const c of COLORS){
        const vals = [...new Set(tiles.filter(t=>!t.joker&&t.color===c).map(t=>t.value))].sort((a,b)=>a-b);
        for(let i=0;i<vals.length;i++){
          const run=[tiles.find(t=>!t.joker&&t.color===c&&t.value===vals[i])]; let need=0, last=vals[i];
          for(let v=vals[i]+1; v<=13 && run.length+need<5; v++){
            const t=tiles.find(x=>!x.joker&&x.color===c&&x.value===v);
            if(t){ run.push(t); last=v; } else need++;
            if(run.length+Math.min(need, tiles.filter(x=>x.joker).length)>=3 && last-vals[i]+1<=run.length+tiles.filter(x=>x.joker).length){
              return run.concat(tiles.filter(x=>x.joker).slice(0,need));
            }
          }
        }
      }
      return null;
    }
    function aiTurn(){
      if(gameOver) return;
      turn=1; render();
      const p=players[1], set=findBestSet(p), valid=set&&validate(set);
      if(valid && (p.opened || valid.points>=30)){
        p.opened=true; tableSets.push({owner:1,type:valid.type,tiles:set}); p.tiles=p.tiles.filter(t=>!set.some(s=>s.id===t.id));
        log(`AI 打出 ${valid.type==='group'?'同數組':'順子'}。`);
      } else { draw(p,1); log('AI 抽 1 張牌。'); }
      checkWin();
      if(!gameOver){ turn=0; log('輪到你。'); render(); }
    }
    function checkWin(){
      if(players[0].tiles.length===0){ gameOver=true; log('你清空牌架，獲勝！'); }
      if(players[1].tiles.length===0){ gameOver=true; log('AI 清空牌架，AI 獲勝。'); }
      if(pool.length===0 && !gameOver){ gameOver=true; const a=scoreLeft(players[0]), b=scoreLeft(players[1]); log(`牌池用完。剩餘點數低者勝：你 ${a} / AI ${b}。`); }
    }
    function scoreLeft(p){ return p.tiles.reduce((a,t)=>a+(t.joker?30:t.value),0); }
    function log(msg){ $('log').innerHTML = `<div>${msg}</div>` + $('log').innerHTML; }
    $('playBtn').onclick=playSelected; $('drawBtn').onclick=drawAndEnd; $('endBtn').onclick=endTurn;
    $('sortValueBtn').onclick=sortValue; $('sortColorBtn').onclick=sortColor; $('newBtn').onclick=newGame;
    newGame();
  </script>
</body>
</html>
