<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="完整國際規則 8x8 西洋棋（Chess）。支援王車易位、吃過路兵、兵升變、將軍/將死/逼和檢測、走棋紀錄、悔棋，以及具備 Alpha-Beta 剪枝與位置評估表的智慧 AI。">
    <title>流光皇家西洋棋 | Neon Royal Chess</title>

    <!-- Google Fonts: Outfit, Inter, Noto Serif TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.09);
            --cyan-neon: #00f2fe;
            --cyan-glow: rgba(0, 242, 254, 0.42);
            --violet-neon: #a855f7;
            --violet-glow: rgba(168, 85, 247, 0.42);
            --gold-neon: #fbbf24;
            --danger-neon: #ff2a5f;
            --emerald-neon: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --board-light: rgba(255, 255, 255, 0.11);
            --board-dark: rgba(15, 23, 42, 0.82);
            --transition-speed: 0.25s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(115px);
            z-index: 0;
            opacity: 0.38;
            pointer-events: none;
            animation: pulse-glow 9s infinite alternate ease-in-out;
        }

        .cyan-ambient {
            background-color: var(--cyan-neon);
            top: 6%;
            left: 8%;
        }

        .violet-ambient {
            background-color: var(--violet-neon);
            bottom: 6%;
            right: 8%;
            animation-delay: 4.5s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.25) translate(25px, 20px); opacity: 0.48; }
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card-glass {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45);
        }

        .screen {
            width: 100%;
            display: none;
            flex-direction: column;
            animation: fade-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Menu Screen --- */
        .game-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.32);
            color: var(--cyan-neon);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2.9rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .logo-text .highlight {
            background: linear-gradient(135deg, var(--cyan-neon), var(--violet-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.25);
        }

        .tagline {
            font-size: 0.92rem;
            color: var(--text-secondary);
            letter-spacing: 3.5px;
            margin-top: 10px;
        }

        .menu-box {
            padding: 30px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .subsection-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .mode-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 600;
            border-radius: 14px;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 17px 22px;
            justify-content: flex-start;
        }

        .btn-mode i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .btn-mode.active {
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--cyan-neon);
            color: var(--cyan-neon);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.2);
        }

        .difficulty-section {
            max-height: 290px;
            opacity: 1;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .difficulty-section.hidden {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .difficulty-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-diff, .btn-order {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 12px 8px;
            font-size: 0.88rem;
            border-radius: 12px;
        }

        .btn-diff:hover, .btn-order:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
        }

        .btn-diff.active {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--violet-neon);
            color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.28);
        }

        .btn-order.active {
            background: rgba(0, 242, 254, 0.12);
            border-color: var(--cyan-neon);
            color: var(--cyan-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.24);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan-neon), #3b82f6);
            color: #030712;
            padding: 17px;
            font-size: 1.08rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.38);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 26px rgba(0, 242, 254, 0.55);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px 15px;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn-secondary-danger {
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.24);
            color: #f87171;
            padding: 12px 15px;
        }

        .btn-secondary-danger:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            transform: translateY(-1px);
        }

        /* --- Game Screen Layout --- */
        .game-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            width: 100%;
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.09);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .nav-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-title span {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .badge-diff {
            font-size: 0.72rem !important;
            background: rgba(168, 85, 247, 0.16);
            border: 1px solid var(--violet-neon);
            color: #d8b4fe;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 1.5px !important;
        }

        .badge-diff.hidden {
            display: none;
        }

        /* Scoreboard */
        .scoreboard-container {
            display: grid;
            grid-template-columns: 1.25fr 0.7fr 1.25fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 12px;
        }

        .score-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .score-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
        }

        .player-avatar.white-side {
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: var(--cyan-neon);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .player-avatar.black-side {
            background: rgba(168, 85, 247, 0.14);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
            text-shadow: 0 0 8px var(--violet-glow);
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .player-score-num {
            font-size: 1.3rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
        }

        .score-card.active-white {
            border-color: var(--cyan-neon);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.25);
            background: rgba(0, 242, 254, 0.06);
        }

        .score-card.active-black {
            border-color: var(--violet-neon);
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.28);
            background: rgba(168, 85, 247, 0.07);
        }

        /* Status Announcement */
        .status-announcement {
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 14px;
            min-height: 36px;
            padding: 7px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-announcement.in-check {
            border-color: rgba(255, 42, 95, 0.55);
            background: rgba(255, 42, 95, 0.1);
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.22);
        }

        .cyan-text { color: var(--cyan-neon); }
        .violet-text { color: #d8b4fe; }
        .gold-text { color: var(--gold-neon); }
        .danger-text { color: var(--danger-neon); }
        .font-bold { font-weight: 700; }

        /* Main Chess Content Grid: Board + Side Panel */
        .chess-workspace {
            display: grid;
            grid-template-columns: minmax(280px, 480px) 1fr;
            gap: 16px;
            width: 100%;
            align-items: stretch;
            margin-bottom: 14px;
        }

        /* Chessboard Frame */
        .board-frame {
            padding: 18px 18px 22px 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chess-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        }

        .chess-board.ai-thinking,
        .chess-board.ai-thinking .square {
            cursor: wait;
            pointer-events: none;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.18s ease;
        }

        .square.light-sq {
            background-color: var(--board-light);
        }

        .square.dark-sq {
            background-color: var(--board-dark);
        }

        .square:hover {
            filter: brightness(1.18);
        }

        .square.selected-sq {
            background-color: rgba(0, 242, 254, 0.28) !important;
            box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.65);
        }

        .square.last-move-sq {
            background-color: rgba(251, 191, 36, 0.2) !important;
        }

        .square.king-in-check {
            background: radial-gradient(circle, rgba(255, 42, 95, 0.75) 10%, rgba(255, 42, 95, 0.2) 80%) !important;
            box-shadow: inset 0 0 16px #ff2a5f;
            animation: check-pulse 1s infinite alternate;
        }

        @keyframes check-pulse {
            from { box-shadow: inset 0 0 10px #ff2a5f; }
            to { box-shadow: inset 0 0 24px #ff2a5f; }
        }

        /* Coordinate Labels inside edge squares */
        .coord-rank {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.62rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .coord-file {
            position: absolute;
            bottom: 1px;
            right: 4px;
            font-size: 0.62rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        /* Legal Move Dots & Capture Rings */
        .square.legal-move::after {
            content: '';
            position: absolute;
            width: 28%;
            height: 28%;
            border-radius: 50%;
            background-color: var(--emerald-neon);
            box-shadow: 0 0 10px var(--emerald-neon);
            opacity: 0.85;
            pointer-events: none;
        }

        .square.legal-capture::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            border: 3px solid var(--danger-neon);
            box-shadow: 0 0 10px var(--danger-neon);
            pointer-events: none;
        }

        /* Chess Pieces */
        .chess-piece {
            font-size: clamp(1.55rem, 4.4vw, 2.35rem);
            line-height: 1;
            z-index: 2;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .square:hover .chess-piece {
            transform: scale(1.08);
        }

        .square.selected-sq .chess-piece {
            transform: translateY(-3px) scale(1.12);
        }

        .chess-piece.white-piece {
            color: #ffffff;
            filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.85)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8));
        }

        .chess-piece.black-piece {
            color: #e9d5ff;
            filter: drop-shadow(0 0 7px rgba(168, 85, 247, 0.95)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.9));
        }

        /* Side Info Panel (Captured + Move History) */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        .captured-panel {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .captured-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .captured-label {
            font-size: 0.74rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .captured-pieces {
            min-height: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            font-size: 1.08rem;
            align-items: center;
        }

        .captured-pieces .cap-w {
            color: #fff;
            filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.7));
        }

        .captured-pieces .cap-b {
            color: #e9d5ff;
            filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.8));
        }

        .history-panel {
            flex: 1;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            min-height: 180px;
            max-height: 290px;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .move-log {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
            font-size: 0.82rem;
        }

        .move-log::-webkit-scrollbar {
            width: 5px;
        }

        .move-log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .move-pair {
            display: grid;
            grid-template-columns: 34px 1fr 1fr;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.025);
            font-family: 'Outfit', monospace;
        }

        .move-num {
            color: var(--text-muted);
        }

        .move-w {
            color: var(--cyan-neon);
        }

        .move-b {
            color: #d8b4fe;
        }

        /* Bottom Controls */
        .game-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .game-controls .btn {
            flex: 1;
        }

        /* Pawn Promotion Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 15, 0.82);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 150;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .promo-card {
            width: 100%;
            max-width: 380px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .promo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            color: var(--gold-neon);
        }

        .promo-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn-promo {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .btn-promo:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--cyan-neon);
            transform: translateY(-3px);
        }

        .btn-promo .promo-icon {
            font-size: 2.1rem;
        }

        .btn-promo .promo-name {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        @media (max-width: 760px) {
            .chess-workspace {
                grid-template-columns: 1fr;
            }
            .board-frame {
                padding: 10px;
            }
            .history-panel {
                max-height: 150px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="app-container">
        <div class="ambient-glow cyan-ambient"></div>
        <div class="ambient-glow violet-ambient"></div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <header class="game-header">
                <div class="logo-badge">
                    <i class="fa-solid fa-chess-king"></i>

    <script>
        // Piece Unicode Glyphs & Base Material Values
        const PIECE_GLYPHS = {

        const PIECE_VALUES = {

            r: 500,
            q: 900,

        // Piece-Square Tables (from White's perspective, row 0 = rank 8, row 7 = rank 1)
        const PST = {
            p: [

                [ 10, 10, 20, 30, 30, 20, 10, 10],
